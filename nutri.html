// ── Buscador ──

// Raíz de una palabra: sin diminutivo (arepita→arep, cafecito→cafe) ni plural (huevos→huevo)

// Busca palabra por palabra contra la palabra principal de cada alimento
// ("Arepita pequeña, dos huevos fritos" → Arepa, Huevo). La última palabra, si
// todavía se está escribiendo, se busca como prefijo ("are" → Arepa).
// No sugiere lo que ya está agregado en esa comida.
function nuCoincidenciasReg(texto, excluir=[]) {
  const q = nuNorm(texto);
  if(q.length<2) return {lista:[]};
  const palabras = q.split(/[^a-zñ]+/).filter(Boolean);
  const escribiendo = !/[\s,.;]$/.test(texto) ? palabras[palabras.length-1] : null;
  // Palabras que cuentan: la primera del nombre siempre; las demás si no son descriptivas
  // ("Pechuga de pollo cocida" → pechuga, pollo; "Atún en agua" → atun)
  const clave = a => {
    const ws = nuNorm(a.nombre).split(/[^a-zñ]+/).filter(Boolean);
    return [ws[0], String(a.norm||'').split(' ')[0]].concat(ws.slice(1).filter(x => x.length>=4 && !NU_NO_CLAVE.includes(x)));
  };
  const lista = [];
  palabras.forEach(w => {
    const raiz = nuRaiz(w);
    nuCatalogo().forEach(a => {
      if(lista.includes(a) || excluir.includes(String(a.id))) return;
      const ok = clave(a).some(k => k && (
        (w===escribiendo && w.length>=2 && w.length<=3 && k.startsWith(w)) ||
        (raiz.length>=3 && ((k.startsWith(raiz) && k.length-raiz.length<=1) || raiz.startsWith(k) && k.length>=4))
      ));
      if(ok) lista.push(a);
    });
  });
  // Lo que tienes en casa va primero
  // Si escribiste el nombre completo de algo (un plato de restaurante), va antes que sus partes
  const completo = a => (String(a.norm||'').includes(' ') && q.includes(String(a.norm).split(' ').slice(0,3).join(' '))) ? 1 : 0;
  lista.sort((x,y) => (nuEstaEnCasa(y) - nuEstaEnCasa(x)) || (completo(y) - completo(x)));
  return {lista: lista.slice(0,6)};
}

const nuCatalogo = () => nuAlimentos.concat(nuPlatos);
const nuEstaEnCasa = a => nuEnCasa.some(d => d.alimento_id && String(d.alimento_id)===String(a.id)) ? 1 : 0;

// Un plato de restaurante se comporta como un alimento con porciones pequeña/mediana/grande.
// Sus valores son estimados: se guardan con estimado=true y Nutri los marca "aprox".
function nuPlatoComoAlimento(pl) {
  const g = Number(pl.porcion_g) || 100, k = 100 / g;
  return {
    id: 'p:' + pl.id, nombre: pl.nombre, norm: pl.norm, categoria: 'plato_restaurante', estimado: true,
    porciones: NU_TAMANOS.map(t => ({u: t.t, g: Math.round(g*t.f)})),
    kcal: pl.calorias*k, proteina: pl.proteina*k, carbo: pl.carbohidratos*k, grasa: pl.grasa*k, fibra: pl.fibra*k,
    calcio_mg: null, vitd_ui: null, lactosa: !!pl.lactosa, cafeina: false
  };
}

function nuBuscar(zona) {
  delete nuSel[zona];
  nuPintarZona(zona);
}

function nuElegir(zona, id) {
  const a = nuCatalogo().find(x => String(x.id)===String(id));
  if(!a) return;
  nuSel[zona] = {a, u: a.estimado ? 1 : 0};   // un plato arranca en "mediana"   // el texto que escribiste no se toca
  nuPintarZona(zona);
}

// Al salir del campo, las sugerencias desaparecen: no quedan colgadas de una comida que ya pasó.
function nuSoltar(zona) { setTimeout(() => nuPintarZona(zona), 250); }

function nuUnidad(zona, k) { if(nuSel[zona]) { nuSel[zona].u = k; nuPintarZona(zona); } }
function nuCancelar(zona) { delete nuSel[zona]; nuPintarZona(zona); }

function nuPintarZona(zona) {
  const el = document.getElementById(`nu-${zona}`);
  if(!el) return;
  let html = nuHtmlFoto(zona) + (zona!=='extra' ? nuHtmlAfuera(zona) : '');
  const btn = document.getElementById(`afuera-btn-${zona}`);
  if(btn) btn.classList.toggle('on', nuEsAfuera(zona));
  const sel = nuSel[zona];
  if(sel) {
    const pors = nuPorciones(sel.a), u = pors[sel.u] || pors[0];
    html += `<div class="nu-picker"><div class="nu-picker-tit"><span>${escapeHtml(sel.a.nombre)}</span><button class="nu-x" aria-label="Cerrar" onclick="nuCancelar('${zona}')">✕</button></div>`;
    if(pors.length>1) html += `<div class="nu-sug">${pors.map((p,k)=>`<button class="nu-chip${k===sel.u?' on':''}" onclick="nuUnidad('${zona}',${k})">${escapeHtml(p.u)}</button>`).join('')}</div>`;
    html += `<div class="nu-sug">${NU_CANTIDADES.map(c=>`<button class="nu-chip" onclick="nuAgregar('${zona}',${c})">${nuFmtCant(c)}${pors.length>1?'':' '+escapeHtml(u.u)}</button>`).join('')}</div>`;
    // Tamaño a ojo, si las porciones no son ya pequeña/mediana/grande
    if(!sel.a.estimado) html += `<div class="nu-sug">${NU_TAMANOS.map(t=>`<button class="nu-chip" onclick="nuAgregar('${zona}',1,'${t.t}')">${t.t}</button>`).join('')}</div>`;
    html += `</div>`;
  } else {
    const input = document.getElementById(nuInputId(zona));
    if(input && document.activeElement===input) {
      const ya = nuItems.filter(x => x.comida===zona && x.alimento_id).map(x => String(x.alimento_id));
      let {lista} = nuCoincidenciasReg(input.value, zona==='extra' ? [] : ya);
      // Campo vacío en casa: lo que tienes en la despensa
      if(!input.value.trim() && !nuEsAfuera(zona)) lista = nuAlimentos.filter(a => nuEstaEnCasa(a) && !ya.includes(String(a.id))).slice(0,6);
      // onmousedown evita que el campo pierda el foco antes de que el toque llegue al chip
      if(lista.length) html += `<div class="nu-sug">${lista.map(a=>`<button class="nu-chip" onmousedown="event.preventDefault()" onclick="nuElegir('${zona}','${a.id}')">${escapeHtml(a.nombre)}${a.estimado?' ~':''}${nuEstaEnCasa(a)?' · en casa':''}</button>`).join('')}</div>`;
    }
  }
  if(zona!=='extra') {
    const items = nuItems.filter(x => x.comida===zona);
    html += nuHtmlTextoIA(zona, items);
    if(items.length) html += `<div class="nu-items">${items.map(x=>`<span class="nu-item${x.estimado?' estimado':''}" onclick="nuAbrirAjuste('${x.id}')">${escapeHtml(x.nombre)}${x.origen==='texto'||x.origen==='foto'?'*':''} · ${(x.origen==='foto'||x.origen==='texto') ? Math.round(x.gramos||0)+' g' : nuFmtCant(Number(x.cantidad))+' '+escapeHtml(x.unidad||'')}<button class="nu-x" onclick="event.stopPropagation();nuBorrarItem('${x.id}')">✕</button></span>`).join('')}</div>`;
    const aj = nuAjuste && items.find(x => String(x.id)===String(nuAjuste.id));
    if(aj) html += `<div class="nu-ajuste"><span>menos</span><input type="range" min="50" max="150" step="10" value="${nuAjuste.pct}" oninput="nuMoverAjuste(this.value)" onchange="nuGuardarAjuste()"><span>más</span><span id="nu-ajuste-g">${Math.round(nuAjuste.base.gramos*nuAjuste.pct/100)} g</span></div>`;
    // La digestión aparece sólo cuando ya comió: antes no hay nada que preguntar.
    if((todayData.comidas||{})[zona] || items.length) {
      const dig = nuDigestionHtml(zona, '');
      html += `<div class="nu-dig"><span class="nu-dig-lbl">¿Cómo te cayó?</span>${dig.botones}</div>${dig.sintomas}`;
    }
  }
  el.innerHTML = html;
}

async function nuAgregar(zona, cant, tamano) {
  const sel = nuSel[zona];
  if(!sel) return;
  const a = sel.a, pors = nuPorciones(a);
  let u = pors[sel.u] || pors[0];
  // "pequeña / mediana / grande" sobre la porción elegida, cuando la cantidad es a ojo
  if(tamano) { const t = NU_TAMANOS.find(x => x.t===tamano); u = {u: `${u.u} ${t.t}`, g: u.g*t.f}; cant = 1; }
  const gramos = Math.round(cant*u.g*10)/10, f = gramos/100;
  const fila = {
    fecha: fechaActiva, comida: zona, extra_ref: null,
    alimento_id: (a.id && !nuEsTmp(a.id) && !String(a.id).startsWith('p:')) ? a.id : null, codigo_barras: a.codigo_barras || null,
    estimado: !!a.estimado, origen: a.estimado ? 'plato' : (a.codigo_barras ? 'empacado' : 'base'),
    nombre: a.nombre, cantidad: cant, unidad: u.u, gramos,
    kcal: nuRed(a.kcal,f), proteina: nuRed(a.proteina,f), carbo: nuRed(a.carbo,f), grasa: nuRed(a.grasa,f),
    fibra: nuRed(a.fibra,f), calcio_mg: nuRed(a.calcio_mg,f), vitd_ui: nuRed(a.vitd_ui,f),
    lactosa: !!a.lactosa, cafeina: !!a.cafeina
  };
  delete nuSel[zona];
  if(zona==='extra') {
    if(!Array.isArray(todayData.extras)) todayData.extras = [];
    fila.extra_ref = nuIdExtra();
    todayData.extras.push({id: fila.extra_ref, hora: horaActualHHMM(), texto: `${a.nombre} · ${nuFmtCant(cant)} ${u.u}`});
    saveTodayLocal();
    const inEx = document.getElementById('input-extra'); if(inEx) inEx.value = '';
  } else if(!(todayData.comidas||{})[Number(zona)]) {
    toggleComida(Number(zona));   // anotar lo que comiste también marca la comida
  }
  nuItems.push(fila);
  zona==='extra' ? buildExtras() : nuPintarZona(zona);
  Object.assign(fila, await nuInsertar('comidas_items', fila));
  if(zona!=='extra') nuPintarZona(zona);
}

async function nuBorrarItem(id) {
  const x = nuItems.find(y => String(y.id)===String(id));
  if(!x) return;
  nuItems = nuItems.filter(y => y!==x);
  nuPintarZona(x.comida);
  await nuBorrarFila('comidas_items', x.id);
}

async function nuBorrarDeExtra(ref) {
  const items = nuItems.filter(x => x.extra_ref===ref);
  const digs = nuDig.filter(x => x.comida==='extra' && x.extra_ref===ref);
  nuItems = nuItems.filter(x => !items.includes(x));
  nuDig = nuDig.filter(x => !digs.includes(x));
  for(const x of items) await nuBorrarFila('comidas_items', x.id);
  // Si había un guardado de digestión en espera para este extra, ya no aplica: se borra por clave
  const kDig = fechaActiva+'|'+nuClaveDig('extra', ref);
  clearTimeout(nuDigTimers[kDig]); delete nuDigTimers[kDig]; delete nuDigSucio[kDig];
  nuDigSucio[kDig] = {fecha: fechaActiva, comida: 'extra', ref, fila: null, ver: 1};
  nuDigVolcar(kDig);
}

// ── ✨ Texto libre → IA ──
// Al terminar de escribir una comida (o al agregar algo en "Algo de más"), la IA lee el
// texto y lo convierte en alimentos con gramos y nutrientes ESTIMADOS (origen 'texto').
// Esos sí suman en Nutri, marcados con *. Si la comida ya tiene alimentos del buscador,
// no se analiza el texto (sería contar dos veces).
const nuTextoDe = (zona, ref) => zona==='extra'
  ? ((todayData.extras||[]).find(e => e.id===ref) || {}).texto || ''
  : ((todayData.comidas_texto||{})[zona] || '');
const nuItemsDe = (zona, ref) => nuItems.filter(x => x.comida===zona && (zona!=='extra' || x.extra_ref===ref));
const nuTieneManual = (zona, ref) => nuItemsDe(zona, ref).some(x => x.origen!=='texto');
const nuYaLeido = (zona, ref, texto) => ((nuDetDe(zona, ref) || {}).texto_analizado || '') === texto.trim();

function nuTextoListo(zona) {
  // Espera a que el toque de un chip (si lo hubo) termine antes de decidir
  setTimeout(() => {
    const texto = nuTextoDe(zona, '').trim();
    if(!texto) {   // borraste el texto: lo que la IA había leído de él también se va
      const viejos = nuItemsDe(zona, '').filter(x => x.origen==='texto');
      if(viejos.length) { nuItems = nuItems.filter(x => !viejos.includes(x)); nuPintarZona(zona); viejos.forEach(v => nuBorrarFila('comidas_items', v.id)); nuGuardarDetalle(zona, '', {texto_analizado: null, analisis_texto: null}); }
      return;
    }
    if(texto.length < 3 || nuTieneManual(zona, '') || nuYaLeido(zona, '', texto)) return;
    nuAnalizarTexto(zona, '', texto);
  }, 400);
}

async function nuAnalizarTexto(zona, ref, texto) {
  texto = String(texto || nuTextoDe(zona, ref)).trim();
  if(texto.length < 3) return;
  const k = nuClaveDig(zona, ref);
  nuLeyendoTexto[k] = true; delete nuErrorTexto[k];
  nuRepintarTexto(zona);
  let datos = null;
  try {
    const r = await fetch(`${SUPABASE_URL}/functions/v1/analizar-plato`, {
      method: 'POST', body: JSON.stringify({texto}),
      headers: {'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json'}
    });
    const j = await r.json().catch(() => ({}));
    if(r.ok) datos = j;
    else nuErrorTexto[k] = ({falta_llave: 'Falta la llave de la IA en Supabase', ocupado: 'IA ocupada, intenta luego', no_autorizado: 'Vuelve a entrar'})[j.error] || 'La IA no pudo leerlo';
  } catch(e) { console.error(e); nuErrorTexto[k] = 'Sin conexión'; }
  nuLeyendoTexto[k] = false;
  // Si mientras tanto agregaste alimentos con el buscador o cambiaste el texto, no se usa
  if(!datos || nuTieneManual(zona, ref) || nuTextoDe(zona, ref).trim()!==texto) { nuRepintarTexto(zona); return; }

  // Reemplaza lo que la IA hubiera leído antes de esta misma comida
  const viejos = nuItemsDe(zona, ref).filter(x => x.origen==='texto');
  nuItems = nuItems.filter(x => !viejos.includes(x));
  const n = v => (v==null || v==='' || isNaN(Number(v))) ? null : Math.round(Number(v)*10)/10;
  const filas = (datos.ingredientes || []).map(x => ({
    fecha: fechaActiva, comida: zona, extra_ref: zona==='extra' ? ref : null, alimento_id: null, codigo_barras: null,
    nombre: x.nombre, cantidad: 1, unidad: 'texto', gramos: n(x.gramos),
    kcal: n(x.kcal), proteina: n(x.proteina), carbo: n(x.carbo), grasa: n(x.grasa), fibra: n(x.fibra),
    calcio_mg: null, vitd_ui: null, lactosa: !!x.lactosa, cafeina: false, estimado: true, origen: 'texto'
  }));
  filas.forEach(f => nuItems.push(f));
  nuRepintarTexto(zona);
  await nuGuardarDetalle(zona, ref, {texto_analizado: texto, analisis_texto: datos});
  for(const v of viejos) await nuBorrarFila('comidas_items', v.id);
  for(const f of filas) Object.assign(f, await nuInsertar('comidas_items', f));
}

function nuRepintarTexto(zona) { zona==='extra' ? buildExtras() : nuPintarZona(zona); }

// Línea bajo una comida descrita en texto: leyendo / cuánto suma / ✨ calcular
function nuHtmlTextoIA(zona, items) {
  const k = nuClaveDig(zona, '');
  if(nuLeyendoTexto[k]) return `<div class="nu-mini">✨ La IA está leyendo lo que escribiste…</div>`;
  const texto = nuTextoDe(zona, '').trim();
  if(!texto || items.some(x => x.origen!=='texto')) return '';
  const ia = items.filter(x => x.origen==='texto');
  if(ia.length) return '';   // ya se ven como alimentos con *
  const err = nuErrorTexto[k] ? `${escapeHtml(nuErrorTexto[k])} · ` : '';
  return `<div class="nu-mini">${err}<button class="nu-accion" onclick="nuAnalizarTexto('${zona}','')"><i class="t-ico t-ico-chispa"></i> <span>Calcular con IA</span></button></div>`;
}

function nuHtmlExtraIA(x) {
  const k = nuClaveDig('extra', x.id);
  if(nuLeyendoTexto[k]) return ` <span class="nu-mini">· ✨ leyendo…</span>`;
  const its = nuItemsDe('extra', x.id);
  if(its.some(i => i.origen!=='texto')) return '';
  if(its.length) return ` <span class="nu-mini">· ${Math.round(its.reduce((a,i) => a + (Number(i.kcal)||0), 0))}* kcal</span>`;
  return ` <button class="nu-accion" onclick="nuAnalizarTexto('extra','${x.id}')" aria-label="Calcular con IA"><i class="t-ico t-ico-chispa"></i></button>`;
}

// ── 🍽️ Fotografiar plato: la IA mira la foto y precarga la comida ──
// No es el escáner de códigos (ese vive en Nutri › Despensa). La foto va al bucket
// privado "platos"; la función analizar-plato (Claude) devuelve ingredientes,
// gramos y nutrientes estimados. Nada se guarda como comida hasta que confirmes.
function nuFoto(zona) {
  nuZonaFoto = zona;
  const f = document.getElementById('nu-plato-foto');
  if(f) { f.value = ''; f.click(); }
}

// Achica la foto (las del celular pesan varios MB) y la devuelve en JPEG
async function nuAchicarFoto(file, lado=1280) {
  const img = await new Promise((ok, mal) => { const i = new Image(); i.onload = () => ok(i); i.onerror = mal; i.src = URL.createObjectURL(file); });
  const k = Math.min(1, lado / Math.max(img.naturalWidth, img.naturalHeight));
  const cv = document.createElement('canvas');
  cv.width = Math.round(img.naturalWidth*k); cv.height = Math.round(img.naturalHeight*k);
  cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
  URL.revokeObjectURL(img.src);
  const blob = await new Promise(ok => cv.toBlob(ok, 'image/jpeg', 0.85));
  const b64 = cv.toDataURL('image/jpeg', 0.85).split(',')[1];
  return {blob, b64};
}

async function nuPlatoElegido(input) {
  const file = input.files && input.files[0];
  const zona = nuZonaFoto;
  if(!file || zona==null) return;
  nuAnalizando[zona] = true; delete nuRevision[zona];
  nuPintarZona(zona);
  let foto;
  try { foto = await nuAchicarFoto(file); }
  catch(e) { console.error(e); nuAnalizando[zona] = false; nuRevision[zona] = {error: 'No pude abrir esa foto.'}; nuPintarZona(zona); return; }

  // 1. Guardar la foto (si falla, igual se analiza)
  let ruta = `${fechaActiva}/${zona}-${Date.now()}.jpg`;
  try {
    const r = await fetch(`${SUPABASE_URL}/storage/v1/object/platos/${ruta}`, {
      method: 'POST', body: foto.blob,
      headers: {'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'image/jpeg'}
    });
    if(!r.ok) ruta = null;
  } catch(e) { console.error(e); ruta = null; }

  // 2. Que la IA la mire
  let datos = null, error = null;
  try {
    const r = await fetch(`${SUPABASE_URL}/functions/v1/analizar-plato`, {
      method: 'POST', body: JSON.stringify({imagen: foto.b64, media_type: 'image/jpeg'}),
      headers: {'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json'}
    });
    const j = await r.json().catch(() => ({}));
    if(r.ok) datos = j;
    else error = ({falta_llave: 'Falta conectar la llave de la IA en Supabase.', llave_invalida: 'La llave de la IA no funciona: revísala en Supabase.',
                   ocupado: 'La IA está ocupada; intenta en un minuto.', no_autorizado: 'Tu sesión venció: vuelve a entrar.'})[j.error]
            || 'No pude analizar la foto. Puedes escribir la comida.';
  } catch(e) { console.error(e); error = 'Sin conexión: no pude analizar la foto.'; }

  nuAnalizando[zona] = false;
  const ref = zona==='extra' ? nuIdExtra() : '';
  await nuGuardarDetalle(zona, ref, {foto_path: ruta, analisis: datos || {error}});
  if(error) { nuRevision[zona] = {error}; nuPintarZona(zona); return; }
  const ings = (datos.ingredientes||[]).map(x => Object.assign({on: true}, x));
  if(!ings.length) { nuRevision[zona] = {error: datos.nota || 'No vi comida en la foto.'}; nuPintarZona(zona); return; }
  nuRevision[zona] = {plato: datos.plato || 'Plato', confianza: datos.confianza || '', nota: datos.nota || '', ings, ref};
  nuPintarZona(zona);
}

function nuHtmlFoto(zona) {
  if(nuAnalizando[zona]) return `<div class="nu-panel">Mirando la foto…</div>`;
  const r = nuRevision[zona];
  if(!r) return '';
  if(r.error) return `<div class="nu-panel"><div class="nu-panel-tit"><span>${escapeHtml(r.error)}</span><button class="nu-x" onclick="nuDescartarFoto('${zona}')">✕</button></div></div>`;
  const tot = r.ings.filter(x => x.on).reduce((a,x) => a + (Number(x.kcal)||0), 0);
  return `<div class="nu-panel">
    <div class="nu-panel-tit"><span>${escapeHtml(r.plato)} · aprox ${Math.round(tot)} kcal</span><button class="nu-x" onclick="nuDescartarFoto('${zona}')">✕</button></div>
    <div class="nu-panel-nota">Estimado por la foto${r.confianza ? ' · confianza '+escapeHtml(r.confianza) : ''}${r.nota ? '. '+escapeHtml(r.nota) : ''}. Toca lo que no comiste.</div>
    ${r.ings.map((x,k) => `<div class="nu-ing${x.on?'':' off'}" onclick="nuToggleIng('${zona}',${k})"><span>${escapeHtml(x.nombre)}</span><b>${Math.round(x.gramos||0)} g</b></div>`).join('')}
    <button class="nu-confirmar" onclick="nuConfirmarFoto('${zona}')">Confirmar</button>
  </div>`;
}

function nuToggleIng(zona, k) { const r = nuRevision[zona]; if(r && r.ings[k]) { r.ings[k].on = !r.ings[k].on; nuPintarZona(zona); } }
function nuDescartarFoto(zona) { delete nuRevision[zona]; nuPintarZona(zona); }

async function nuConfirmarFoto(zona) {
  const r = nuRevision[zona];
  if(!r || !r.ings) return;
  const elegidos = r.ings.filter(x => x.on);
  delete nuRevision[zona];
  if(!elegidos.length) { nuPintarZona(zona); return; }
  if(zona==='extra') {
    if(!Array.isArray(todayData.extras)) todayData.extras = [];
    todayData.extras.push({id: r.ref, hora: horaActualHHMM(), texto: `${r.plato} (foto)`});
    saveTodayLocal();
  } else {
    if(!(todayData.comidas||{})[Number(zona)]) toggleComida(Number(zona));
    // Si no escribiste nada, el nombre del plato queda como descripción
    const input = document.getElementById(nuInputId(zona));
    if(input && !input.value.trim()) { input.value = r.plato; saveComidaTexto(Number(zona)); }
  }
  const n = v => (v==null || v==='' || isNaN(Number(v))) ? null : Math.round(Number(v)*10)/10;
  const filas = elegidos.map(x => ({
    fecha: fechaActiva, comida: zona, extra_ref: zona==='extra' ? r.ref : null, alimento_id: null, codigo_barras: null,
    nombre: x.nombre, cantidad: 1, unidad: 'foto', gramos: n(x.gramos),
    kcal: n(x.kcal), proteina: n(x.proteina), carbo: n(x.carbo), grasa: n(x.grasa), fibra: n(x.fibra),
    calcio_mg: null, vitd_ui: null, lactosa: !!x.lactosa, cafeina: false, estimado: true, origen: 'foto'
  }));
  filas.forEach(f => nuItems.push(f));
  zona==='extra' ? buildExtras() : nuPintarZona(zona);
  for(const f of filas) Object.assign(f, await nuInsertar('comidas_items', f));
  if(zona!=='extra') nuPintarZona(zona);
}

// ── 🍴 Comí afuera: restaurante, tipo de cocina y ocasión (todo opcional) ──
const nuDetDe = (zona, ref='') => nuDet.find(d => d.comida===zona && (d.extra_ref||'')===(ref||''));
const nuEsAfuera = zona => !!(nuDetDe(zona) || {}).afuera;

async function nuGuardarDetalle(zona, ref, cambios) {
  const previo = nuDetDe(zona, ref) || {};
  const fila = {
    fecha: fechaActiva, comida: zona, extra_ref: ref || '',
    afuera: !!previo.afuera, restaurante: previo.restaurante || null, cocina: previo.cocina || null, ocasion: previo.ocasion || null,
    foto_path: previo.foto_path || null, analisis: previo.analisis || null,
    texto_analizado: previo.texto_analizado || null, analisis_texto: previo.analisis_texto || null,
    ...cambios, actualizado: new Date().toISOString()
  };
  nuDet = nuDet.filter(d => d!==previo); nuDet.push(fila);
  // En fila, uno tras otro, y cada envío manda el estado MÁS RECIENTE. Antes, dos toques
  // seguidos (cocina y ocasión) salían a la vez y el viejo podía llegar último y pisar al nuevo.
  const k = nuClaveDig(zona, ref);
  nuDetGuardando++;
  const envio = (nuDetEnFila[k] || Promise.resolve()).then(async () => {
    const a = nuDetDe(zona, ref) || fila;
    const cuerpo = {fecha: a.fecha, comida: a.comida, extra_ref: a.extra_ref || '', afuera: !!a.afuera,
      restaurante: a.restaurante ?? null, cocina: a.cocina ?? null, ocasion: a.ocasion ?? null,
      foto_path: a.foto_path ?? null, analisis: a.analisis ?? null,
      texto_analizado: a.texto_analizado ?? null, analisis_texto: a.analisis_texto ?? null, actualizado: a.actualizado};
    const r = await nuInsertar('comidas_detalle', cuerpo, '?on_conflict=fecha,comida,extra_ref');
    if(r && r.id) a.id = r.id;
  }).finally(() => { nuDetGuardando--; });
  nuDetEnFila[k] = envio.catch(() => {});
  return envio;
}

async function nuAfuera(zona) {
  const abrir = !nuEsAfuera(zona);
  // Desactivar = no comiste afuera: se borran restaurante, cocina y ocasión
  const guardado = nuGuardarDetalle(zona, '', abrir ? {afuera: true} : {afuera: false, restaurante: null, cocina: null, ocasion: null});
  const panel = document.getElementById(`afuera-${zona}`);
  const btn = document.getElementById(`afuera-btn-${zona}`);
  if(btn) btn.classList.toggle('on', abrir);
  if(panel) {
    if(!abrir) { panel.querySelectorAll('.nu-chip.on').forEach(c => c.classList.remove('on')); const r = panel.querySelector('.nu-campo'); if(r) r.value = ''; }
    panel.classList.toggle('abierto', abrir);
  } else nuPintarZona(zona);
  await guardado;
}

function nuHtmlAfuera(zona) {
  const d = nuDetDe(zona) || {};
  return `<div class="nu-afuera${d.afuera ? ' abierto' : ''}" id="afuera-${zona}"><div class="nu-afuera-in"><div class="nu-panel">
    <input class="nu-campo" type="text" placeholder="Restaurante" value="${escapeHtml(d.restaurante||'')}" onchange="nuDetCampo('${zona}','restaurante',this.value.trim()||null)">
    <div class="nu-sug">${COCINAS.map(c=>`<button class="nu-chip${d.cocina===c?' on':''}" onclick="nuDetCampo('${zona}','cocina','${c}')">${c}</button>`).join('')}</div>
    <div class="nu-sug">${OCASIONES.map(o=>`<button class="nu-chip${d.ocasion===o?' on':''}" onclick="nuDetCampo('${zona}','ocasion','${o}')">${o}</button>`).join('')}</div>
    <div class="nu-mini">Si sabes qué traía, búscalo arriba en la descripción y agrégalo.</div>
  </div></div></div>`;
}

async function nuDetCampo(zona, campo, valor) {
  const d = nuDetDe(zona) || {};
  if((campo==='cocina' || campo==='ocasion') && d[campo]===valor) valor = null;   // tocar otra vez lo quita
  await nuGuardarDetalle(zona, '', {[campo]: valor});
  nuPintarZona(zona);
}

// ── Menos / más: ajustar a ojo la cantidad de algo ya anotado ──
function nuAbrirAjuste(id) {
  const x = nuItems.find(y => String(y.id)===String(id));
  if(!x) return;
  nuAjuste = (nuAjuste && String(nuAjuste.id)===String(id)) ? null : {id: x.id, pct: 100, base: Object.assign({}, x)};
  nuPintarZona(x.comida);
}

function nuMoverAjuste(v) {
  if(!nuAjuste) return;
  nuAjuste.pct = Number(v);
  const el = document.getElementById('nu-ajuste-g');
  if(el) el.textContent = `${Math.round(nuAjuste.base.gramos*nuAjuste.pct/100)} g`;
}

async function nuGuardarAjuste() {
  if(!nuAjuste) return;
  const x = nuItems.find(y => String(y.id)===String(nuAjuste.id));
  if(!x) return;
  const f = nuAjuste.pct/100, b = nuAjuste.base;
  const esc = v => v==null ? null : Math.round(Number(v)*f*10)/10;
  const cambios = {cantidad: esc(b.cantidad), gramos: esc(b.gramos), kcal: esc(b.kcal), proteina: esc(b.proteina), carbo: esc(b.carbo),
                   grasa: esc(b.grasa), fibra: esc(b.fibra), calcio_mg: esc(b.calcio_mg), vitd_ui: esc(b.vitd_ui)};
  Object.assign(x, cambios);
  await nuActualizar('comidas_items', x, cambios);
}

// ── Digestión: 👍😐👎 y, si no fue bien, síntomas opcionales ──
function nuDigestionHtml(comida, ref) {
  const d = nuDig.find(x => nuClaveDig(x.comida,x.extra_ref)===nuClaveDig(comida,ref));
  const r = d ? d.reaccion : null;
  const botones = `<span class="nu-dig">${DIGESTION.map(o=>`<button class="nu-dig-btn${r===o.id?' on':''}" onclick="nuDigestion('${comida}','${ref}','${o.id}')">${o.e}</button>`).join('')}</span>`;
  const s = (d && d.sintomas) || [];
  // Los síntomas se ven sólo mientras los estás escogiendo; al guardar se esconden y queda la carita
  const sintomas = (r && r!=='bien' && nuDigAbierto[fechaActiva+'|'+nuClaveDig(comida,ref)])
    ? `<div class="nu-sint">${DIGESTION_SINTOMAS.map(t=>`<button class="nu-chip${s.includes(t)?' on':''}" onclick="nuSintoma('${comida}','${ref}','${t}')">${t}</button>`).join('')}</div>`
    : '';
  return {botones, sintomas};
}

function nuRepintarDig(comida) { comida==='extra' ? buildExtras() : nuPintarZona(comida); }

// Cada toque sólo cambia la pantalla. La escritura sale UNA vez, cuando dejas de tocar
// (o al salir de la app). Antes cada toque mandaba su propia escritura: varias en vuelo a
// la vez podían llegar desordenadas y dejar en la base menos síntomas de los que veías,
// y el refresco de 45 s traía de vuelta ese estado viejo.
const NU_DIG_ESPERA = 1200;
let nuDigSucio = {};   // fecha|comida|ref -> {fecha, comida, ref, fila|null, ver}: aún no está en la base
let nuDigTimers = {};
let nuDigCadena = {};  // un guardado a la vez por comida
let nuDigAbierto = {}; // comidas cuyos síntomas se están escogiendo ahora (se cierran al guardar)

function nuDigMarcar(fecha, comida, ref, fila) {
  const k = fecha+'|'+nuClaveDig(comida, ref);
  const ver = ((nuDigSucio[k]||{}).ver||0) + 1;
  nuDigSucio[k] = {fecha, comida, ref: ref||'', fila, ver};
  clearTimeout(nuDigTimers[k]);
  nuDigTimers[k] = setTimeout(() => nuDigVolcar(k), NU_DIG_ESPERA);
}

function nuDigVolcar(k) {
  clearTimeout(nuDigTimers[k]); delete nuDigTimers[k];
  const cerrar = nuDigAbierto[k] && nuDigSucio[k];
  delete nuDigAbierto[k];
  if(cerrar && cerrar.fecha===fechaActiva) nuRepintarDig(cerrar.comida);
  nuDigCadena[k] = (nuDigCadena[k] || Promise.resolve()).then(async () => {
    const e = nuDigSucio[k];
    if(!e) return;
    try { await nuDigEscribir(e); }
    finally { if(nuDigSucio[k] && nuDigSucio[k].ver===e.ver) delete nuDigSucio[k]; }
  }).catch(err => console.error('Error guardando digestión:', err));
  return nuDigCadena[k];
}

function nuDigVolcarTodo() { Object.keys(nuDigSucio).forEach(nuDigVolcar); }

async function nuDigEscribir(e) {
  const mismaClave = o => o.body.fecha===e.fecha && o.body.comida===e.comida && (o.body.extra_ref||'')===e.ref;
  if(!e.fila) {   // reacción quitada
    nuColaGuardar(nuColaLeer().filter(o => !(o.tabla==='comidas_digestion' && mismaClave(o))));
    setSyncing(true);
    try {
      const r = await sbLog('comidas_digestion', 'DELETE', null,
        `?fecha=eq.${e.fecha}&comida=eq.${encodeURIComponent(e.comida)}&extra_ref=eq.${encodeURIComponent(e.ref)}`);
      if(!r.ok) throw new Error('HTTP '+r.status);
      setSyncing(false); clearSyncError();
    } catch(err) { console.error(err); setSyncError(); }
    return;
  }
  const f = e.fila;
  const r = await nuInsertar('comidas_digestion',
    {fecha: e.fecha, comida: e.comida, extra_ref: e.ref, reaccion: f.reaccion||null, sintomas: f.sintomas||[], hora: f.hora||null},
    '?on_conflict=fecha,comida,extra_ref');
  if(r && r.id) f.id = r.id;
}

// Lo que todavía no llegó a la base gana sobre lo que trae el servidor
function nuDigAplicarPendientes(fecha) {
  Object.values(nuDigSucio).filter(e => e.fecha===fecha).forEach(e => {
    nuDig = nuDig.filter(x => nuClaveDig(x.comida,x.extra_ref)!==nuClaveDig(e.comida,e.ref));
    if(e.fila) nuDig.push(e.fila);
  });
}

function nuDigCambiar(comida, ref, cambios) {   // cambios === null quita la reacción
  const previo = nuDig.find(x => nuClaveDig(x.comida,x.extra_ref)===nuClaveDig(comida,ref));
  nuDig = nuDig.filter(x => x!==previo);
  let fila = null;
  if(cambios) {
    fila = Object.assign({fecha: fechaActiva, comida, extra_ref: ref||'', reaccion: null, sintomas: []}, previo, cambios);
    fila.hora = (previo && previo.hora) || nuHoraSiHoy();
    nuDig.push(fila);
  }
  nuRepintarDig(comida);
  nuDigMarcar(fechaActiva, comida, ref, fila);
}

function nuDigestion(comida, ref, reaccion) {
  const previo = nuDig.find(x => nuClaveDig(x.comida,x.extra_ref)===nuClaveDig(comida,ref));
  const kAbierto = fechaActiva+'|'+nuClaveDig(comida,ref);
  if(previo && previo.reaccion===reaccion) { delete nuDigAbierto[kAbierto]; return nuDigCambiar(comida, ref, null); }   // tocar el mismo otra vez lo quita
  if(reaccion==='bien') delete nuDigAbierto[kAbierto]; else nuDigAbierto[kAbierto] = true;
  nuDigCambiar(comida, ref, {reaccion, sintomas: reaccion==='bien' ? [] : ((previo && previo.sintomas) || [])});
}

function nuSintoma(comida, ref, s) {
  const d = nuDig.find(x => nuClaveDig(x.comida,x.extra_ref)===nuClaveDig(comida,ref));
  if(!d) return;
  const actual = d.sintomas || [];
  nuDigCambiar(comida, ref, {sintomas: actual.includes(s) ? actual.filter(x => x!==s) : actual.concat(s)});
}

// ── 🚽 Baño: un tap = una vez, con hora. Tipo y molestias se afinan después, si quiere ──
async function registrarBano() {
  const fila = {fecha: fechaActiva, hora: nuHoraSiHoy(), tipo: null, bristol: null, molestias: []};
  banosDia.push(fila);
  banoAbierto = fila;
  buildBanos();
  Object.assign(fila, await nuInsertar('banos', fila));
}

function buildBanos() {
  const lista = document.getElementById('banos-list');
  const cont = document.getElementById('banos-count');
  if(!lista) return;
  if(cont) cont.textContent = banosDia.length ? `· ${banosDia.length}` : '';
  banosDia.sort((a,b) => (a.hora||'').localeCompare(b.hora||''));   // si corriges una hora, la lista sigue en orden
  lista.innerHTML = banosDia.map((b,i) => {
    const tipo = BANO_TIPOS.find(t => t.id===b.tipo);
    const mol = (b.molestias||[]).map(m => (BANO_MOLESTIAS.find(x => x.id===m) || {t:m}).t).join(', ');
    let h = `<div class="extra-item" onclick="abrirBano(${i})">
      <span class="extra-hora comida-hora" onclick="event.stopPropagation();editarHoraBano(${i})">${b.hora ? formatHora12(b.hora) : '—'}</span>
      <span class="extra-texto">${tipo ? tipo.t : ''}${tipo && mol ? ' · ' : ''}${escapeHtml(mol)}</span>
      <button class="log-del" onclick="event.stopPropagation();borrarBano(${i})">✕</button>
    </div>`;
    if(b===banoAbierto) h += `<div class="bano-panel">
      <div class="nu-sint">${BANO_TIPOS.map(t=>`<button class="nu-chip${t.id===b.tipo?' on':''}" onclick="tipoBano(${i},'${t.id}')">${t.t}</button>`).join('')}</div>
      <div class="nu-sint">${BANO_MOLESTIAS.map(m=>`<button class="nu-chip${(b.molestias||[]).includes(m.id)?' on':''}" onclick="molestiaBano(${i},'${m.id}')">${m.t}</button>`).join('')}</div>
    </div>`;
    return h;
  }).join('');
}

// Corregir la hora de un baño, tocándola en la lista (mismo gesto que fumado y comidas)
async function editarHoraBano(i) {
  const b = banosDia[i]; if(!b) return;
  const val = prompt('¿A qué hora fue? (formato 24h, ej. 14:30)', String(b.hora||'').slice(0,5));
  if(val===null) return;
  const limpio = val.trim();
  if(!/^\d{1,2}:\d{2}$/.test(limpio)) { alert('Escribe la hora así: 14:30'); return; }
  const [hh,mm] = limpio.split(':').map(n=>parseInt(n,10));
  if(hh>23 || mm>59) { alert('Esa hora no existe.'); return; }
  b.hora = `${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
  buildBanos();
  await nuActualizar('banos', b, {hora: b.hora});
}

function abrirBano(i) { banoAbierto = banosDia[i]===banoAbierto ? null : banosDia[i]; buildBanos(); }

async function tipoBano(i, id) {
  const b = banosDia[i]; if(!b) return;
  const t = b.tipo===id ? null : BANO_TIPOS.find(x => x.id===id);
  b.tipo = t ? t.id : null; b.bristol = t ? t.bristol : null;
  buildBanos();
  await nuActualizar('banos', b, {tipo: b.tipo, bristol: b.bristol});
}

async function molestiaBano(i, id) {
  const b = banosDia[i]; if(!b) return;
  const m = b.molestias || [];
  b.molestias = m.includes(id) ? m.filter(x => x!==id) : m.concat(id);
  buildBanos();
  await nuActualizar('banos', b, {molestias: b.molestias});
}

async function borrarBano(i) {
  const b = banosDia.splice(i,1)[0]; if(!b) return;
  if(b===banoAbierto) banoAbierto = null;
  buildBanos();
  await nuBorrarFila('banos', b.id);
}

// ── COMIDAS PROGRESIVAS ──
// Cada comida tiene tres estados: sin responder, la comió (con la hora a la que la registró)
// o "no la comí". Marcar que NO la comió también abre la siguiente: muchos días no desayuna
// pero sí almuerza, y eso es un dato, no un hueco. Lo explícito se guarda aparte de lo
// vacío: `comidas` (true = comió), `comidas_omitidas` (true = no la comió), `comidas_hora`.
const COMIDAS = [
  {nombre:'Desayuno', mensajeHecho:'Desayunaste ✓', mensajePendiente:'Toca cuando desayunes', botonOmitir:'No desayuné', mensajeOmitida:'No desayuné', verbo:'desayunaste'},
  {nombre:'Almuerzo', mensajeHecho:'Almorzaste ✓', mensajePendiente:'Toca cuando almuerces', botonOmitir:'No almorcé', mensajeOmitida:'No almorcé', verbo:'almorzaste'},
  {nombre:'Cena', mensajeHecho:'Cenaste ✓', mensajePendiente:'Toca cuando cenes', botonOmitir:'No cené', mensajeOmitida:'No cené', verbo:'cenaste'},
];

function asegurarComidas() {
  if(!todayData.comidas) todayData.comidas={};
  if(!todayData.comidas_omitidas) todayData.comidas_omitidas={};
  if(!todayData.comidas_hora) todayData.comidas_hora={};
}

function toggleComida(i) {
  asegurarComidas();
  const activando=!todayData.comidas[i];
  todayData.comidas[i]=activando;
  if(activando) {
    todayData.comidas_omitidas[i]=false;   // comer deshace "no la comí"
    // La hora es la de este momento (la idea es registrar al terminar de comer). Solo si se
    // está viendo el día de hoy: en un día pasado no se inventa una hora, se deja vacía.
    todayData.comidas_hora[i] = (fechaActiva===fechaDeAhora()) ? horaActualHHMM() : '';
  } else {
    todayData.comidas_hora[i]='';
  }
  saveTodayLocal();
  updateComidasUI(activando ? i : -1);
  updateAnclaUI();

  if(activando) {
    if(i<2) {
      mostrarRecompensa(`🍽️ ${COMIDAS[i].nombre} registrado. ${COMIDAS[i+1].nombre} desbloqueado`);
    } else {
      mostrarRecompensa('🌿 Tres comidas hoy. Eso es cuidarte de verdad');
    }
  }
}

// "No desayuné": queda explícito (no es un chulito vacío) y abre la siguiente comida.
// Tocarlo otra vez ("Deshacer") lo quita.
function toggleOmitida(i) {
  asegurarComidas();
  const omitiendo=!todayData.comidas_omitidas[i];
  todayData.comidas_omitidas[i]=omitiendo;
  if(omitiendo) { todayData.comidas[i]=false; todayData.comidas_hora[i]=''; }
  saveTodayLocal();
  updateComidasUI(omitiendo ? i : -1);
  updateAnclaUI();
}

// Corregir la hora de una comida ya registrada, tocándola
function editarHoraComida(i) {
  asegurarComidas();
  const val = prompt(`¿A qué hora ${COMIDAS[i].verbo}? (formato 24h, ej. 14:30)`, todayData.comidas_hora[i] || '');
  if(val===null) return;
  const limpio = val.trim();
  if(!/^\d{1,2}:\d{2}$/.test(limpio)) { alert('Escribe la hora así: 14:30'); return; }
  const [hh,mm] = limpio.split(':').map(n=>parseInt(n,10));
  if(hh>23 || mm>59) { alert('Esa hora no existe.'); return; }
  todayData.comidas_hora[i] = `${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
  saveTodayLocal();
  updateComidasUI();
}

function updateComidasUI(recienDesbloqueada=-1) {
  // Solo se LEE: crear los objetos al pintar haría que el siguiente guardado mande {} y
  // pise lo que otro dispositivo ya guardó. Se crean únicamente cuando ella toca algo.
  const comidas = todayData.comidas || {};
  const omitidas = todayData.comidas_omitidas || {};
  const horas = todayData.comidas_hora || {};
  let hechas=0;

  for(let i=0;i<3;i++){
    const el=document.getElementById(`comida-${i}`);
    if(!el) continue;
    const hecha=!!comidas[i];
    const omitida=!hecha && !!omitidas[i];
    if(hecha) hechas++;

    // Desbloqueada si es la primera, o si la anterior se comió o se marcó "no la comí"
    const prev = i>0 && (comidas[i-1] || omitidas[i-1]);
    const desbloqueada = i===0 || prev;

    el.classList.toggle('hecha', hecha);
    el.classList.toggle('omitida', omitida);
    el.classList.toggle('bloqueada', !desbloqueada);

    const check=el.querySelector('.comida-check');
    if(check) check.textContent = omitida ? '–' : '✓';

    const estado=el.querySelector('.comida-estado');
    if(estado) {
      if(hecha) {
        const h = horas[i];
        estado.innerHTML = COMIDAS[i].mensajeHecho + (h ? ` · <span class="comida-hora" onclick="event.stopPropagation();editarHoraComida(${i})">${formatHora12(h+':00')}</span>` : '');
      }
      else if(omitida) estado.textContent=COMIDAS[i].mensajeOmitida;
      else if(desbloqueada) estado.textContent=COMIDAS[i].mensajePendiente;
      else estado.textContent=`Se abre al registrar el ${COMIDAS[i-1].nombre.toLowerCase()} (o "${COMIDAS[i-1].botonOmitir}")`;
    }

    const skip=document.getElementById(`skip-${i}`);
    if(skip) skip.textContent = omitida ? 'Deshacer' : COMIDAS[i].botonOmitir;

    // Animación de desbloqueo
    if(recienDesbloqueada>=0 && i===recienDesbloqueada+1 && desbloqueada) {
      el.classList.add('desbloqueando');
      setTimeout(()=>el.classList.remove('desbloqueando'),600);
    }
  }

  const prog=document.getElementById('meal-progress');
  if(prog) prog.textContent=`${hechas} / 3`;
  ['0','1','2'].forEach(nuPintarZona);   // la digestión aparece al marcar la comida
}

function saveComidaTexto(i) {
  if(!todayData.comidas_texto) todayData.comidas_texto={};
  todayData.comidas_texto[i]=document.getElementById(`texto-${i}`).value;
  saveTodayLocal();
}

function restoreComidas() {
  if(!todayData.comidas_texto) todayData.comidas_texto={};
  for(let i=0;i<3;i++){
    const input=document.getElementById(`texto-${i}`);
    if(!input) continue;
    // Nunca dejar texto de otro día: si esta fecha no tiene nada, el campo queda vacío.
    // Si el campo está enfocado (lo estás escribiendo), no se toca.
    if(document.activeElement===input) continue;
    input.value = todayData.comidas_texto[i] || '';
  }
  updateComidasUI();
}



async function init() {
  const d = new Date();
  pintarBotonTema();
  document.getElementById('fecha').textContent = d.toLocaleDateString('es-CO', {weekday:'long', day:'numeric', month:'long'});
  document.getElementById('hoy-cont').innerHTML = '<div class="card vacio">Cargando…</div>';
  try { await cargar(); }
  catch(e) {
    console.error(e);
    document.getElementById('hoy-cont').innerHTML = '<div class="card vacio">No pude leer los datos. Revisa la conexión y vuelve a abrir.</div>';
    return;
  }
  pintarHoy(); pintarSemana(); pintarDespensa(); pintarPerfil();
  iniciarRegistro();
}
