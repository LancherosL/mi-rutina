<title>Nutri</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500;600&display=swap');

:root {
  --bg: #F2EDE4;
  --card: #FAFAF7;
  --ink: #1A1612;
  --muted: #8C7E6E;
  --terra: #B85C35;
  --terra-soft: rgba(184,92,53,0.10);
  --sage: #5C8A65;
  --sage-soft: rgba(92,138,101,0.12);
  --gold: #C49A3C;
  --gold-soft: rgba(196,154,60,0.12);
  --line: rgba(26,22,18,0.08);
  --r: 22px;
  --r-sm: 14px;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--ink); min-height:100vh; }
button { font-family:inherit; color:inherit; border:none; background:none; cursor:pointer; }
input, select { font-family:inherit; font-size:16px; color:inherit; }

.wrap { max-width:520px; margin:0 auto; padding:18px 16px 60px; }

.header { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px; }
.titulo { font-family:'Cormorant Garamond',serif; font-size:34px; font-weight:600; letter-spacing:.5px; }
.fecha { font-size:13px; color:var(--muted); }

.tabs { display:flex; gap:6px; margin-bottom:14px; }
.tab { flex:1; padding:9px 0; border-radius:12px; font-size:13px; font-weight:500; color:var(--muted); background:var(--card); }
.tab.on { background:var(--ink); color:var(--bg); }

.card { background:var(--card); border-radius:var(--r); padding:18px; margin-bottom:12px; box-shadow:0 1px 0 var(--line); }
.label { font-size:11px; font-weight:600; letter-spacing:1.2px; text-transform:uppercase; color:var(--muted); margin-bottom:12px; }
.voz { font-family:'Cormorant Garamond',serif; font-size:20px; line-height:1.35; }
.nota { font-size:12px; color:var(--muted); margin-top:10px; line-height:1.45; }
.link { color:var(--sage); font-weight:600; text-decoration:none; }

/* Barras de macros */
.macro { margin-bottom:12px; }
.macro:last-child { margin-bottom:0; }
.macro-top { display:flex; justify-content:space-between; font-size:13px; margin-bottom:5px; }
.macro-top b { font-weight:600; }
.macro-top span { color:var(--muted); }
.barra { height:8px; border-radius:6px; background:var(--bg); overflow:hidden; }
.barra i { display:block; height:100%; border-radius:6px; background:var(--sage); }
.barra i.pasa { background:var(--gold); }

.fila { display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-top:1px solid var(--line); font-size:13px; }
.fila:first-of-type { border-top:none; }
.fila .der { color:var(--muted); text-align:right; }
.chips { display:flex; flex-wrap:wrap; gap:6px; }
.chip { font-size:12px; color:var(--muted); background:var(--bg); padding:4px 9px; border-radius:20px; }

/* Semana */
.dia { display:grid; grid-template-columns:44px 1fr 74px; gap:10px; align-items:center; padding:7px 0; font-size:12px; }
.dia-nom { color:var(--muted); }
.dia-val { text-align:right; color:var(--muted); }

/* Perfil */
.campo { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-top:1px solid var(--line); font-size:14px; }
.campo:first-of-type { border-top:none; }
.campo input, .campo select { width:110px; text-align:right; border:none; border-bottom:1.5px solid var(--line); background:transparent; padding:4px 0; outline:none; }
.seg { display:flex; gap:6px; flex-wrap:wrap; margin-top:4px; }
.seg button { padding:7px 12px; border-radius:20px; background:var(--bg); font-size:13px; }
.seg button.on { background:var(--ink); color:var(--bg); }

.vacio { color:var(--muted); font-size:14px; }
.oculto { display:none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="titulo">Nutri</div>
    <div class="fecha" id="fecha"></div>
  </div>

  <div class="tabs">
    <button class="tab on" data-tab="hoy" onclick="verTab('hoy')">Hoy</button>
    <button class="tab" data-tab="semana" onclick="verTab('semana')">Semana</button>
    <button class="tab" data-tab="perfil" onclick="verTab('perfil')">Perfil</button>
  </div>

  <div id="tab-hoy"></div>
  <div id="tab-semana" class="oculto"></div>
  <div id="tab-perfil" class="oculto"></div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════
// NUTRI — lee lo que se anota en Mi Sistema y lo convierte en patrón.
// No registra comidas: el único lugar de registro es Mi Sistema
// (comidas_items, comidas_digestion, banos, registro_diario).
// Reglas: nada inventado (null = sin dato), sin registro no se juzga,
// una sola recomendación por semana, tuteo.
// ═══════════════════════════════════════════════════════════════════

const SUPABASE_URL = 'https://snwnqjltfyqlwyeyfjba.supabase.co';
const SUPABASE_KEY = 'sb_publishable_mHkufMizNWFEi1XUAbSAYA_Xs5-I_JH';
const MI_SISTEMA = 'mi_sistema.html';

// Mifflin-St Jeor y factores de actividad. Editable.
const ACTIVIDAD = {
  baja:     {t:'Baja',     f:1.2},
  ligera:   {t:'Ligera',   f:1.375},
  moderada: {t:'Moderada', f:1.55},
  alta:     {t:'Alta',     f:1.725}
};
const PROTEINA_G_KG = 1.9;   // proteína alta para recomposición
const GRASA_G_KG = 0.87;
const COMIDAS_NOMBRE = {'0':'Desayuno', '1':'Almuerzo', '2':'Cena', 'extra':'Algo de más'};
const REACCION = {bien:'👍', regular:'😐', mal:'👎'};
// Umbrales para no sacar conclusiones de muy pocos datos
const MIN_DIAS_COACH = 3;
const MIN_COMIDAS_DETONANTE = 3;

let perfil = null;
let items = [], digestion = [], banos = [], registros = [];
let tab = 'hoy';

// ── utilidades ──
const fechaLocal = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const hoy = () => fechaLocal(new Date());
const haceDias = n => { const d = new Date(); d.setDate(d.getDate()-n); return fechaLocal(d); };
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r0 = v => Math.round(v);
const r1 = v => Math.round(v*10)/10;
const nombreDia = f => ['dom','lun','mar','mié','jue','vie','sáb'][new Date(f+'T12:00:00').getDay()];

async function sb(tabla, method='GET', body=null, params='') {
  const headers = {'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`,'Content-Type':'application/json'};
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${tabla}${params}`, {method, headers, body: body?JSON.stringify(body):null});
  if(!res.ok) throw new Error('HTTP '+res.status);
  const t = await res.text();
  return t ? JSON.parse(t) : null;
}

// ── carga ──
async function cargar() {
  const desde = haceDias(9);   // 7 días + los 2 anteriores para cruzar con baño
  const [p, it, dg, bn, rd] = await Promise.all([
    sb('nutri_perfil','GET',null,'?id=eq.laura'),
    sb('comidas_items','GET',null,`?fecha=gte.${desde}&order=fecha.asc,created_at.asc`),
    sb('comidas_digestion','GET',null,`?fecha=gte.${desde}`),
    sb('banos','GET',null,`?fecha=gte.${desde}&order=fecha.asc,created_at.asc`),
    sb('registro_diario','GET',null,`?fecha=gte.${desde}&select=fecha,comidas,comidas_texto,comidas_omitidas,extras,agua,sueno_horas,energia,emocion,ciclo_fase`)
  ]);
  perfil = (p && p[0]) || null;
  items = it || []; digestion = dg || []; banos = bn || []; registros = rd || [];
}

// ── cálculos ──
// Suma un nutriente. Si algún alimento no tiene el dato, el total es "al menos".
function sumar(lista, campo) {
  let total = 0, faltan = 0;
  lista.forEach(x => { if(x[campo]==null) faltan++; else total += Number(x[campo]); });
  return {total, faltan};
}

function totalesDia(fecha) {
  const del = items.filter(x => x.fecha===fecha);
  const t = {n: del.length};
  ['kcal','proteina','carbo','grasa','fibra','calcio_mg','vitd_ui'].forEach(c => t[c] = sumar(del, c));
  return t;
}

// Comidas que sólo están en texto (no suman: Nutri las marca "aprox")
function soloTexto(fecha) {
  const rd = registros.find(r => r.fecha===fecha);
  if(!rd) return [];
  const out = [];
  const textos = rd.comidas_texto || {};
  ['0','1','2'].forEach(k => {
    const tx = (textos[k]||'').trim();
    if(tx && !items.some(x => x.fecha===fecha && x.comida===k)) out.push({nombre: COMIDAS_NOMBRE[k], texto: tx});
  });
  (Array.isArray(rd.extras) ? rd.extras : []).forEach(e => {
    if(!e.id || !items.some(x => x.fecha===fecha && x.extra_ref===e.id)) out.push({nombre: 'Algo de más', texto: e.texto||''});
  });
  return out;
}

function diasSemana() { const d = []; for(let i=6;i>=0;i--) d.push(haceDias(i)); return d; }
function diasConRegistro() { return diasSemana().filter(f => items.some(x => x.fecha===f)); }

// Objetivo de fibra de esta semana: sube de a poco desde lo que comes hoy,
// sólo si la digestión de la semana fue bien. Nunca de golpe.
function metaFibra() {
  if(!perfil) return null;
  const dias = diasConRegistro();
  if(dias.length < MIN_DIAS_COACH) return null;
  const prom = dias.reduce((a,f) => a + totalesDia(f).fibra.total, 0) / dias.length;
  const dsem = digestion.filter(d => diasSemana().includes(d.fecha) && d.reaccion);
  const malas = dsem.filter(d => d.reaccion==='mal').length;
  const vaBien = dsem.length===0 || malas/dsem.length < 0.25;
  const paso = perfil.fibra_paso_semana_g || 2;
  const meta = perfil.fibra_meta_g || 25;
  return {prom: r1(prom), meta: Math.min(meta, r0(prom + (vaBien ? paso : 0))), vaBien, final: meta};
}

// ── Hoy ──
function barra(nombre, t, objetivo, unidad) {
  const v = t.total, pct = objetivo ? Math.min(100, v/objetivo*100) : 0;
  const pasa = objetivo && v > objetivo*1.08;
  const pre = t.faltan ? 'al menos ' : '';
  return `<div class="macro">
    <div class="macro-top"><b>${nombre}</b><span>${pre}${r0(v)}${objetivo ? ' de '+objetivo : ''} ${unidad}</span></div>
    <div class="barra"><i class="${pasa?'pasa':''}" style="width:${pct}%"></i></div>
  </div>`;
}

function pintarHoy() {
  const f = hoy();
  const t = totalesDia(f);
  const texto = soloTexto(f);
  let h = '';

  if(!t.n) {
    // Sin registro no se juzga: se pregunta.
    h += `<div class="card"><div class="voz">¿Qué has comido hoy?</div>
      <div class="nota">${texto.length ? 'Tienes comidas anotadas sólo en texto; si las buscas en el buscador, aquí suman.' : 'Cuando lo anotes en Mi Sistema con el buscador, aquí ves cómo vas.'}
      <br><a class="link" href="${MI_SISTEMA}">Anotar en Mi Sistema →</a></div></div>`;
  } else if(perfil) {
    const fib = metaFibra();
    h += `<div class="card"><div class="label">Hoy</div>
      ${barra('Calorías', t.kcal, perfil.kcal, 'kcal')}
      ${barra('Proteína', t.proteina, perfil.proteina_g, 'g')}
      ${barra('Carbohidrato', t.carbo, perfil.carbo_g, 'g')}
      ${barra('Grasa', t.grasa, perfil.grasa_g, 'g')}
      ${barra('Fibra', t.fibra, fib ? fib.meta : null, 'g')}
      ${barra('Calcio', t.calcio_mg, perfil.calcio_mg, 'mg')}
      ${barra('Vitamina D', t.vitd_ui, perfil.vitd_ui, 'UI')}
      ${fib ? '' : '<div class="nota">La meta de fibra aparece cuando haya 3 días anotados: sube de a poco desde lo que ya comes.</div>'}
      ${(t.calcio_mg.faltan || t.vitd_ui.faltan) ? '<div class="nota">"Al menos": algunos alimentos no traen ese dato, así que el total real puede ser mayor.</div>' : ''}
    </div>`;
  }

  if(texto.length) {
    h += `<div class="card"><div class="label">Sólo en texto · aprox</div>
      ${texto.map(x => `<div class="fila"><span>${esc(x.nombre)}</span><span class="der">${esc(x.texto)}</span></div>`).join('')}
      <div class="nota">No suman a los números de arriba.</div></div>`;
  }

  const dg = digestion.filter(d => d.fecha===f && d.reaccion);
  const bn = banos.filter(b => b.fecha===f);
  if(dg.length || bn.length) {
    h += `<div class="card"><div class="label">Cuerpo</div>`;
    dg.forEach(d => {
      const nom = d.comida==='extra'
        ? ((items.find(x => x.extra_ref===d.extra_ref)||{}).nombre || 'Algo de más')
        : COMIDAS_NOMBRE[d.comida];
      h += `<div class="fila"><span>${esc(nom)} ${REACCION[d.reaccion]||''}</span><span class="der">${esc((d.sintomas||[]).join(', '))}</span></div>`;
    });
    if(bn.length) {
      const tipos = bn.map(b => b.tipo).filter(Boolean);
      h += `<div class="fila"><span>Baño 🚽 · ${bn.length}</span><span class="der">${esc(tipos.join(', '))}</span></div>`;
    }
    h += `</div>`;
  }

  document.getElementById('tab-hoy').innerHTML = h;
}

// ── Semana ──
function detonantes() {
  // Comidas con reacción, y qué tenían (lactosa, cafeína)
  const sem = diasSemana().concat([haceDias(7), haceDias(8), haceDias(9)]);
  const comidas = digestion.filter(d => d.reaccion && sem.includes(d.fecha)).map(d => {
    const its = items.filter(x => x.fecha===d.fecha && x.comida===d.comida && (d.comida!=='extra' || x.extra_ref===d.extra_ref));
    return {mal: d.reaccion!=='bien', lactosa: its.some(x => x.lactosa), cafeina: its.some(x => x.cafeina), n: its.length};
  }).filter(c => c.n);
  const out = [];
  [['lactosa','con lactosa'], ['cafeina','con café']].forEach(([k, txt]) => {
    const con = comidas.filter(c => c[k]), sin = comidas.filter(c => !c[k]);
    if(con.length < MIN_COMIDAS_DETONANTE || sin.length < MIN_COMIDAS_DETONANTE) {
      out.push({txt, listo:false, falta: Math.max(0, MIN_COMIDAS_DETONANTE-con.length) + Math.max(0, MIN_COMIDAS_DETONANTE-sin.length)});
      return;
    }
    const pc = con.filter(c => c.mal).length/con.length, ps = sin.filter(c => c.mal).length/sin.length;
    out.push({txt, listo:true, pc: r0(pc*100), ps: r0(ps*100), nc: con.length, ns: sin.length});
  });
  return out;
}

// Baño de cada día cruzado con lo de ese día y los 2 anteriores
function banoCruce() {
  const conTipo = banos.filter(b => b.bristol);
  if(conTipo.length < 5) return null;
  const fibra3 = f => { let s=0,n=0; for(let i=0;i<3;i++){ const d=new Date(f+'T12:00:00'); d.setDate(d.getDate()-i); const t=totalesDia(fechaLocal(d)); if(t.n){ s+=t.fibra.total; n++; } } return n ? s/n : null; };
  const duras = conTipo.filter(b => b.bristol<=2).map(b => fibra3(b.fecha)).filter(v => v!=null);
  const normales = conTipo.filter(b => b.bristol>2 && b.bristol<6).map(b => fibra3(b.fecha)).filter(v => v!=null);
  if(duras.length<2 || normales.length<2) return null;
  const prom = a => r1(a.reduce((x,y)=>x+y,0)/a.length);
  return {duras: prom(duras), normales: prom(normales), nd: duras.length, nn: normales.length};
}

// Una sola recomendación, la de mayor brecha.
function coach() {
  const dias = diasConRegistro();
  if(!perfil) return null;
  if(dias.length < MIN_DIAS_COACH) return {txt: `Con ${MIN_DIAS_COACH} días anotados te digo una sola cosa para la semana. Llevas ${dias.length}.`};
  const prom = c => dias.reduce((a,f) => a + totalesDia(f)[c].total, 0) / dias.length;
  const p = prom('proteina'), cal = prom('calcio_mg'), k = prom('kcal'), fib = metaFibra();
  if(p < perfil.proteina_g*0.85)
    return {txt: `Tu proteína promedio va en ${r0(p)} g de ${perfil.proteina_g}. Sumarla al desayuno es lo más fácil: 2 huevos son unos 25 g.`};
  if(k < perfil.kcal*0.85)
    return {txt: `Estás comiendo unas ${r0(k)} kcal de ${perfil.kcal}. Para sanar el hueso y ganar músculo el cuerpo necesita llegar al mantenimiento.`};
  if(cal < perfil.calcio_mg*0.7)
    return {txt: `Calcio: al menos ${r0(cal)} mg de ${perfil.calcio_mg}. Sardinas, tofu con calcio o leche sin lactosa lo suben sin lácteos que te caigan mal.`};
  if(fib && fib.prom < fib.meta)
    return {txt: `Fibra esta semana: ${fib.meta} g (vienes de ${fib.prom}). Sube de a poco: un cucharón de frijoles o lentejas son unos 10 g.`};
  return {txt: 'Esta semana vas cuadrando con tu objetivo. Sigue igual.'};
}

function pintarSemana() {
  const dias = diasSemana();
  let h = '';
  const c = coach();
  if(c) h += `<div class="card"><div class="label">Esta semana</div><div class="voz">${esc(c.txt)}</div></div>`;

  if(perfil) {
    const max = Math.max(perfil.kcal, ...dias.map(f => totalesDia(f).kcal.total));
    h += `<div class="card"><div class="label">Calorías y proteína</div>`;
    dias.forEach(f => {
      const t = totalesDia(f);
      h += `<div class="dia"><span class="dia-nom">${nombreDia(f)}</span>
        <div class="barra"><i class="${t.kcal.total>perfil.kcal*1.08?'pasa':''}" style="width:${t.n ? Math.min(100,t.kcal.total/max*100) : 0}%"></i></div>
        <span class="dia-val">${t.n ? `${r0(t.kcal.total)} · ${r0(t.proteina.total)}g` : '—'}</span></div>`;
    });
    h += `<div class="nota">Objetivo: ${perfil.kcal} kcal · ${perfil.proteina_g} g de proteína. "—" es un día sin anotar: es un dato, no una falla.</div></div>`;
  }

  const det = detonantes();
  const cruce = banoCruce();
  h += `<div class="card"><div class="label">Detonantes</div>`;
  det.forEach(d => {
    h += d.listo
      ? `<div class="fila"><span>Comidas ${d.txt}</span><span class="der">${d.pc}% te cayeron regular o mal (${d.nc})<br>sin: ${d.ps}% (${d.ns})</span></div>`
      : `<div class="fila"><span>Comidas ${d.txt}</span><span class="der">faltan ${d.falta} comidas con 👍😐👎</span></div>`;
  });
  h += cruce
    ? `<div class="fila"><span>Baño y fibra</span><span class="der">días de baño duro: ${cruce.duras} g de fibra (3 días)<br>baño normal: ${cruce.normales} g</span></div>`
    : `<div class="fila"><span>Baño y fibra</span><span class="der">aparece con 5 registros de baño con tipo</span></div>`;
  h += `<div class="nota">Sólo se compara cuando hay datos suficientes de los dos lados.</div></div>`;

  document.getElementById('tab-semana').innerHTML = h;
}

// ── Perfil ──
function recalcular(p) {
  const bmr = 10*p.peso_kg + 6.25*p.estatura_cm - 5*p.edad - 161;
  const kcal = Math.round(bmr * ACTIVIDAD[p.actividad].f / 10) * 10;
  const proteina_g = r0(PROTEINA_G_KG * p.peso_kg);
  const grasa_g = r0(GRASA_G_KG * p.peso_kg);
  const carbo_g = r0((kcal - proteina_g*4 - grasa_g*9) / 4);   // los totales siempre cuadran
  return {kcal, proteina_g, grasa_g, carbo_g};
}

async function cambiarPerfil(campo, valor) {
  if(!perfil) return;
  const p = Object.assign({}, perfil, {[campo]: valor});
  if(!p.peso_kg || !p.estatura_cm || !p.edad) return;
  const cambios = Object.assign({[campo]: valor}, recalcular(p), {actualizado: new Date().toISOString()});
  Object.assign(perfil, cambios);
  pintarPerfil(); pintarHoy(); pintarSemana();
  try { await sb('nutri_perfil','PATCH',cambios,'?id=eq.laura'); }
  catch(e) { console.error(e); alert('No se pudo guardar. Revisa la conexión.'); }
}

function pintarPerfil() {
  const el = document.getElementById('tab-perfil');
  if(!perfil) { el.innerHTML = '<div class="card vacio">Sin perfil todavía.</div>'; return; }
  const p = perfil;
  const fib = metaFibra();
  el.innerHTML = `
    <div class="card"><div class="label">Actividad</div>
      <div class="seg">${Object.entries(ACTIVIDAD).map(([k,a]) => `<button class="${p.actividad===k?'on':''}" onclick="cambiarPerfil('actividad','${k}')">${a.t}</button>`).join('')}</div>
      <div class="nota">Al cambiarla se recalculan las calorías y los macros.</div>
    </div>
    <div class="card"><div class="label">Tus metas</div>
      <div class="fila"><span>Calorías</span><span class="der">${p.kcal} kcal</span></div>
      <div class="fila"><span>Proteína</span><span class="der">${p.proteina_g} g</span></div>
      <div class="fila"><span>Carbohidrato</span><span class="der">${p.carbo_g} g</span></div>
      <div class="fila"><span>Grasa</span><span class="der">${p.grasa_g} g</span></div>
      <div class="fila"><span>Fibra</span><span class="der">${fib ? `${fib.meta} g esta semana · llega a ${fib.final}` : `meta final ${p.fibra_meta_g} g`}</span></div>
      <div class="fila"><span>Calcio</span><span class="der">${p.calcio_mg} mg</span></div>
      <div class="fila"><span>Vitamina D</span><span class="der">${p.vitd_ui} UI</span></div>
      <div class="nota">${p.proteina_g*4 + p.grasa_g*9 + p.carbo_g*4} kcal suman los macros.</div>
    </div>
    <div class="card"><div class="label">Datos</div>
      <div class="campo"><span>Peso (kg)</span><input type="number" inputmode="decimal" step="0.1" value="${p.peso_kg}" onchange="cambiarPerfil('peso_kg', parseFloat(this.value))"></div>
      <div class="campo"><span>Estatura (cm)</span><input type="number" inputmode="decimal" value="${p.estatura_cm}" onchange="cambiarPerfil('estatura_cm', parseFloat(this.value))"></div>
      <div class="campo"><span>Edad</span><input type="number" inputmode="numeric" value="${p.edad}" onchange="cambiarPerfil('edad', parseInt(this.value,10))"></div>
    </div>
    <div class="nota" style="text-align:center"><a class="link" href="${MI_SISTEMA}">Anotar comidas en Mi Sistema →</a></div>`;
}

// ── navegación ──
function verTab(t) {
  tab = t;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab===t));
  ['hoy','semana','perfil'].forEach(k => document.getElementById('tab-'+k).classList.toggle('oculto', k!==t));
}

async function init() {
  const d = new Date();
  document.getElementById('fecha').textContent = d.toLocaleDateString('es-CO', {weekday:'long', day:'numeric', month:'long'});
  document.getElementById('tab-hoy').innerHTML = '<div class="card vacio">Cargando…</div>';
  try { await cargar(); }
  catch(e) {
    console.error(e);
    document.getElementById('tab-hoy').innerHTML = '<div class="card vacio">No pude leer los datos. Revisa la conexión y vuelve a abrir.</div>';
    return;
  }
  pintarHoy(); pintarSemana(); pintarPerfil();
}

// Al volver a la app se relee: lo anotado en Mi Sistema aparece sin recargar.
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState==='visible') cargar().then(() => { pintarHoy(); pintarSemana(); pintarPerfil(); }).catch(console.error);
});

init();
</script>
</body>
</html>
