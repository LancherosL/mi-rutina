<!DOCTYPE html>
<html lang="es" data-app="nutri" data-fluido>
<head>
<script src="auth.js?v=1"></script>
<meta charset="UTF-8">
<meta name="theme-color" content="#1FD47A">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nutri">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<link rel="apple-touch-icon" href="icono-nutri.png">
<link rel="icon" type="image/png" href="icono-nutri.png">
<title>Nutri</title>
<script>
// Tema de Nutri: sigue al teléfono, salvo que lo cambies a mano (se recuerda)
(function(){ let t = null; try { t = localStorage.getItem('nutri_tema'); } catch(e) {}
  if(!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro';
  document.documentElement.dataset.tema = t; })();
</script>
<link rel="stylesheet" href="tierra.css?v=8">
<script src="tierra.js?v=8"></script>
<style>

/* ═══ Nutri se une a Tierra · Calma · Directo v2 ═══
   Los colores, letras, radios y sombras vienen de tierra.css. Nutri conserva sus nombres de variable
   y los apunta a la casa: salvia = hecho, terra = hacer. Sin verde neón, sin azul, sin violeta. ═══ */
:root {
  --bg: var(--papel);
  --surface: var(--tarjeta);
  --surface-2: var(--beige);
  --ink: var(--tinta);
  --fresh: var(--acento);
  --fresh-deep: var(--acento-oscuro);
  --fresh-soft: var(--acento-suave);
  --orange: var(--terra);
  --orange-deep: var(--terra-oscuro);
  --orange-soft: var(--terra-suave);
  --berry: var(--alerta);
  --sun: var(--dorado);
  --line: var(--borde);
  --ring-track: var(--beige);
  --on-acento: var(--sobre-acento);
  --shadow: var(--sombra-tarjeta);
  --shadow-press: var(--sombra-tarjeta);
  --r: var(--r-tarjeta);
  --r-sm: var(--r-boton);
  --display: var(--font-ui);
  --text: var(--font-ui);
}
/* Oscuro (sigue al teléfono): mismos tonos, más claros. Nunca azul, nunca negro puro. */
:root[data-tema="oscuro"] {
  /* La barra de abajo y los componentes t-* leen estos tokens: en oscuro también cambian */
  --papel: var(--fondo-oscuro); --tarjeta: var(--superficie); --beige: var(--superficie-2); --tinta: var(--texto-oscuro);
  --borde: var(--borde-oscuro); --tinta-20: rgba(246,241,231,.24); --terra-texto: var(--terra-claro); --brillo: inset 0 1px 0 rgba(255,255,255,.05); --sombra-banda: 0 14px 32px -14px rgba(0,0,0,.5); --sombra-boton: 0 1px 2px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.12);
  --bg: var(--fondo-oscuro);
  --surface: var(--superficie);
  --surface-2: var(--superficie-2);
  --ink: var(--texto-oscuro);
  --muted: var(--muted-oscuro);
  --fresh: var(--acento);
  --fresh-deep: var(--acento-claro);
  --fresh-soft: rgba(75,240,154,.18);
  --orange: var(--terra-claro);
  --orange-deep: var(--terra-claro);
  --orange-soft: rgba(208,122,78,.16);
  --sun: var(--dorado-claro);
  --line: var(--borde-oscuro);
  --ring-track: var(--superficie-2);
  --on-acento: #0E1A12;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html { background:var(--bg); }
body { font-family:var(--text); font-size:15px; background:var(--bg); color:var(--ink); min-height:100vh; transition:background .35s, color .35s; }
button { font-family:inherit; color:inherit; border:none; background:none; cursor:pointer; }
input, select { font-family:inherit; font-size:16px; color:inherit; }

.wrap { max-width:480px; margin:0 auto; padding:0 var(--lateral) calc(var(--alto-nav) + 32px + env(safe-area-inset-bottom)); }
@media (min-width:768px) { .wrap { max-width:720px; } }

/* Encabezado */
.header { display:flex; justify-content:space-between; align-items:center; padding:22px 2px 14px; }
.marca { display:flex; align-items:center; gap:10px; }
.marca-aguacate { height:52px; width:auto; display:block; flex:none; }
.marca-punto { color:var(--salvia); width:40px; height:40px; border-radius:var(--r-boton); background:var(--surface-2); border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center; font-size:18px; }
.titulo { font-family:var(--font-display); font-size:var(--fs-nombre-app); font-weight:600; letter-spacing:-0.02em; line-height:1; }
.fecha { font-size:14px; color:var(--muted); margin-top:4px; text-transform:capitalize; }
.tema-btn { color:var(--muted); display:inline-flex; align-items:center; justify-content:center; width:44px; height:44px; border-radius:var(--r-boton); background:var(--surface); border:1px solid var(--line); font-size:18px; }
.tema-btn:active { transform:scale(.92); }

/* Barra de abajo: la de tierra.css (.t-nav / .t-tab), igual en todas las apps */
/* al cambiar de pestaña las secciones suben una tras otra: lo hace Tierra.entra() en verTab */

/* Tarjetas táctiles */
.card { background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:var(--dentro-tarjeta); margin-bottom:var(--entre-tarjetas); box-shadow:var(--shadow);
  animation:t-aparece var(--t-aparece) var(--ease) both; }
#tab-hoy[data-pintado] .card { animation:none; }
.label { font-family:var(--font-ui); font-size:12px; font-weight:600; letter-spacing:1.2px; text-transform:uppercase; color:var(--muted); margin-bottom:14px; }
.voz { font-size:var(--fs-cuerpo); line-height:1.5; font-weight:400; }
.nota { font-size:14px; color:var(--muted); margin-top:12px; line-height:1.5; }
.link { color:var(--terra-texto); font-size:16px; font-weight:600; text-decoration:none; }
:root[data-tema="oscuro"] .link { color:var(--terra-claro); }
.boton { display:inline-flex; align-items:center; justify-content:center; gap:8px; margin-top:14px; min-height:var(--alto-boton); padding:0 24px; border-radius:var(--r-boton);
  background:var(--terra); color:#fff; font-weight:600; font-size:17px; text-decoration:none; }
.boton:active { background:var(--terra-oscuro); }
:root[data-tema="oscuro"] .boton { background:var(--terra); color:#fff; }

/* ── Hoy: tarjeta con anillos (calorías en terra, proteína en salvia) ── */
.heroe { position:relative; overflow:hidden; }
.heroe-fila { display:flex; align-items:center; gap:20px; position:relative; z-index:1; }
.anillos { position:relative; width:168px; height:168px; flex-shrink:0; }
.anillos svg { width:100%; height:100%; transform:rotate(-90deg); }
.anillos circle { fill:none; stroke-linecap:round; }
.anillos .pista { stroke:var(--ring-track); }
.anillos .arco { transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1); }
.anillos .kcal { stroke:var(--terra); }
.anillos .prot { stroke:var(--salvia); }
:root[data-tema="oscuro"] .anillos .kcal { stroke:var(--terra-claro); }
:root[data-tema="oscuro"] .anillos .prot { stroke:var(--salvia-claro); }
.anillos-centro { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
.num-grande { font-family:var(--display); font-size:var(--fs-numero); font-weight:600; letter-spacing:-0.02em; line-height:1; font-variant-numeric:tabular-nums; }
.num-sub { font-size:14px; color:var(--muted); margin-top:4px; }
.leyenda { display:flex; flex-direction:column; gap:14px; }
.leyenda div { font-size:14px; color:var(--muted); }
.leyenda b { display:block; font-family:var(--display); font-size:24px; font-weight:600; letter-spacing:-0.02em; color:var(--ink); font-variant-numeric:tabular-nums; }
.leyenda .punto { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; }
.heroe.pulso .anillos { animation:pulso .6s ease; }
@keyframes pulso { 40% { transform:scale(1.05); } }
.heroe .aprox { position:relative; z-index:1; font-size:14px; color:var(--muted); margin-top:14px; }

/* Mini anillos de macros */
.macros { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; }
.macros.dos { grid-template-columns:repeat(2, 1fr); margin-top:10px; }
.mini { background:var(--surface-2); border-radius:var(--r-sm); padding:12px 10px; display:flex; flex-direction:column; align-items:center; gap:6px; }
.mini svg { width:52px; height:52px; transform:rotate(-90deg); }
.mini circle { fill:none; stroke-width:6; stroke-linecap:round; }
.mini .pista { stroke:var(--line); }
.mini .arco { transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1); }
.mini-num { font-family:var(--display); font-size:16px; font-weight:700; letter-spacing:-0.01em; }
.mini-nom { font-size:12px; color:var(--muted); text-align:center; line-height:1.25; }

/* Sugerencia del momento */
.ahora { border-left:4px solid var(--terra); }
.ahora .label { color:var(--orange-deep); }
:root[data-tema="oscuro"] .ahora .label { color:var(--orange); }

/* Filas y chips */
.fila { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:11px 0; border-top:1px solid var(--line); font-size:14px; }
.fila:first-of-type { border-top:none; }
.fila .der { color:var(--muted); text-align:right; font-size:14px; }

/* ── Semana: columnas animadas ── */
.grafico { display:flex; align-items:flex-end; gap:8px; height:160px; position:relative; }
.grafico .meta { position:absolute; left:0; right:0; border-top:2px dashed var(--orange-soft); }
.grafico .meta span { position:absolute; right:0; top:-18px; font-size:12px; color:var(--orange-deep); font-weight:600; }
.col { flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; justify-content:flex-end; }
.col .pista-v { height:110px; width:100%; display:flex; align-items:flex-end; justify-content:center; }
.col .barra-v { width:100%; max-width:30px; border-radius:12px 12px 8px 8px; background:var(--fresh);
  transform-origin:bottom; animation:crecer .9s cubic-bezier(.2,.8,.2,1) both; }
.col .barra-v.pasa { background:var(--orange); }
.col .barra-v.vacia { background:var(--surface-2); height:6px !important; }
.col .dia { height:16px; font-size:12px; color:var(--muted); font-weight:600; text-transform:capitalize; }
.col .val { height:16px; font-family:var(--display); font-size:12px; font-weight:600; }
@keyframes crecer { from { transform:scaleY(0); } to { transform:scaleY(1); } }

/* Perfil */
.campo { display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-top:1px solid var(--line); font-size:14px; }
.campo:first-of-type { border-top:none; }
.campo input, .campo select { width:110px; text-align:right; border:none; border-bottom:2px solid var(--line); background:transparent; padding:4px 0; outline:none; font-family:var(--display); font-weight:600; }
.campo input:focus { border-color:var(--fresh); }
.seg { display:flex; gap:8px; flex-wrap:wrap; }
.seg button { min-height:var(--alto-pildora); padding:0 18px; border-radius:999px; background:var(--surface-2); border:1px solid var(--line); font-size:15px; font-weight:600; color:var(--ink); transition:all .2s; }
.seg button:active { transform:scale(.95); }
.seg button.on { background:var(--terra); border-color:var(--terra); color:#fff; }
.metas { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
.meta-c { background:var(--surface-2); border-radius:var(--r-sm); padding:12px 14px; }
.meta-c b { display:block; font-family:var(--display); font-size:22px; font-weight:700; letter-spacing:-0.02em; }
.meta-c span { font-size:12px; color:var(--muted); }

.vacio { color:var(--muted); font-size:14px; }
.oculto { display:none; }

/* Despensa */
.busca { display:flex; align-items:center; gap:10px; background:var(--surface-2); border-radius:16px; padding:4px 6px 4px 14px; }
.busca input { flex:1; min-width:0; border:none; background:transparent; padding:10px 0; outline:none; font-size:15px; }
.scan { color:var(--ink); width:40px; height:40px; border-radius:12px; background:var(--surface); display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow-press); }
.scan:active { transform:scale(.92); }
.sug { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
.sug:empty { display:none; }
.sug button { font-size:15px; font-weight:600; border-radius:999px; min-height:var(--alto-pildora); padding:0 16px; background:var(--surface-2); border:1px solid var(--line); transition:transform .15s; }
.sug button:active { transform:scale(.95); }
.sug button.off { background:var(--orange-soft); color:var(--orange-deep); }
.item { display:flex; align-items:center; gap:8px; padding:11px 0; border-top:1px solid var(--line); font-size:14px; }
.item:first-of-type { border-top:none; }
.item .nom { flex:1; font-weight:500; }
.item .tag { white-space:nowrap; display:inline-block; font-size:12px; font-weight:600; color:var(--muted); background:var(--surface-2); border-radius:10px; padding:3px 8px; margin-left:5px; }
.item .tag.alerta { color:var(--berry); background:rgba(229,84,110,0.12); }
.item .accion { font-size:14px; color:var(--fresh-deep); font-weight:600; min-height:44px; display:inline-flex; align-items:center; padding:0 14px; border-radius:999px; background:var(--fresh-soft); }
.item .x { font-size:14px; color:var(--muted); padding:0 4px; }
.detalle { padding:4px 0 12px; font-size:14px; color:var(--muted); line-height:1.5; }
.detalle .campo { font-size:13px; padding:8px 0; color:var(--ink); }
.detalle .campo input { width:150px; font-size:14px; }
.grupo { font-family:var(--font-ui); font-size:12px; letter-spacing:1.2px; text-transform:uppercase; font-weight:600; color:var(--muted); margin:16px 0 2px; }
.grupo:first-of-type { margin-top:0; }

/* Suplementos */
.sug button.tomado { background:var(--fresh); border-color:var(--fresh); color:var(--on-acento); }
.sup-edit { padding:6px 0 10px; border-top:1px solid var(--line); }
.sup-edit:first-of-type { border-top:none; }
.sup-edit .campo input, .sup-edit .campo select { width:160px; font-family:var(--text); font-weight:500; font-size:14px; }
.sup-num { width:100%; border:none; background:transparent; outline:none; font-family:var(--display); font-size:18px; font-weight:700; color:var(--ink); }
.sup-num::placeholder { color:var(--muted); }

/* Aviso que entra desde arriba */
.toast { position:fixed; left:50%; top:calc(14px + env(safe-area-inset-top)); transform:translate(-50%, -140%); z-index:30;
  background:var(--ink); color:var(--bg); padding:11px 18px; border-radius:18px; font-size:13px; font-weight:600;
  box-shadow:0 12px 30px -10px rgba(0,0,0,0.4); transition:transform .3s var(--ease); white-space:nowrap; }
.toast.ver { transform:translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }

/* ── Registro (comidas, algo de más, baño): traído de Mi Sistema con la paleta de Nutri ── */
#registro { scroll-margin-top: 16px; }
#registro .meal-card, #registro .log-card { background:var(--surface); border-radius:var(--r); box-shadow:var(--shadow); padding:20px 18px; margin:0 0 16px; }
#registro .ql-title { font-family:var(--display); font-weight:600; font-size:17px; letter-spacing:-0.01em; text-transform:none; color:var(--ink); }
.reg-fecha-row { display:flex; align-items:center; gap:10px; margin:6px 0 4px; }
.reg-fecha-row input[type=date] { background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:6px 10px; font-size:14px; color:var(--ink); }
.reg-estado { font-size:14px; color:var(--muted); }
.reg-estado.error { color:var(--berry); }
#registro .comida-item:not(.hecha) .comida-check { border-color: var(--muted); opacity:.55; }
#registro .ql-title {  font-size:12px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--muted);
  margin-bottom: 12px;  }
#registro .meal-card {  background: var(--surface);
  border-radius: var(--r);
  padding: 16px;
  margin-bottom: 10px;
  box-shadow: var(--shadow);  }
#registro .meal-input {  width: 100%;
  border: none;
  border-bottom: 1.5px solid var(--line);
  background: transparent;
  padding: 6px 0;
  font-family:inherit;
  font-style: italic;
  font-size: 15px;
  color: inherit;
  outline: none;
  transition: border-color .2s;  }
#registro .meal-input:focus {  border-color: var(--fresh);  }
#registro .meal-input::placeholder {  color: var(--muted); opacity: 0.7;  }
#registro .log-card {  background: var(--surface);
  border-radius: var(--r);
  padding: 16px;
  margin-bottom: 10px;
  box-shadow: var(--shadow);  }
#registro .log-header {  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;  }
#registro .extras-block {  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px dashed var(--line);  }
#registro .extras-header {  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;  }
#registro .extras-title {  font-size:12px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--muted);
  font-weight: 600;  }
#registro .extras-count {  font-size:14px;
  font-weight: 700;
  color: var(--orange);  }
#registro .extras-input-row {  display: grid;
  grid-template-columns: 1fr 44px;
  gap: 8px;
  align-items: center;  }
#registro .extras-input {  width: 100%; margin: 0;  }
#registro .extras-add {  background: var(--terra); color: #fff; border-radius: var(--r-boton);  }
#registro .extras-list {  margin-top: 8px;  }
#registro .extra-item {  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 0;
  border-bottom: 1px solid var(--line);
  font-size: 13px;  }
#registro .extra-item:last-child {  border-bottom: none;  }
#registro .extra-hora {  font-size:12px;
  color: var(--muted);
  min-width: 58px;  }
#registro .extra-texto {  flex: 1; color: var(--ink);  }
#registro .extras-nota {  font-size:12px;
  color: var(--muted);
  font-style: italic;
  margin-top: 10px;
  text-align: center;  }
#registro .log-add-btn {  border: none;
  border-radius: var(--r-boton);
  background: var(--terra);
  color: #fff;
  font-family:inherit;
  font-size: 13px;
  font-weight: 700;
  padding: 0 16px;
  cursor: pointer;
  transition: opacity .15s;  }
#registro .log-add-btn:active {  opacity: 0.7;  }
#registro .meal-header {  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;  }
#registro .meal-progress {  font-size:14px;
  font-weight: 700;
  color: var(--fresh);  }
#registro .comida-item {  margin-bottom: 12px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--line);
  transition: opacity .4s, filter .4s;  }
#registro .comida-item:last-child {  border-bottom: none; margin-bottom: 0; padding-bottom: 0;  }
#registro .comida-item.bloqueada {  opacity: 0.4;
  filter: grayscale(0.7);
  pointer-events: none;  }
#registro .comida-item.bloqueada .comida-texto {  display: none;  }
#registro .comida-row { min-height:44px;  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  transition: opacity .15s;  }
#registro .comida-row:active {  opacity: 0.6;  }
#registro .comida-check {  width: 28px; height: 28px; border-radius: 50%;
  border: 2px solid var(--borde);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; color: transparent; flex-shrink: 0;
  transition: all var(--t-pestana) var(--ease);  }
#registro .comida-item.hecha .comida-check {  background: var(--fresh);
  border-color: var(--fresh);
  color: var(--on-acento);  }
#registro .comida-icon {  font-size: 20px;  }
#registro .comida-info {  flex: 1;  }
#registro .comida-nombre {  font-size: 15px; font-weight: 600;  }
#registro .comida-estado {  font-size:12px; color: var(--muted); margin-top: 1px;  }
#registro .comida-item.hecha .comida-estado {  color: var(--fresh); font-weight: 600;  }
#registro .comida-lock {  font-size: 14px; opacity: 0.5;  }
#registro .comida-item:not(.bloqueada) .comida-lock {  display: none;  }
#registro .comida-skip {  background: none; border: none;
  margin: 6px 0 0 40px; padding: 0;
  color: var(--muted);
  font-family:inherit;
  font-size:12px;
  text-decoration: underline;
  text-underline-offset: 3px;
  cursor: pointer;  }
#registro .comida-item.hecha .comida-skip {  display: none;  }
#registro .comida-item.omitida .comida-check {  color: var(--muted); border-style: dashed;  }
#registro .comida-item.omitida .comida-nombre, #registro .comida-item.omitida .comida-estado {  color: var(--muted); font-weight: 500;  }

:root {

  --bg-fluido: var(--fondo-oscuro);
}

#registro > :not([data-b]), #hoy-cont > :not([data-b]), #tab-semana > :not([data-b]), #tab-despensa > :not([data-b]), #tab-perfil > :not([data-b]), #desp-listas > :not([data-b]) { padding-inline: var(--pad); }

  background: var(--acento); border-radius: 0; box-shadow: none; align-items: center;
  -webkit-mask: linear-gradient(#000, #000) top / 100% calc(100% - var(--onda) + 1px) no-repeat, var(--onda-inf-a) bottom / 100% var(--onda) no-repeat;
          mask: linear-gradient(#000, #000) top / 100% calc(100% - var(--onda) + 1px) no-repeat, var(--onda-inf-a) bottom / 100% var(--onda) no-repeat; }
.header::before, .heroe::before { content: ''; position: absolute; inset: -40%; z-index: -1; will-change: transform;

.item .accion { background: none; border-radius: 0; padding: 0 2px; color: var(--tinta); border-bottom: 2px solid var(--acento); min-height: 44px; }
#registro .nu-picker, #registro .nu-panel { background: none; border-radius: 0; padding: 12px 0 0; border-top: 2px dashed var(--linea); }
.reg-fecha-row input[type=date], #registro .meal-input, .busca input { background: transparent; border: 0; border-bottom: 2px solid var(--linea); border-radius: 0; }
.busca input { border-bottom: 0; }
.col .barra-v { border-radius: 0; }

/* Acciones: cuadradas, neón con tinta; las principales, filas de borde a borde */
.boton, #registro .nu-confirmar, #registro .log-add-btn, #registro .extras-add { background: var(--acento); color: var(--sobre-acento); border-radius: 0; box-shadow: none; font-weight: 700; }
.boton { display: flex; justify-content: space-between; width: calc(100% + 2 * var(--pad)); margin-inline: calc(-1 * var(--pad)); padding: 0 var(--pad); min-height: 56px; }
#registro .nu-confirmar { width: calc(100% + 2 * var(--pad)); margin-inline: calc(-1 * var(--pad)); }
.boton:active { background: var(--acento-oscuro); transform: none; }

/* Barra de abajo: franja neón de borde a borde; la pestaña activa, en tinta */
.t-nav { left: 0; right: auto; transform: none; bottom: 0; width: 100%; height: calc(56px + env(safe-area-inset-bottom)); padding: 0 var(--pad) env(safe-area-inset-bottom); border-radius: 0; box-shadow: none; background: var(--acento); }
.t-nav .t-tab { border-radius: 0; margin: 0; }
.t-nav .t-tab.on { background: var(--sobre-acento); color: var(--acento); }
.toast { border-radius: 0; box-shadow: none; }


/* Número grande del anillo a 56 px; el anillo crece para que quepan 4 cifras sin tocar el arco interior */
.anillos { width: 200px; height: 200px; }
.heroe-fila { gap: 12px; }
.num-grande { font-size: 48px; letter-spacing: -.04em; }
.num-sub { font-size: 14px; }
.leyenda b { font-size: 22px; }

/* toques de 44 px */

.campo input, .campo select, .busca input { min-height: 44px; }
.item .x { min-width: 44px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; }
.link { min-height: 44px; display: inline-flex; align-items: center; }

@media (prefers-reduced-motion: reduce) { .header::before, .heroe::before { animation: none !important; } }

/* Campos a 16 px: así el iPhone no hace zoom solo al tocarlos y se puede hacer zoom con los dedos */
input:not([type="checkbox"]):not([type="radio"]):not([type="range"]):not([type="file"]):not([type="color"]), select, textarea { font-size: 16px !important; }
</style>

<script>
// ═══════════════════════════════════════════════════════════════════
// NUTRI — registra comidas, algo de más y baño (desde el 17 nov 2026), y
// lo convierte en patrón junto con lo que se anota en Mi Sistema.
// Reglas: nada inventado (null = sin dato), sin registro no se juzga,
// una sola recomendación por semana, tuteo.
// ═══════════════════════════════════════════════════════════════════

const SUPABASE_URL = 'https://snwnqjltfyqlwyeyfjba.supabase.co';
const SUPABASE_KEY = 'sb_publishable_mHkufMizNWFEi1XUAbSAYA_Xs5-I_JH';

// Mifflin-St Jeor y factores de actividad. Editable.
const ACTIVIDAD = {
  baja:     {t:'Baja',     f:1.2},
  ligera:   {t:'Ligera',   f:1.375},
  moderada: {t:'Moderada', f:1.55},
  alta:     {t:'Alta',     f:1.725}
};
const PROTEINA_G_KG = 1.9;   // proteína alta para recomposición
const GRASA_G_KG = 0.87;
const COMIDAS_NOMBRE = {'0':'Desayuno', '1':'Almuerzo', '2':'Cena', 'extra':'Algo de más'};
const REACCION = {bien:'👍', regular:'😐', mal:'👎'};
// Umbrales para no sacar conclusiones de muy pocos datos
const MIN_DIAS_COACH = 3;
const MIN_COMIDAS_DETONANTE = 3;

let perfil = null;
let items = [], digestion = [], banos = [], registros = [];
let nuAlimentos = [], despensa = [];
let suplementos = [], tomas = [];
let supEditando = false;   // la tarjeta de suplementos en modo editar
let tab = 'hoy';

// ── utilidades ──
const fechaLocal = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const hoy = () => fechaLocal(new Date());
const haceDias = n => { const d = new Date(); d.setDate(d.getDate()-n); return fechaLocal(d); };
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r0 = v => Math.round(v);
const r1 = v => Math.round(v*10)/10;
const nombreDia = f => ['dom','lun','mar','mié','jue','vie','sáb'][new Date(f+'T12:00:00').getDay()];

async function sb(tabla, method='GET', body=null, params='') {
  const headers = {'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`,'Content-Type':'application/json'};
  if(method==='POST') headers['Prefer'] = 'return=representation';
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${tabla}${params}`, {method, headers, body: body?JSON.stringify(body):null});
  if(!res.ok) throw new Error('HTTP '+res.status);
  const t = await res.text();
  return t ? JSON.parse(t) : null;
}

// ── carga ──
async function cargar() {
  const desde = haceDias(9);   // 7 días + los 2 anteriores para cruzar con baño
  const [p, it, dg, bn, rd, al, de, su, to] = await Promise.all([
    sb('nutri_perfil','GET',null,'?id=eq.laura'),
    sb('comidas_items','GET',null,`?fecha=gte.${desde}&order=fecha.asc,created_at.asc`),
    sb('comidas_digestion','GET',null,`?fecha=gte.${desde}`),
    sb('banos','GET',null,`?fecha=gte.${desde}&order=fecha.asc,created_at.asc`),
    sb('registro_diario','GET',null,`?fecha=gte.${desde}&select=fecha,comidas,comidas_texto,comidas_omitidas,comidas_hora,extras,agua,sueno_horas,energia,emocion,ciclo_fase`),
    sb('nutri_alimentos','GET',null,'?select=*&order=nombre.asc'),
    sb('nutri_despensa','GET',null,'?order=nombre.asc'),
    sb('suplementos','GET',null,'?activo=eq.true&order=orden.asc,created_at.asc'),
    sb('suplementos_tomas','GET',null,`?fecha=gte.${desde}&order=created_at.asc`)
  ]);
  nuAlimentos = al || []; despensa = de || [];
  suplementos = su || []; tomas = to || [];
  perfil = (p && p[0]) || null;
  items = it || []; digestion = dg || []; banos = bn || []; registros = rd || [];
}

// ── cálculos ──
// Suma un nutriente. Si algún alimento no tiene el dato, el total es "al menos".
// Suma un nutriente. faltan = alimentos sin ese dato (el total es "al menos");
// est = algo de lo sumado es estimado (IA o plato de restaurante) y se muestra con *.
function sumar(lista, campo) {
  let total = 0, faltan = 0, est = false;
  lista.forEach(x => {
    if(x[campo]==null) faltan++;
    else { total += Number(x[campo]); if(x.estimado && Number(x[campo])) est = true; }
  });
  return {total, faltan, est};
}

// Lo que aporta una toma de suplemento. Clave ausente = no aporta; null = no se sabe cuánto.
const NUTRIENTES = ['kcal','proteina','carbo','grasa','fibra','calcio_mg','vitd_ui'];
function tomaComoItem(tm) {
  const n = tm.nutrientes || {}, it = {fecha: tm.fecha, estimado: false};
  NUTRIENTES.forEach(c => it[c] = (c in n) ? n[c] : 0);
  return it;
}

function totalesDia(fecha) {
  const del = items.filter(x => x.fecha===fecha);
  const sup = tomas.filter(x => x.fecha===fecha).map(tomaComoItem);
  const t = {n: del.length, sup: sup.length};
  NUTRIENTES.forEach(c => t[c] = sumar(del.concat(sup), c));
  return t;
}

// Comidas descritas en texto. ia=true: la IA ya las leyó y suman aprox (con *).
// ia=false: todavía no suman; se calculan con ✨ en el registro.
// Si una comida tiene alimentos del buscador, su texto es sólo descripción y no aparece aquí.
function soloTexto(fecha) {
  const rd = registros.find(r => r.fecha===fecha);
  if(!rd) return [];
  const out = [];
  const textos = rd.comidas_texto || {};
  ['0','1','2'].forEach(k => {
    const tx = (textos[k]||'').trim();
    const its = items.filter(x => x.fecha===fecha && x.comida===k);
    if(tx && !its.some(x => x.origen!=='texto')) out.push({nombre: COMIDAS_NOMBRE[k], texto: tx, ia: its.length>0});
  });
  (Array.isArray(rd.extras) ? rd.extras : []).forEach(e => {
    const its = e.id ? items.filter(x => x.fecha===fecha && x.extra_ref===e.id) : [];
    if(!its.some(x => x.origen!=='texto')) out.push({nombre: 'Algo de más', texto: e.texto||'', ia: its.length>0});
  });
  return out;
}

function diasSemana() { const d = []; for(let i=6;i>=0;i--) d.push(haceDias(i)); return d; }
function diasConRegistro() { return diasSemana().filter(f => items.some(x => x.fecha===f)); }

// Objetivo de fibra de esta semana: sube de a poco desde lo que comes hoy,
// sólo si la digestión de la semana fue bien. Nunca de golpe.
function metaFibra() {
  if(!perfil) return null;
  const dias = diasConRegistro();
  if(dias.length < MIN_DIAS_COACH) return null;
  const prom = dias.reduce((a,f) => a + totalesDia(f).fibra.total, 0) / dias.length;
  const dsem = digestion.filter(d => diasSemana().includes(d.fecha) && d.reaccion);
  const malas = dsem.filter(d => d.reaccion==='mal').length;
  const vaBien = dsem.length===0 || malas/dsem.length < 0.25;
  const paso = perfil.fibra_paso_semana_g || 2;
  const meta = perfil.fibra_meta_g || 25;
  return {prom: r1(prom), meta: Math.min(meta, r0(prom + (vaBien ? paso : 0))), vaBien, final: meta};
}

// ── Buscador de la despensa ──
const nuNorm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
const NU_NO_CLAVE = ['cocido','cocida','cocidos','cocidas','crudo','cruda','frito','frita','asado','asada','blanco','blanca','integral','natural','maduro','rojos','firme','entero','tierno','curado','fresco','peso','unidad','griego','negro','agua','aceite','escurrido','escurridas','calcio','tajadas','hojuelas','tajado','crema','oliva','vegetal','molida','lactosa'];

// Raíz de una palabra: sin diminutivo (arepita→arep, cafecito→cafe) ni plural (huevos→huevo)
function nuRaiz(w) {
  const sinDim = w.replace(/(cit|it)(a|o)s?$/, '');
  if(sinDim!==w && sinDim.length>=3) return sinDim;
  return w.length>3 ? w.replace(/s$/, '') : w;
}

// Busca palabra por palabra contra la palabra principal de cada alimento
// ("Arepita pequeña, dos huevos fritos" → Arepa, Huevo). La última palabra, si
// todavía se está escribiendo, se busca como prefijo ("are" → Arepa).
// No sugiere lo que ya está agregado en esa comida.
function nuCoincidencias(texto, excluir=[]) {
  const q = nuNorm(texto);
  if(q.length<2) return {lista:[]};
  const palabras = q.split(/[^a-zñ]+/).filter(Boolean);
  const escribiendo = !/[\s,.;]$/.test(texto) ? palabras[palabras.length-1] : null;
  // Palabras que cuentan: la primera del nombre siempre; las demás si no son descriptivas
  // ("Pechuga de pollo cocida" → pechuga, pollo; "Atún en agua" → atun)
  const clave = a => {
    const ws = nuNorm(a.nombre).split(/[^a-zñ]+/).filter(Boolean);
    return [ws[0], String(a.norm||'').split(' ')[0]].concat(ws.slice(1).filter(x => x.length>=4 && !NU_NO_CLAVE.includes(x)));
  };
  const lista = [];
  palabras.forEach(w => {
    const raiz = nuRaiz(w);
    nuAlimentos.forEach(a => {
      if(lista.includes(a) || excluir.includes(String(a.id))) return;
      const ok = clave(a).some(k => k && (
        (w===escribiendo && w.length>=2 && w.length<=3 && k.startsWith(w)) ||
        (raiz.length>=3 && ((k.startsWith(raiz) && k.length-raiz.length<=1) || raiz.startsWith(k) && k.length>=4))
      ));
      if(ok) lista.push(a);
    });
  });
  return {lista: lista.slice(0,6)};
}

// ── Ahora: una sugerencia según el momento del día ──
// Mira lo que ya comiste hoy, lo que falta para tus metas, lo que hay en la
// despensa, cómo te cayó lo de hoy, cómo dormiste y tu ciclo. Una sola línea.
const MOMENTOS = [{hasta:11, t:'el desayuno'}, {hasta:16, t:'el almuerzo'}, {hasta:21, t:'la cena'}];
const MINIMO_UTIL = {proteina:8, fibra:2, calcio_mg:80};   // por porción, para que valga la pena sugerirlo
const NO_SUGERIR = ['grasa','otro','bebida'];

function porcionDe(a) { const p = (Array.isArray(a.porciones) && a.porciones[0]) || {u:'100 g', g:100}; return p; }

function sugerencia() {
  if(!perfil || !nuAlimentos.length) return null;
  const h = new Date().getHours();
  const m = MOMENTOS.find(x => h < x.hasta);
  if(!m || h < 5) return null;                       // de noche no se sugiere comer
  const f = hoy(), t = totalesDia(f);
  const rd = registros.find(r => r.fecha===f) || {};
  const malHoy = digestion.some(d => d.fecha===f && d.reaccion==='mal');
  const restantes = MOMENTOS.filter(x => h < x.hasta).length;
  const enCasa = new Set(despensa.filter(d => d.estado==='hay' && d.alimento_id).map(d => String(d.alimento_id)));

  const pocoSueno = rd.sueno_horas && Number(rd.sueno_horas) < 6;
  // Una sola nota de contexto, la más importante
  let pre = '';
  if(!t.n) pre = 'No veo nada anotado hoy. ';
  else if(malHoy) pre = 'Algo de hoy te cayó mal: mejor suave. ';

  if(t.kcal.total >= perfil.kcal) {
    const livianos = nuAlimentos.filter(a => ['fruta','verdura'].includes(a.categoria) && !a.lactosa && Number(a.kcal) < 60)
      .sort((x,y) => (enCasa.has(String(y.id))?1:0) - (enCasa.has(String(x.id))?1:0)).slice(0,2);
    return {m: m.t, txt: pre + `Ya llegaste a tus calorías de hoy. Si te da hambre: ${livianos.map(a => a.nombre.toLowerCase()).join(' o ')}.`};
  }

  const fib = metaFibra();
  const necesidades = [
    {k:'proteina', nom:'proteína', u:'g', meta: perfil.proteina_g},
    {k:'calcio_mg', nom:'calcio', u:'mg', meta: perfil.calcio_mg},
    (fib && !malHoy) ? {k:'fibra', nom:'fibra', u:'g', meta: fib.meta} : null
  ].filter(Boolean).map(n => Object.assign(n, {falta: n.meta - t[n.k].total}))
   .filter(n => n.falta > 0).sort((a,b) => b.falta/b.meta - a.falta/a.meta);
  if(!necesidades.length) return {m: m.t, txt: pre + 'Hoy ya cubriste proteína, calcio y fibra. Come lo que te provoque.'};

  const n = necesidades[0];
  const porComida = n.falta / restantes;
  const candidatos = nuAlimentos.filter(a => !a.lactosa && !NO_SUGERIR.includes(a.categoria) && a[n.k]!=null
      && !(malHoy && a.categoria==='legumbre') && !(m.t==='la cena' && a.cafeina))
    .map(a => { const p = porcionDe(a); return {a, p, v: Number(a[n.k])*p.g/100, casa: enCasa.has(String(a.id))}; })
    .filter(c => c.v >= MINIMO_UTIL[n.k])
    .sort((x,y) => (y.casa-x.casa) || (y.v-x.v));
  if(!candidatos.length) return null;
  const elegidos = candidatos.slice(0,2);
  const lista = elegidos.map(c => `${c.a.nombre.toLowerCase()} (${c.p.u}: ${r0(c.v)} ${n.u})`).join(' o ');
  const opciones = elegidos.every(c => c.casa) ? `De lo que tienes: ${lista}` : lista.charAt(0).toUpperCase() + lista.slice(1);
  if(!pre && pocoSueno && n.k==='proteina') pre = `Dormiste ${r1(Number(rd.sueno_horas))} h: la proteína te sostiene mejor que el azúcar. `;
  let txt = pre + `Te faltan ${r0(n.falta)} ${n.u} de ${n.nom}; para ${m.t} te sirven unos ${r0(porComida)} ${n.u}. ${opciones}.`;
  if(!pre && rd.ciclo_fase==='Menstrual' && n.k==='proteina') txt += ' En estos días, lentejas o carne también te reponen hierro.';
  return {m: m.t, txt};
}

function pintarDespSug() {

async function despAgregar(alimentoId) {
  const input = document.getElementById('desp-input');

  const nombre = a ? a.nombre : input.value.trim();

async function despGuardar(alimentoId, nombre, extra={}) {
  const ya = despensa.find(d => (alimentoId && String(d.alimento_id)===String(alimentoId)) || nuNorm(d.nombre)===nuNorm(nombre));
  if(ya) { if(ya.estado!=='hay') await despEstado(ya.id, 'hay'); return; }
  try {
    const r = await sb('nutri_despensa','POST',Object.assign({alimento_id: alimentoId, nombre, estado:'hay'}, extra));
    if(r && r[0]) despensa.push(r[0]);
  } catch(e) { console.error(e); alert('No se pudo guardar. Revisa la conexión.'); }
  pintarDespensa(); pintarHoy();
}

async function despEstado(id, estado) {
  const d = despensa.find(x => x.id===id); if(!d) return;
  d.estado = estado; pintarDespensa(); pintarHoy();
  try { await sb('nutri_despensa','PATCH',{estado, actualizado: new Date().toISOString()},`?id=eq.${id}`); }
  catch(e) { console.error(e); alert('No se pudo guardar. Revisa la conexión.'); }
}

async function despBorrar(id) {
  despensa = despensa.filter(x => x.id!==id); pintarDespensa(); pintarHoy();
  try { await sb('nutri_despensa','DELETE',null,`?id=eq.${id}`); } catch(e) { console.error(e); }
}

const fechaCorta = f => new Date(f+'T12:00:00').toLocaleDateString('es-CO', {day:'numeric', month:'short'});
const diasHasta = f => Math.round((new Date(f+'T12:00:00') - new Date(hoy()+'T12:00:00')) / 86400000);

function listaAgrupada(lista, accion, textoAccion) {
  const grupos = {};
  lista.forEach(d => { const g = pasilloDe(d); (grupos[g] = grupos[g] || []).push(d); });
  return Object.keys(grupos).sort().map(g => `<div class="grupo">${esc(g)}</div>` + grupos[g].map(d => {
    const lact = (d.alergenos||[]).includes('en:milk');
    const vence = d.fecha_vencimiento ? `<span class="tag${diasHasta(d.fecha_vencimiento)<=3?' alerta':''}">vence ${fechaCorta(d.fecha_vencimiento)}</span>` : '';
    let h = `<div class="item"><span class="nom" onclick="despAbrir('${d.id}')">${esc(d.nombre)}${d.cantidad_disponible?`<span class="tag">${esc(d.cantidad_disponible)}</span>`:''}${vence}${lact?'<span class="tag alerta">lactosa</span>':''}</span>
      <button class="accion" onclick="despEstado('${d.id}','${accion}')">${textoAccion}</button><button class="x" onclick="despBorrar('${d.id}')">✕</button></div>`;
    if(despAbierto===d.id) h += `<div class="detalle">
      <div class="campo"><span>Cantidad</span><input type="text" placeholder="ej. 2 latas" value="${esc(d.cantidad_disponible||'')}" onchange="despCampo('${d.id}','cantidad_disponible',this.value.trim()||null)"></div>
      <div class="campo"><span>Vence</span><input type="date" value="${d.fecha_vencimiento||''}" onchange="despCampo('${d.id}','fecha_vencimiento',this.value||null)"></div>
      ${d.marca ? `<div>Marca: ${esc(d.marca)}</div>` : ''}
      ${d.calorias_100g!=null ? `<div>Por 100 g: ${Math.round(d.calorias_100g)} kcal · P ${r1(d.proteina_100g||0)} · C ${r1(d.carbohidratos_100g||0)} · G ${r1(d.grasa_100g||0)} · fibra ${r1(d.fibra_100g||0)}</div>` : ''}
      ${(d.alergenos||[]).length ? `<div>Alérgenos: ${esc(d.alergenos.map(x => x.replace(/^\w+:/,'')).join(', '))}</div>` : ''}
      ${d.ingredientes ? `<div>Ingredientes: ${esc(d.ingredientes)}</div>` : ''}
    </div>`;
    return h;
  }).join('')).join('');
}

const ZXING_URL = 'https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js';

function escanear() { const f = document.getElementById('foto-codigo'); if(f) { f.value=''; f.click(); } }

async function fotoCodigo(input) {
  const file = input.files && input.files[0];
  if(!file) return;
  let codigo = null;
  try { codigo = await leerCodigo(file); } catch(e) { console.error('No se pudo leer el código:', e); }
  if(!codigo) codigo = (prompt('No vi un código de barras en la foto. Si lo tienes a mano, escribe los números de abajo del código:') || '').replace(/\D/g, '');
  if(!codigo) return;
  await agregarPorCodigo(codigo);
}

async function leerCodigo(file) {
  if('BarcodeDetector' in window) {
    try {
      const det = new BarcodeDetector({formats: ['ean_13','ean_8','upc_a','upc_e']});
      const r = await det.detect(await createImageBitmap(file));
      if(r && r[0]) return r[0].rawValue;
    } catch(e) {}
  }
  if(!window.ZXing) await new Promise((ok, mal) => {
    const s = document.createElement('script'); s.src = ZXING_URL; s.onload = ok; s.onerror = mal; document.head.appendChild(s);
  });
  // Las fotos del celular son enormes: se achican antes de leerlas
  const img = await new Promise((ok, mal) => { const i = new Image(); i.onload = () => ok(i); i.onerror = mal; i.src = URL.createObjectURL(file); });
  const k = Math.min(1, 1280 / Math.max(img.naturalWidth, img.naturalHeight));
  const cv = document.createElement('canvas');
  cv.width = Math.round(img.naturalWidth*k); cv.height = Math.round(img.naturalHeight*k);
  cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
  URL.revokeObjectURL(img.src);
  const r = await new ZXing.BrowserMultiFormatReader().decodeFromImageUrl(cv.toDataURL('image/jpeg', 0.9));
  return r ? r.getText() : null;
}

// ── Open Food Facts: nombre, marca, ingredientes, nutrientes y alérgenos ──
// Se priorizan productos de Canadá y de los súper donde compras en Quebec.
const TIENDAS_QC = ['metro', 'loblaws', 'iga', 'costco', 'super c', 'maxi', 'provigo'];
const OFF_CAMPOS = 'code,product_name,product_name_es,product_name_fr,brands,stores,stores_tags,countries_tags,nutriments,allergens_tags,ingredients_text_es,ingredients_text_fr,ingredients_text,serving_quantity';
let offResultados = [];

const offNombre = (p, codigo) => (p.product_name_es || p.product_name_fr || p.product_name || `Producto ${codigo||p.code}`).trim();
const offMarca = p => (Array.isArray(p.brands) ? p.brands[0] : String(p.brands||'').split(',')[0]).trim() || null;
const offTiendas = p => [].concat(p.stores_tags || [], String(p.stores||'').split(',')).map(x => String(x).trim().toLowerCase().replace(/-/g,' ')).filter(Boolean);
const offPuntaje = p => (offTiendas(p).some(t => TIENDAS_QC.some(q => t.includes(q))) ? 2 : 0)
  + ((p.countries_tags||[]).includes('en:canada') ? 1 : 0) + (p.nutriments && p.nutriments['energy-kcal_100g']!=null ? 1 : 0);

function offFilaDespensa(p, codigo) {
  const n = p.nutriments || {};
  const num = v => (v===undefined || v===null || v==='') ? null : Number(v);
  return {
    codigo_barras: codigo || p.code || null, marca: offMarca(p),
    ingredientes: p.ingredients_text_es || p.ingredients_text_fr || p.ingredients_text || null,
    calorias_100g: num(n['energy-kcal_100g']) ?? (num(n['energy_100g'])!=null ? Math.round(num(n['energy_100g'])/4.184) : null),
    proteina_100g: num(n.proteins_100g), carbohidratos_100g: num(n.carbohydrates_100g), grasa_100g: num(n.fat_100g), fibra_100g: num(n.fiber_100g),
    alergenos: p.allergens_tags || [], tiendas: offTiendas(p).join(', ') || null
  };
}

async function offProducto(codigo) {
  try {
    const res = await fetch(`https://world.openfoodfacts.org/api/v2/product/${codigo}.json?fields=${OFF_CAMPOS}`);
    const j = await res.json();
    return (j && j.status===1) ? j.product : null;
  } catch(e) { console.error(e); return null; }
}

// Crea (o reusa) el alimento en la base para que el registro lo encuentre al anotar
async function alimentoDesdeOFF(p, codigo) {
  const ya = nuAlimentos.find(x => x.codigo_barras===codigo);
  if(ya) return ya;
  const f = offFilaDespensa(p, codigo), n = p.nutriments || {};
  const num = v => (v===undefined || v===null || v==='') ? null : Number(v);
  const marca = f.marca ? ` · ${f.marca}` : '';
  const nombre = offNombre(p, codigo) + marca;
  const sinLactosa = /sans lactose|lactose[- ]free|sin lactosa|deslactosad/i.test(nombre);
  try {
    const r = await sb('nutri_alimentos','POST',{
      nombre, norm: nuNorm(nombre)+' '+codigo, categoria: 'empacado',
      porciones: [p.serving_quantity ? {u:'porción', g:Number(p.serving_quantity)} : null, {u:'100 g', g:100}].filter(Boolean),
      kcal: f.calorias_100g, proteina: f.proteina_100g, carbo: f.carbohidratos_100g, grasa: f.grasa_100g, fibra: f.fibra_100g,
      calcio_mg: num(n.calcium_100g)==null ? null : Math.round(num(n.calcium_100g)*1000),
      vitd_ui: num(n['vitamin-d_100g'])==null ? null : Math.round(num(n['vitamin-d_100g'])*4e7),   // OFF los da en gramos
      lactosa: !sinLactosa && f.alergenos.includes('en:milk'), cafeina: false,
      fuente: 'Open Food Facts', codigo_barras: codigo
    });
    const a = r && r[0];
    if(a) nuAlimentos.push(a);
    return a || null;
  } catch(e) { console.error(e); return null; }
}

async function agregarProductoOFF(p, codigo) {
  const a = await alimentoDesdeOFF(p, codigo);
  await despGuardar(a ? a.id : null, a ? a.nombre : offNombre(p, codigo), offFilaDespensa(p, codigo));
}

async function agregarPorCodigo(codigo) {
  const p = await offProducto(codigo);
  if(p) return agregarProductoOFF(p, codigo);
  // No está en Open Food Facts: se agrega a mano, con su código
  const nombre = (prompt('Ese producto no está en Open Food Facts. ¿Cómo se llama?') || '').trim();
  if(nombre) await despGuardar(null, nombre, {codigo_barras: codigo});
}

// Búsqueda por nombre: primero el buscador clásico de OFF, si no responde el nuevo
async function buscarOFF() {
  const input = document.getElementById('desp-input');
  const el = document.getElementById('desp-sug');
  const q = input.value.trim();
  if(q.length < 3) return;
  el.innerHTML = '<span class="vacio">Buscando en Open Food Facts…</span>';
  let hits = [];
  try {
    const r = await fetch(`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=30&tagtype_0=countries&tag_contains_0=contains&tag_0=canada&fields=${OFF_CAMPOS}`);
    const j = await r.json();
    hits = j.products || [];
  } catch(e) {
    try {
      const r = await fetch(`https://search.openfoodfacts.org/search?q=${encodeURIComponent(q + ' countries_tags:"en:canada"')}&page_size=30&fields=${OFF_CAMPOS}`);
      const j = await r.json();
      hits = j.hits || [];
    } catch(e2) { console.error(e2); }
  }
  offResultados = hits.filter(p => p.code && (p.product_name || p.product_name_fr || p.product_name_es))
    .sort((x,y) => offPuntaje(y) - offPuntaje(x)).slice(0, 8);
  el.innerHTML = offResultados.length
    ? offResultados.map((p,k) => `<button onclick="elegirOFF(${k})">${esc(offNombre(p))}${offMarca(p)?' · '+esc(offMarca(p)):''}</button>`).join('')
      + `<button onclick="despAgregar(null)">+ ${esc(q)} a mano</button>`
    : `<span class="vacio">No lo encontré. </span><button onclick="despAgregar(null)">+ ${esc(q)} a mano</button>`;
}

async function elegirOFF(k) {
  const p = offResultados[k]; if(!p) return;
  document.getElementById('desp-input').value = '';
  document.getElementById('desp-sug').innerHTML = '';
  await agregarProductoOFF(p, p.code);
}

// ── Anillos ──
const CIRC = r => 2 * Math.PI * r;
// Arranca vacío y se llena con animación en el siguiente cuadro (ver animarAnillos)
// Cada anillo recuerda dónde quedó: al repintar se mueve desde ahí, no desde cero
const ultimosArcos = {};
function arco(r, grosor, clase, pct, clave) {
  const c = CIRC(r), k = clave || clase;
  const desde = (k in ultimosArcos) ? ultimosArcos[k] : c;
  return `<circle class="pista" r="${r}" cx="50%" cy="50%" stroke-width="${grosor}"/>
    <circle class="arco ${clase}" r="${r}" cx="50%" cy="50%" stroke-width="${grosor}" stroke-dasharray="${c}" stroke-dashoffset="${desde}" data-off="${c*(1-Math.min(1,pct))}" data-k="${k}"/>`;
}
function animarAnillos() {
  requestAnimationFrame(() => requestAnimationFrame(() =>
    document.querySelectorAll('circle.arco[data-off]').forEach(el => { el.setAttribute('stroke-dashoffset', el.dataset.off); ultimosArcos[el.dataset.k] = el.dataset.off; })));
}
// Cuenta hacia arriba el número grande
let ultimoNumero = 0;
function contar(el, hasta) {
  if(!el) return;
  const desde = ultimoNumero; ultimoNumero = hasta;
  const t0 = performance.now(), dur = 900;
  const paso = t => { const k = Math.min(1, (t - t0)/dur), e = 1 - Math.pow(1-k, 3); el.textContent = Math.round(desde + (hasta-desde)*e); if(k < 1) requestAnimationFrame(paso); };
  requestAnimationFrame(paso);
}

const COLOR_MINI = {carbo:'var(--orange)', grasa:'var(--sun)', fibra:'var(--fresh)', calcio:'var(--fresh-deep)', vitd:'var(--orange-deep)'};
function mini(nombre, t, meta, unidad, color) {
  const pct = meta ? t.total/meta : 0;
  const pre = t.faltan ? '≥' : '';
  const ast = t.est ? '*' : '';
  return `<div class="mini">
    <svg viewBox="0 0 52 52">${arco(22, 6, '', pct, nombre).replace('class="arco ', `style="stroke:${color}" class="arco `)}</svg>
    <div class="mini-num">${pre}${r0(t.total)}${ast}<span style="font-size:11px;font-weight:500;color:var(--muted)">${meta ? '/'+meta : ''}</span></div>
    <div class="mini-nom">${nombre} · ${unidad}</div>
  </div>`;
}

// ── 💊 Suplementos: un toque = tomado ahora (suma a los anillos) ──
// Excepción a "Nutri no registra": los suplementos no son comidas y no se anotan en otro lado.
const NUT_CAMPOS = [['kcal','kcal'], ['proteina','proteína g'], ['carbo','carbos g'], ['grasa','grasa g'], ['fibra','fibra g'], ['calcio_mg','calcio mg'], ['vitd_ui','vit D UI'], ['magnesio_mg','magnesio mg']];
const horaAhora = () => { const d = new Date(); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };

function htmlSuplementos(f) {
  if(!suplementos.length && !supEditando) return `<div class="card"><div class="label">💊 Suplementos</div>
    <button class="boton" style="margin-top:0" onclick="supAgregar()">+ Agregar suplemento</button></div>`;
  let h = `<div class="card"><div class="label" style="display:flex;justify-content:space-between">💊 Suplementos
    <button class="link" style="font-size:12px" onclick="supEditar()">${supEditando ? 'Listo' : 'Editar'}</button></div>`;
  if(!supEditando) {
    h += `<div class="sug" style="margin-top:0">${suplementos.map(sp => {
      const tm = tomas.filter(x => x.fecha===f && x.suplemento_id===sp.id);
      const ult = tm[tm.length-1];
      return `<button class="${tm.length ? 'tomado' : ''}" onclick="supTomar('${sp.id}')">${tm.length ? '✓ ' : ''}${esc(sp.nombre)}${ult ? ` · ${ult.hora}` : (sp.horario ? ` · ${esc(sp.horario)}` : '')}${!sp.diario ? ' <span style="opacity:.6">(a veces)</span>' : ''}</button>`;
    }).join('')}</div>
    <div class="nota">Un toque lo marca como tomado ahora; otro toque lo deshace.</div>`;
  } else {
    h += suplementos.map(sp => {
      const n = sp.nutrientes || {};
      return `<div class="sup-edit">
        <div class="campo"><span>Nombre</span><input value="${esc(sp.nombre)}" onchange="supCampo('${sp.id}','nombre',this.value.trim())"></div>
        <div class="campo"><span>Marca</span><input value="${esc(sp.marca||'')}" onchange="supCampo('${sp.id}','marca',this.value.trim()||null)"></div>
        <div class="campo"><span>Dosis</span><input value="${esc(sp.dosis||'')}" onchange="supCampo('${sp.id}','dosis',this.value.trim()||null)"></div>
        <div class="campo"><span>Horario</span><input value="${esc(sp.horario||'')}" placeholder="ej. mañana" onchange="supCampo('${sp.id}','horario',this.value.trim()||null)"></div>
        <div class="campo"><span>¿Es diario?</span><select onchange="supCampo('${sp.id}','diario',this.value==='si')"><option value="si"${sp.diario?' selected':''}>sí</option><option value="no"${!sp.diario?' selected':''}>a veces</option></select></div>
        <div class="nota" style="margin:6px 0 2px">Lo que aporta por dosis (vacío = no aporta · ? = aporta pero no sé cuánto)</div>
        <div class="metas">${NUT_CAMPOS.map(([c,t]) => `<label class="meta-c"><input class="sup-num" inputmode="decimal" value="${(c in n) ? (n[c]==null ? '?' : n[c]) : ''}" onchange="supNutriente('${sp.id}','${c}',this.value)"><span>${t}</span></label>`).join('')}</div>
        <button class="link" style="font-size:12px;margin:10px 0 4px;color:var(--berry)" onclick="supQuitar('${sp.id}')">Quitar ${esc(sp.nombre)}</button>
      </div>`;
    }).join('') + `<button class="boton" onclick="supAgregar()">+ Agregar suplemento</button>`;
  }
  return h + `</div>`;
}

async function supTomar(id) {
  const f = hoy();
  const sp = suplementos.find(x => x.id===id); if(!sp) return;
  const tm = tomas.filter(x => x.fecha===f && x.suplemento_id===id);
  try {
    if(tm.length) {   // ya estaba: el toque lo deshace
      const ult = tm[tm.length-1];
      tomas = tomas.filter(x => x!==ult); pintarHoy();
      if(ult.id) await sb('suplementos_tomas','DELETE',null,`?id=eq.${ult.id}`);
    } else {
      const fila = {suplemento_id: id, fecha: f, hora: horaAhora(), nutrientes: sp.nutrientes || {}};
      tomas.push(fila); pintarHoy(); avisar(`✓ ${sp.nombre}`);
      const r = await sb('suplementos_tomas','POST',fila);
      if(r && r[0]) Object.assign(fila, r[0]);
    }
  } catch(e) { console.error(e); alert('No se pudo guardar. Revisa la conexión.'); }
}

function supEditar() { supEditando = !supEditando; pintarHoy(); }

async function supAgregar() {
  const nombre = (prompt('¿Cómo se llama el suplemento?') || '').trim();
  if(!nombre) return;
  try {
    const r = await sb('suplementos','POST',{nombre, nutrientes: {}, diario: true, orden: suplementos.length+1});
    if(r && r[0]) suplementos.push(r[0]);
    supEditando = true; pintarHoy();
  } catch(e) { console.error(e); alert('No se pudo guardar. Revisa la conexión.'); }
}

async function supCampo(id, campo, valor) {
  const sp = suplementos.find(x => x.id===id); if(!sp) return;
  if(campo==='nombre' && !valor) return;
  sp[campo] = valor;
  try { await sb('suplementos','PATCH',{[campo]: valor},`?id=eq.${id}`); }
  catch(e) { console.error(e); alert('No se pudo guardar. Revisa la conexión.'); }
}

async function supNutriente(id, campo, texto) {
  const sp = suplementos.find(x => x.id===id); if(!sp) return;
  const n = Object.assign({}, sp.nutrientes || {});
  const v = String(texto).trim().replace(',', '.');
  if(v==='') delete n[campo];
  else if(v==='?') n[campo] = null;
  else if(!isNaN(Number(v))) n[campo] = Number(v);
  else return;
  sp.nutrientes = n;
  try { await sb('suplementos','PATCH',{nutrientes: n},`?id=eq.${id}`); }
  catch(e) { console.error(e); alert('No se pudo guardar. Revisa la conexión.'); }
}

async function supQuitar(id) {
  const sp = suplementos.find(x => x.id===id); if(!sp) return;
  if(!confirm(`¿Quitar ${sp.nombre} de tu lista? Lo que ya tomaste se queda en el historial.`)) return;
  suplementos = suplementos.filter(x => x!==sp); pintarHoy();
  try { await sb('suplementos','PATCH',{activo: false},`?id=eq.${id}`); } catch(e) { console.error(e); }
}

// ── Semana ──
function detonantes() {
  // Comidas con reacción, y qué tenían (lactosa, cafeína)
  const sem = diasSemana().concat([haceDias(7), haceDias(8), haceDias(9)]);
  const comidas = digestion.filter(d => d.reaccion && sem.includes(d.fecha)).map(d => {
    const its = items.filter(x => x.fecha===d.fecha && x.comida===d.comida && (d.comida!=='extra' || x.extra_ref===d.extra_ref));
    return {mal: d.reaccion!=='bien', lactosa: its.some(x => x.lactosa), cafeina: its.some(x => x.cafeina), n: its.length};
  }).filter(c => c.n);
  const out = [];
  [['lactosa','con lactosa'], ['cafeina','con café']].forEach(([k, txt]) => {
    const con = comidas.filter(c => c[k]), sin = comidas.filter(c => !c[k]);
    if(con.length < MIN_COMIDAS_DETONANTE || sin.length < MIN_COMIDAS_DETONANTE) {
      out.push({txt, listo:false, falta: Math.max(0, MIN_COMIDAS_DETONANTE-con.length) + Math.max(0, MIN_COMIDAS_DETONANTE-sin.length)});
      return;
    }
    const pc = con.filter(c => c.mal).length/con.length, ps = sin.filter(c => c.mal).length/sin.length;
    out.push({txt, listo:true, pc: r0(pc*100), ps: r0(ps*100), nc: con.length, ns: sin.length});
  });
  return out;
}

// Baño de cada día cruzado con lo de ese día y los 2 anteriores
// Eje intestino-cerebro: el estrés cambia el ritmo del intestino (cortisol y nervio vago;
// el sistema nervioso entérico responde a las mismas señales que el ánimo). Se compara qué
// tan seguido el baño salió distinto de lo normal (Bristol ≠ 4 o con molestia) en días
// ansiosos/cargados/difíciles vs. días tranquilos. Sólo con ≥2 de cada lado y ≥5 en total.
const EMOCION_CARGA = ['⚡ Ansiosa', '🌊 Cargada', '😔 Difícil'];
function ejeIntestinoCerebro() {
  const conTipo = banos.filter(b => b.bristol);
  const emocionDe = f => (registros.find(r => r.fecha===f) || {}).emocion;
  const raro = b => b.bristol !== 4 || (Array.isArray(b.molestias) && b.molestias.length > 0);
  const carga = conTipo.filter(b => EMOCION_CARGA.includes(emocionDe(b.fecha)));
  const calma = conTipo.filter(b => { const e = emocionDe(b.fecha); return e && !EMOCION_CARGA.includes(e); });
  if(conTipo.length < 5 || carga.length < 2 || calma.length < 2) return null;
  const pct = a => r0(a.filter(raro).length / a.length * 100);
  return {carga: pct(carga), calma: pct(calma), nc: carga.length, nt: calma.length};
}

function banoCruce() {
  const conTipo = banos.filter(b => b.bristol);
  if(conTipo.length < 5) return null;
  const fibra3 = f => { let s=0,n=0; for(let i=0;i<3;i++){ const d=new Date(f+'T12:00:00'); d.setDate(d.getDate()-i); const t=totalesDia(fechaLocal(d)); if(t.n){ s+=t.fibra.total; n++; } } return n ? s/n : null; };
  const duras = conTipo.filter(b => b.bristol<=2).map(b => fibra3(b.fecha)).filter(v => v!=null);
  const normales = conTipo.filter(b => b.bristol>2 && b.bristol<6).map(b => fibra3(b.fecha)).filter(v => v!=null);
  if(duras.length<2 || normales.length<2) return null;
  const prom = a => r1(a.reduce((x,y)=>x+y,0)/a.length);
  return {duras: prom(duras), normales: prom(normales), nd: duras.length, nn: normales.length};
}

// Una sola recomendación, la de mayor brecha.
function coach() {
  const dias = diasConRegistro();
  if(!perfil) return null;
  if(dias.length < MIN_DIAS_COACH) return {txt: `Con ${MIN_DIAS_COACH} días anotados te digo una sola cosa para la semana. Llevas ${dias.length}.`};
  const prom = c => dias.reduce((a,f) => a + totalesDia(f)[c].total, 0) / dias.length;
  const p = prom('proteina'), cal = prom('calcio_mg'), k = prom('kcal'), fib = metaFibra();
  if(p < perfil.proteina_g*0.85)
    return {txt: `Tu proteína promedio va en ${r0(p)} g de ${perfil.proteina_g}. Sumarla al desayuno es lo más fácil: 2 huevos son unos 25 g.`};
  if(k < perfil.kcal*0.85)
    return {txt: `Estás comiendo unas ${r0(k)} kcal de ${perfil.kcal}. Para sanar el hueso y ganar músculo el cuerpo necesita llegar al mantenimiento.`};
  if(cal < perfil.calcio_mg*0.7)
    return {txt: `Calcio: al menos ${r0(cal)} mg de ${perfil.calcio_mg}. Sardinas, tofu con calcio o leche sin lactosa lo suben sin lácteos que te caigan mal.`};
  if(fib && fib.prom < fib.meta)
    return {txt: `Fibra esta semana: ${fib.meta} g (vienes de ${fib.prom}). Sube de a poco: un cucharón de frijoles o lentejas son unos 10 g.`};
  return {txt: 'Esta semana vas cuadrando con tu objetivo. Sigue igual.'};
}

function pintarSemana() {
  const dias = diasSemana();
  let h = '';
  const c = coach();
  if(c) h += `<div class="card ahora"><div class="label">💬 Esta semana</div><div class="voz">${esc(c.txt)}</div></div>`;

  if(perfil) {
    const max = Math.max(perfil.kcal*1.15, ...dias.map(f => totalesDia(f).kcal.total));
    h += `<div class="card"><div class="label">Calorías por día</div><div class="grafico">
      <div class="meta" style="bottom:${22 + perfil.kcal/max*110}px"><span>${perfil.kcal}</span></div>`;
    dias.forEach((f,k) => {
      const t = totalesDia(f);
      const alto = t.n ? Math.max(6, t.kcal.total/max*110) : 0;
      h += `<div class="col"><span class="val">${t.n ? r0(t.kcal.total) : '—'}</span>
        <div class="pista-v"><div class="barra-v${!t.n ? ' vacia' : (t.kcal.total>perfil.kcal*1.08 ? ' pasa' : '')}" style="height:${alto}px;animation-delay:${k*0.06}s"></div></div>
        <span class="dia">${nombreDia(f)}</span></div>`;
    });
    h += `</div><div class="nota">Línea naranja: tu objetivo. "—" es un día sin anotar: es un dato, no una falla.</div></div>`;
  }

  const det = detonantes();
  const cruce = banoCruce();
  h += `<div class="card"><div class="label">Detonantes</div>`;
  det.forEach(d => {
    h += d.listo
      ? `<div class="fila"><span>Comidas ${d.txt}</span><span class="der">${d.pc}% te cayeron regular o mal (${d.nc})<br>sin: ${d.ps}% (${d.ns})</span></div>`
      : `<div class="fila"><span>Comidas ${d.txt}</span><span class="der">faltan ${d.falta} comidas con 👍😐👎</span></div>`;
  });
  h += cruce
    ? `<div class="fila"><span>Baño y fibra</span><span class="der">días de baño duro: ${cruce.duras} g de fibra (3 días)<br>baño normal: ${cruce.normales} g</span></div>`
    : `<div class="fila"><span>Baño y fibra</span><span class="der">aparece con 5 registros de baño con tipo</span></div>`;
  const eje = ejeIntestinoCerebro();
  h += eje
    ? `<div class="fila"><span>Baño y ánimo</span><span class="der">días ansiosa o cargada: ${eje.carga}% fuera de lo normal (${eje.nc})<br>días tranquilos: ${eje.calma}% (${eje.nt})</span></div>`
    : `<div class="fila"><span>Baño y ánimo</span><span class="der">aparece con 5 registros de baño con tipo y emoción del día</span></div>`;
  h += `<div class="nota">Sólo se compara cuando hay datos suficientes de los dos lados. Intestino y cerebro se hablan todo el tiempo: el ánimo cambia el ritmo del intestino y al revés.</div></div>`;

  document.getElementById('tab-semana').innerHTML = h;
}

// ── Perfil ──
function recalcular(p) {
  const bmr = 10*p.peso_kg + 6.25*p.estatura_cm - 5*p.edad - 161;
  const kcal = Math.round(bmr * ACTIVIDAD[p.actividad].f / 10) * 10;
  const proteina_g = r0(PROTEINA_G_KG * p.peso_kg);
  const grasa_g = r0(GRASA_G_KG * p.peso_kg);
  const carbo_g = r0((kcal - proteina_g*4 - grasa_g*9) / 4);   // los totales siempre cuadran
  return {kcal, proteina_g, grasa_g, carbo_g};
}

async function cambiarPerfil(campo, valor) {
  if(!perfil) return;
  const p = Object.assign({}, perfil, {[campo]: valor});
  if(!p.peso_kg || !p.estatura_cm || !p.edad) return;
  const cambios = Object.assign({[campo]: valor}, recalcular(p), {actualizado: new Date().toISOString()});
  Object.assign(perfil, cambios);
  pintarPerfil(); pintarHoy(); pintarSemana();
  try { await sb('nutri_perfil','PATCH',cambios,'?id=eq.laura'); }
  catch(e) { console.error(e); alert('No se pudo guardar. Revisa la conexión.'); }
}

function pintarPerfil() {
  const el = document.getElementById('tab-perfil');
  if(!perfil) { el.innerHTML = '<div class="card vacio">Sin perfil todavía.</div>'; return; }
  const p = perfil;
  const fib = metaFibra();
  el.innerHTML = `

function formatHora12(hhmm) {

async function sbLog(tabla, method, body=null, params='') {
  const headers = {'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`,'Content-Type':'application/json'};
  if(method==='POST') headers['Prefer']='return=representation'+(params.includes('on_conflict')?',resolution=merge-duplicates':'');
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${tabla}${params}`,{method, keepalive:true, headers, body:body?JSON.stringify(body):null});
  if(method==='DELETE') return res;
  if(!res.ok) throw new Error('HTTP '+res.status);
  const txt = await res.text();
  return txt ? JSON.parse(txt) : null;
}

function setSyncing(on) { const e = document.getElementById('reg-estado'); if(e) { e.classList.remove('error'); e.textContent = on ? 'guardando…' : ''; } }

function nuColaLeer() { try { return JSON.parse(localStorage.getItem('nu_cola')||'[]'); } catch(e){ return []; } }

async function nuVaciarCola() {
  const cola = nuColaLeer();
  if(!cola.length) return;
  const quedan = [];
  for(const op of cola) {
    const body = Object.assign({}, op.body); delete body.id;
    try { await sbLog(op.tabla, 'POST', body, op.params||''); }
    catch(e) { quedan.push(op); }
  }
  nuColaGuardar(quedan);
}

// Un upsert (on_conflict) reemplaza lo que hubiera pendiente en la cola para la misma
// comida. Sin esto, un "afuera: sí" que falló se reenviaba después y pisaba el "no".
function nuQuitarPendientesIguales(tabla, fila, params) {
  if(!params.includes('on_conflict')) return;
  const igual = b => b.fecha===fila.fecha && b.comida===fila.comida && (b.extra_ref||'')===(fila.extra_ref||'');
  nuColaGuardar(nuColaLeer().filter(o => !(o.tabla===tabla && igual(o.body))));
}

async function nuInsertar(tabla, fila, params='') {
  setSyncing(true);
  nuQuitarPendientesIguales(tabla, fila, params);
  try {
    const r = await sbLog(tabla, 'POST', fila, params);
    setSyncing(false); clearSyncError();
    return (Array.isArray(r) && r[0]) ? r[0] : fila;
  } catch(e) {
    console.error(e); setSyncError();
    const tmp = Object.assign({id: nuTmpId()}, fila);
    const cola = nuColaLeer(); cola.push({tabla, params, body: tmp}); nuColaGuardar(cola);
    return tmp;
  }
}

async function nuActualizar(tabla, fila, cambios) {

  setSyncing(true);
  try { await sbLog(tabla, 'PATCH', cambios, `?id=eq.${fila.id}`); setSyncing(false); clearSyncError(); }
  catch(e) { console.error(e); setSyncError(); }
