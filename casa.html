<head>

<style>
  :root {
    --bg: #f7f5ef; --bg-soft: #efece2; --card: #ffffff; --ink: #22302a; --ink-soft: #55635c; --line: #ddd8c9;
    --green: #1e6b4f; --green-deep: #14503a; --green-soft: #dcebe2;
    --terra: #d96f47; --terra-soft: #fbe7dd; --amber: #b97f16; --amber-soft: #f7ecd2;
    --blue-soft: #dde8f2; --blue: #2e5f87; --compost: #7a5c2e; --compost-soft: #efe4cf;
    --on-accent: #fff;
    --shadow: 0 2px 10px rgba(34, 48, 42, .07); --radius: 18px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141a17; --bg-soft: #1b231f; --card: #202a25; --ink: #eef3ef; --ink-soft: #a9b8af; --line: #37453d;
      --green: #4cc38a; --green-deep: #7fd6ab; --green-soft: #24402f;
      --terra: #f0946d; --terra-soft: #452e23; --amber: #e3b356; --amber-soft: #42381e;
      --blue-soft: #24384c; --blue: #8db8dd; --compost: #d3ab6d; --compost-soft: #3d3320;
      --on-accent: #0e241a;
      --shadow: 0 2px 10px rgba(0, 0, 0, .35);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Outfit", system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 880px; margin: 0 auto; padding: calc(20px + env(safe-area-inset-top)) 16px 64px; }
  button { font: inherit; }

  /* ---------- Header ---------- */
  header.top { padding: 14px 2px 6px; }
  .langrow { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; }
  .yo { border: 0; background: transparent; color: var(--ink-soft); font-size: .88rem; cursor: pointer; padding: 6px 2px; text-align: left; }
  .yo b { color: var(--ink); }
  .langtoggle { display: inline-flex; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 4px; gap: 4px; box-shadow: var(--shadow); margin-left: auto; }
  .langtoggle button { border: 0; background: transparent; color: var(--ink-soft); font-weight: 700; font-size: .9rem; padding: 7px 16px; border-radius: 999px; cursor: pointer; }
  .langtoggle button[aria-pressed="true"] { background: var(--green); color: var(--on-accent); }
  h1 { font-size: clamp(1.7rem, 5.4vw, 2.5rem); line-height: 1.12; margin: 0 0 10px; font-weight: 800; letter-spacing: -.01em; }
  h1 .hl { color: var(--green); }
  .lede { font-size: 1.06rem; color: var(--ink-soft); margin: 0 0 6px; max-width: 62ch; }
  .handnote { font-family: "Caveat", cursive; font-size: 1.35rem; color: var(--terra); margin: 4px 0 0; }

  .namebar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 13px 16px; margin-top: 16px; }
  .namebar label { font-weight: 700; font-size: .95rem; }
  .namebar input { font: inherit; font-weight: 700; padding: 9px 13px; border-radius: 11px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); width: 170px; max-width: 55vw; }
  .namebar input[readonly] { background: transparent; }
  .namebar .hint { color: var(--ink-soft); font-size: .88rem; flex: 1 1 220px; }

  nav.quick { display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0 6px; }
  nav.quick a { text-decoration: none; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; font-size: .92rem; font-weight: 600; box-shadow: var(--shadow); }
  nav.quick a:active { transform: scale(.97); }

  section { margin-top: 34px; scroll-margin-top: 12px; }
  h2 { font-size: 1.35rem; margin: 0 0 4px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
  h2 .n { background: var(--green); color: var(--on-accent); width: 30px; height: 30px; flex: 0 0 30px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; font-size: 1rem; }
  .sub { color: var(--ink-soft); margin: 0 0 16px; max-width: 64ch; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }

  /* ---------- Calendario ---------- */
  .task { padding: 16px; margin-bottom: 12px; }
  .task.hecha { border-color: var(--green); }
  .task-head { display: flex; align-items: flex-start; gap: 12px; }
  .task-ico { width: 44px; height: 44px; flex: 0 0 44px; border-radius: 13px; background: var(--green-soft); display: flex; align-items: center; justify-content: center; }
  .task-ico svg { width: 24px; height: 24px; stroke: var(--green-deep); }
  .task-title { font-weight: 700; font-size: 1.05rem; margin: 0; }
  .task-desc { color: var(--ink-soft); font-size: .93rem; margin: 2px 0 0; }
  .task-when { margin-left: auto; text-align: right; flex: 0 0 auto; }
  .task-when .day { font-weight: 800; color: var(--green-deep); font-size: 1rem; }
  .task-when .time, .task-when .turno { color: var(--ink-soft); font-size: .88rem; display: block; }
  .task-edit { margin-top: 12px; border-top: 1px dashed var(--line); padding-top: 12px; }
  .edit-label { font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-soft); margin: 0 0 8px; }
  .daychips { display: flex; flex-wrap: wrap; gap: 6px; }
  .daychips button, .whochips button { border: 1px solid var(--line); background: var(--bg-soft); color: var(--ink); font-size: .88rem; font-weight: 600; padding: 7px 12px; border-radius: 999px; cursor: pointer; }
  .daychips button[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: var(--on-accent); }
  .whochips button[aria-pressed="true"] { background: var(--terra); border-color: var(--terra); color: var(--on-accent); }
  .whochips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; align-items: center; }
  .whochips .lbl { font-size: .88rem; color: var(--ink-soft); margin-right: 2px; font-weight: 600; }
  .timerow { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .timerow .lbl { font-size: .88rem; color: var(--ink-soft); font-weight: 600; }
  .timerow input { font: inherit; padding: 6px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  .timerow button { border: 0; background: transparent; color: var(--ink-soft); font-size: .85rem; text-decoration: underline; cursor: pointer; }
  .done-btn { margin-top: 14px; width: 100%; border: 0; cursor: pointer; font-weight: 700; background: var(--green); color: var(--on-accent); border-radius: 12px; padding: 12px; font-size: 1rem; }
  .done-btn:active { transform: scale(.98); }
  .done-btn:disabled { opacity: .6; }
  .done-ok { margin-top: 14px; text-align: center; background: var(--green-soft); color: var(--green-deep); border-radius: 12px; padding: 11px; font-weight: 700; }
  .daily-note { background: var(--amber-soft); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; font-size: .97rem; }
  .daily-note strong { color: var(--amber); }

  /* ---------- Registro ---------- */
  .score { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .score .card { padding: 16px; text-align: center; }
  .score .who { font-weight: 700; font-size: 1rem; }
  .score .num { font-size: 2.4rem; font-weight: 800; line-height: 1.1; }
  .score .laura .num { color: var(--terra); }
  .score .room .num { color: var(--green); }
  .score .of { color: var(--ink-soft); font-size: .85rem; }
  .score .sem { color: var(--ink-soft); font-size: .82rem; margin-top: 6px; border-top: 1px dashed var(--line); padding-top: 6px; }
  .score .sem b { color: var(--ink); }
  .balance { height: 12px; border-radius: 999px; overflow: hidden; display: flex; background: var(--bg-soft); border: 1px solid var(--line); margin-bottom: 16px; }
  .balance .b-laura { background: var(--terra); transition: width .4s ease; }
  .balance .b-room { background: var(--green); transition: width .4s ease; }
  .regform { padding: 16px; margin-bottom: 12px; }
  .regform .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 560px) { .regform .grid { grid-template-columns: 1fr; } }
  .regform label { font-size: .82rem; font-weight: 700; color: var(--ink-soft); display: block; margin-bottom: 5px; }
  .regform select, .regform input { width: 100%; font: inherit; padding: 11px 12px; border-radius: 11px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  .quickrow { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .quickrow button { flex: 1 1 150px; border: 1px dashed var(--green); background: var(--green-soft); color: var(--green-deep); font-weight: 700; padding: 11px 10px; border-radius: 12px; cursor: pointer; font-size: .95rem; }
  .quickrow button:active { transform: scale(.97); }
  .entries { list-style: none; margin: 0; padding: 0; }
  .entries li { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 11px 14px; margin-bottom: 8px; box-shadow: var(--shadow); }
  .entries .dot { width: 11px; height: 11px; border-radius: 50%; flex: 0 0 11px; }
  .entries .dot.laura { background: var(--terra); }
  .entries .dot.roommate { background: var(--green); }
  .entries .what { font-weight: 600; }
  .entries .what .nota { color: var(--ink-soft); font-weight: 400; }
  .entries .meta { color: var(--ink-soft); font-size: .88rem; margin-left: auto; text-align: right; flex: 0 0 auto; }
  .entries .por { display: block; font-size: .78rem; }
  .entries .del { border: 0; background: transparent; color: var(--ink-soft); cursor: pointer; font-size: 1.15rem; line-height: 1; padding: 6px; border-radius: 8px; }
  .empty { color: var(--ink-soft); text-align: center; padding: 18px 10px; font-size: .95rem; }
  .toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(120px); background: var(--green-deep); color: #fff; padding: 12px 20px; border-radius: 999px; font-weight: 700; box-shadow: 0 8px 24px rgba(0,0,0,.25); transition: transform .3s ease; z-index: 50; max-width: calc(100vw - 32px); text-align: center; }
  @media (prefers-color-scheme: dark) { .toast { background: var(--green); color: #0e241a; } }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* ---------- Bacs ---------- */
  .bac-next { padding: 18px; margin-bottom: 12px; border-left: 6px solid var(--green); }
  .bac-next .when { font-size: 1.25rem; font-weight: 800; margin: 0 0 2px; }
  .bac-next .what { color: var(--ink-soft); margin: 0; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .pill { font-size: .85rem; font-weight: 700; padding: 5px 11px; border-radius: 999px; }
  .pill.basura { background: var(--green-soft); color: var(--green-deep); }
  .pill.reciclaje { background: var(--blue-soft); color: var(--blue); }
  .pill.compost { background: var(--compost-soft); color: var(--compost); }
  .bac-list { list-style: none; margin: 0; padding: 0; }
  .bac-list li { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 10px; padding: 11px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 8px; box-shadow: var(--shadow); }
  .bac-list .d { font-weight: 700; min-width: 118px; }
  .bac-list .out { margin-left: auto; color: var(--ink-soft); font-size: .87rem; text-align: right; }
  .today-tag { background: var(--terra); color: #fff; font-size: .75rem; font-weight: 800; padding: 3px 9px; border-radius: 999px; }

  /* ---------- Cómo limpiar ---------- */
  .howto { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 640px) { .howto { grid-template-columns: 1fr; } }
  .howto .card { padding: 18px; }
  .howto h3 { margin: 0 0 4px; font-size: 1.08rem; }
  .howto .freq { color: var(--terra); font-weight: 700; font-size: .88rem; margin: 0 0 12px; }
  .steps { list-style: none; margin: 0; padding: 0; counter-reset: st; }
  .steps li { counter-increment: st; position: relative; padding: 0 0 12px 40px; font-size: .96rem; }
  .steps li::before { content: counter(st); position: absolute; left: 0; top: 0; width: 27px; height: 27px; border-radius: 50%; background: var(--green-soft); color: var(--green-deep); font-weight: 800; font-size: .85rem; display: flex; align-items: center; justify-content: center; }
  .steps li:last-child { padding-bottom: 0; }
  .cats-note { margin-top: 12px; background: var(--bg-soft); border-radius: 14px; padding: 13px 16px; font-size: .95rem; color: var(--ink-soft); }
  .cats-note strong { color: var(--ink); }

  /* ---------- Insumos ---------- */
  .supplies { list-style: none; margin: 0; padding: 0; }
  .supplies li { display: flex; align-items: center; gap: 6px 10px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 8px; box-shadow: var(--shadow); flex-wrap: wrap; }
  .supplies .item { font-weight: 600; }
  .supplies .state { margin-left: auto; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: flex-end; }
  .supplies .state button { border: 1px solid var(--line); background: var(--bg-soft); color: var(--ink); font-size: .85rem; font-weight: 600; padding: 6px 11px; border-radius: 999px; cursor: pointer; }
  .supplies .state button.on { background: var(--amber-soft); border-color: var(--amber); color: var(--amber); font-weight: 800; }
  .supplies .bought { font-size: .85rem; color: var(--green-deep); font-weight: 700; flex-basis: 100%; }
  .supplies .falta-por { font-size: .85rem; color: var(--amber); font-weight: 600; flex-basis: 100%; }

  /* ---------- Mensaje ---------- */
  .msgcard { padding: 18px; margin-bottom: 12px; }
  .msgcard h3 { margin: 0 0 8px; font-size: 1rem; }
  .msgcard pre { white-space: pre-wrap; font-family: inherit; font-size: .95rem; margin: 0 0 12px; background: var(--bg-soft); border-radius: 12px; padding: 14px; color: var(--ink); }
  .copy-btn { border: 0; background: var(--terra); color: #fff; font-weight: 700; padding: 11px 18px; border-radius: 12px; cursor: pointer; width: 100%; }
  .copy-btn:active { transform: scale(.98); }
  .review { margin-top: 26px; background: var(--green-soft); border-radius: var(--radius); padding: 16px 18px; font-size: 1rem; }
  .review strong { color: var(--green-deep); }
  .review .fecha { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 12px; font-size: .9rem; color: var(--ink-soft); font-weight: 600; }
  .review .fecha input { font: inherit; padding: 7px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  footer { margin-top: 40px; color: var(--ink-soft); font-size: .88rem; text-align: center; }

  /* ---------- Entrada ---------- */
  .entrada { max-width: 460px; margin: 0 auto; }
  .entrada .card { padding: 18px; margin-top: 20px; }
  .entrada label { font-size: .82rem; font-weight: 700; color: var(--ink-soft); display: block; margin-bottom: 6px; }
  .entrada input { width: 100%; font: inherit; font-weight: 700; font-size: 1.1rem; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); letter-spacing: .15em; text-transform: uppercase; }
  .quien-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .quien-btns button { border: 0; padding: 18px 10px; border-radius: 14px; font-size: 1.1rem; font-weight: 800; color: #fff; cursor: pointer; }
  .quien-btns .laura { background: var(--terra); }
  .quien-btns .roommate { background: var(--green); }
  .row { display: flex; gap: 8px; margin-top: 12px; }
  .atras { border: 1px solid var(--line); background: var(--bg-soft); color: var(--ink); border-radius: 12px; padding: 0 16px; font-weight: 700; cursor: pointer; }
  .err { color: var(--terra); font-size: .9rem; margin-top: 10px; min-height: 1.3em; }
  [hidden] { display: none !important; }
</style>
</head>

const pad = (n) => String(n).padStart(2, '0');
const key = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = (k) => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addD = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const hoy0 = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };
const lunesDe = (d) => addD(new Date(d.getFullYear(), d.getMonth(), d.getDate()), -((d.getDay() + 6) % 7));
const semanasEntre = (a, b) => Math.round((b - a) / (7 * 864e5));
const dow = (d) => (d.getDay() + 6) % 7; // lunes = 0
const fmtDate = (d, anio) => `${t().days[dow(d)]} ${d.getDate()} ${t().months[d.getMonth()]}${anio ? ' ' + d.getFullYear() : ''}`;

// ── SUPABASE ──
async function api(path, { method = 'GET', body, prefer } = {}) {
  const h = { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}`, 'x-casa': S.codigo || '', 'Content-Type': 'application/json' };
  if (S.yo === 'laura' && S.pin) h['x-laura'] = S.pin;
  if (prefer) h.Prefer = prefer;
  const res = await fetch(`${SB_URL}/${path}`, { method, headers: h, body: body ? JSON.stringify(body) : undefined, cache: 'no-store' });
  if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
  const txt = await res.text();
  return txt ? JSON.parse(txt) : null;
}

async function cargar() {
  const lunesK = key(lunesDe(new Date()));
  const [cfg, tareas, semana, registro, insumos] = await Promise.all([
    api('casa_config?select=clave,valor'),
    api('casa_tareas?select=*&activa=eq.true&order=orden'),
    api(`casa_semana?select=*&lunes=eq.${lunesK}`),
    api('casa_registro?select=*&borrado_at=is.null&order=fecha.desc,created_at.desc&limit=3000'),
    api('casa_insumos?select=*&order=orden'),
  ]);
  S.cfg = { roommate: 'Adam' };
  cfg.forEach(r => S.cfg[r.clave] = r.valor);
  Object.assign(S, { tareas, semana, registro, insumos, cargado: true });
}

// ── TAREAS ──
function tareaEnSemana(ta) {
  const lunesK = key(lunesDe(new Date()));
  const s = S.semana.find(x => x.tarea_id === ta.id && x.lunes === lunesK);
  const par = ((semanasEntre(parse(LUNES_ANCLA), parse(lunesK)) % 2) + 2) % 2 === 0;
  const turno = par ? ta.quien_base : otro(ta.quien_base);
  const dia = s ? s.dia : ta.dia_def;
  return { dia, hora: s ? s.hora : ta.hora_def, modo: (s && s.quien) || 'turns', quien: (s && s.quien) || turno };
}
function hechaEstaSemana(ta) {
  const a = key(lunesDe(new Date())), b = key(addD(lunesDe(new Date()), 6));
  return S.registro.find(r => r.tipo === 'tarea' && r.tarea_id === ta.id && r.fecha >= a && r.fecha <= b);
}
function guardarSemana(ta, cambios) {
  const e = tareaEnSemana(ta);
  const body = { tarea_id: ta.id, lunes: key(lunesDe(new Date())), dia: e.dia, hora: e.hora, quien: e.modo === 'turns' ? null : e.modo, updated_at: new Date().toISOString(), updated_por: S.yo, ...cambios };
  return guardar(() => api('casa_semana?on_conflict=tarea_id,lunes', { method: 'POST', prefer: 'resolution=merge-duplicates,return=minimal', body }));
}

// ── BACS ──
function bacSchedule() {
  const ancla = parse(BAC_ANCLA), hoy = hoy0(), out = [];
  let i = Math.max(0, Math.ceil((hoy - ancla) / (7 * 864e5) - 0.01)); // primer jueves desde hoy (hoy incluido)
  for (let k = 0; k < 7; k++, i++) {
    const d = addD(ancla, i * 7);
    out.push({ date: d, types: i % 2 === 0 ? ['basura', 'compost'] : ['reciclaje'], isToday: key(d) === key(hoy) });
  }
  return out;
}

function textoEntrada(r) {
  const nomIns = () => { const i = S.insumos.find(x => x.id === r.insumo_id); return i ? (S.lang === 'fr' ? i.fr : i.es) : ''; };
  if (r.tipo === 'tarea') { const ta = S.tareas.find(x => x.id === r.tarea_id); return ta ? (S.lang === 'fr' ? ta.fr : ta.es) : (r.texto || '—'); }
  if (r.tipo === 'basura') return t().tBasura;
  if (r.tipo === 'loza') return t().tLoza;
  if (r.tipo === 'insumo_falta') return t().tFalta(nomIns());
  if (r.tipo === 'insumo_comprado') return t().tCompro(nomIns());
  return r.texto || '';
}

    <h1>${T_.titulo}</h1>
    <p class="lede">${T_.lede}</p>
    <p class="handnote">${T_.handnote}</p>
    <div class="card namebar">
      <label for="room-name">${T_.nombreRm}</label>
      <input type="text" id="room-name" autocomplete="off" maxlength="30" ${esLaura() ? '' : 'readonly'} />
      <span class="hint">${esLaura() ? T_.nombreHint : T_.nombreSoloLaura}</span>
    </div>
  </header>
  <nav class="quick">${ids.map((id, i) => `<a href="#${id}">${T_.nav[i]}</a>`).join('')}</nav>

  <section id="calendario">
    <h2><span class="n">1</span><span>${T_.s1}</span></h2>
    <p class="sub">${T_.s1sub}</p>
    <div id="task-list"></div>
    <div class="daily-note"><strong>${T_.diarioT}</strong> ${T_.diario}</div>
  </section>

  <section id="registro">
    <h2><span class="n">2</span><span>${T_.s2}</span></h2>
    <p class="sub">${T_.s2sub}</p>
    <div class="score" id="score"></div>
    <div class="balance" aria-hidden="true"><div class="b-laura" id="bar-laura" style="width:50%"></div><div class="b-room" id="bar-room" style="width:50%"></div></div>
    <div class="card regform">
      <div class="grid">
        <div><label for="f-task">${T_.queHizo}</label><select id="f-task"></select></div>
        <div><label for="f-who">${T_.quienHizo}</label><select id="f-who"></select></div>
        <div><label for="f-date">${T_.fecha}</label><input type="date" id="f-date" /></div>
        <div><label for="f-note">${T_.nota}</label><input type="text" id="f-note" placeholder="${esc(T_.notaPh)}" /></div>
      </div>
      <div class="quickrow" id="quickrow"></div>
      <button type="button" class="done-btn" data-act="f-add">${T_.anotarBtn}</button>
    </div>
    <ul class="entries" id="entries"></ul>
    <p class="empty" id="entries-empty">${T_.vacio}</p>
  </section>

  <section id="bacs">
    <h2><span class="n">3</span><span>${T_.s3}</span></h2>
    <p class="sub">${T_.s3sub}</p>
    <div class="card bac-next" id="bac-next"></div>
    <ul class="bac-list" id="bac-list"></ul>
    <div class="daily-note" style="margin-top:12px"><strong>${T_.bolsaT}</strong> ${T_.bolsa}</div>
  </section>

  <section id="como">
    <h2><span class="n">4</span><span>${T_.s4}</span></h2>
    <p class="sub">${T_.s4sub}</p>
    <div class="howto">
      <div class="card"><h3>${T_.cocina}</h3><p class="freq">${T_.cocinaFreq}</p><ol class="steps">${T_.pasosCocina.map(p => `<li>${p}</li>`).join('')}</ol></div>
      <div class="card"><h3>${T_.bano}</h3><p class="freq">${T_.banoFreq}</p><ol class="steps">${T_.pasosBano.map(p => `<li>${p}</li>`).join('')}</ol></div>
    </div>
    <div class="cats-note"><strong>${T_.gatosT}</strong> ${T_.gatos}</div>
  </section>

  <section id="insumos">
    <h2><span class="n">5</span><span>${T_.s5}</span></h2>
    <p class="sub">${T_.s5sub}</p>
    <ul class="supplies" id="supplies"></ul>
    <p class="sub" style="margin-top:10px">${T_.ofrecimiento}</p>
  </section>

  <section id="mensaje">
    <h2><span class="n">6</span><span>${T_.s6}</span></h2>
    <p class="sub">${T_.s6sub}</p>
    <div class="card msgcard"><h3>Español</h3><pre id="msg-es"></pre><button type="button" class="copy-btn" data-act="copiar" data-v="es">${T_.copiarEs}</button></div>
    <div class="card msgcard"><h3>Français</h3><pre id="msg-fr"></pre><button type="button" class="copy-btn" data-act="copiar" data-v="fr">${T_.copiarFr}</button></div>
    <div class="review"><strong>${T_.revT}</strong> <span id="rev-txt"></span>
      <div class="fecha"><label for="rev">${T_.revFecha}</label><input type="date" id="rev" /></div></div>
  </section>

  <footer>${T_.footer}</footer>`;
  $('msg-es').textContent = MSG.es + '\n\n' + linkCasa();
  $('msg-fr').textContent = MSG.fr + '\n\n' + linkCasa();
  $('f-date').value = form.d || key(new Date());
  if (form.n) $('f-note').value = form.n;
  S._form = form;
}

function pintarNombres() {
  $('yo').innerHTML = `${t().soy} <b>${esc(N(S.yo))}</b> · ${t().cambiar}`;
  const rn = $('room-name'); if (document.activeElement !== rn) rn.value = N('roommate');
  $('quickrow').innerHTML = `<button type="button" data-act="basura" data-q="laura">${esc(t().sacoBasura('Laura'))}</button>
    <button type="button" data-act="basura" data-q="roommate">${esc(t().sacoBasura(N('roommate')))}</button>`;
  // selects del formulario: se rehacen sin perder lo elegido
  const ft = $('f-task'), fw = $('f-who');
  const vt = ft.value || S._form?.f || 'basura', vw = fw.value || S._form?.w || S.yo;
  ft.innerHTML = S.tareas.map(ta => `<option value="t:${ta.id}">${esc(S.lang === 'fr' ? ta.fr : ta.es)}</option>`).join('')
    + `<option value="basura">${esc(t().tBasura)}</option><option value="loza">${esc(t().tLoza)}</option>`;
  fw.innerHTML = `<option value="laura">Laura</option><option value="roommate">${esc(N('roommate'))}</option>`;
  ft.value = [...ft.options].some(o => o.value === vt) ? vt : 'basura';
  fw.value = vw;
}

function pintarTareas() {
  const T_ = t();
  const lista = S.tareas.map(ta => ({ ta, e: tareaEnSemana(ta) }))
    .sort((a, b) => ((a.e.dia || 8) - (b.e.dia || 8)) || ((a.e.hora || '99').localeCompare(b.e.hora || '99')) || (a.ta.orden - b.ta.orden));
  $('task-list').innerHTML = lista.map(({ ta, e }) => {
    const h = hechaEstaSemana(ta);
    const dia = e.dia ? T_.days[e.dia - 1] : T_.cualquierDia;
    const chips = T_.daysShort.map((ds, i) => `<button type="button" data-act="dia" data-id="${ta.id}" data-v="${i + 1}" aria-pressed="${e.dia === i + 1}">${ds}</button>`).join('');
    const quien = [['laura', 'Laura'], ['roommate', N('roommate')], ['turns', T_.turns]].map(([v, l]) =>
      `<button type="button" data-act="quien" data-id="${ta.id}" data-v="${v}" aria-pressed="${e.modo === v}">${esc(l)}</button>`).join('');
    return `<div class="card task ${h ? 'hecha' : ''}">
      <div class="task-head">
        <div class="task-ico">${ICONS[ICONO_TAREA[ta.orden] || 'spark']}</div>
        <div><p class="task-title">${esc(S.lang === 'fr' ? ta.fr : ta.es)}</p><p class="task-desc">${esc(S.lang === 'fr' ? ta.nota_fr : ta.nota_es)}</p></div>
        <div class="task-when"><span class="day">${dia}</span>${e.hora ? `<span class="time">${esc(e.hora)}</span>` : ''}<span class="turno">${e.modo === 'turns' ? T_.tocaA + ' ' : ''}${esc(N(e.quien))}</span></div>
      </div>
      <div class="task-edit">
        <p class="edit-label">${T_.changeDay}</p>
        <div class="daychips">${chips}</div>
        <div class="whochips"><span class="lbl">${T_.whoDoes}</span>${quien}</div>
        <div class="timerow"><label class="lbl" for="h-${ta.id}">${T_.hora}</label><input type="time" id="h-${ta.id}" data-hora="${ta.id}" value="${esc(e.hora || '')}">${e.hora ? `<button type="button" data-act="sinhora" data-id="${ta.id}">${T_.sinHora}</button>` : ''}</div>
      </div>
      ${h ? `<div class="done-ok">✓ ${T_.hechoPor} ${esc(N(h.quien))} · ${fmtDate(parse(h.fecha))}</div>`
          : `<button type="button" class="done-btn" data-act="hecha" data-id="${ta.id}" data-q="${e.quien}">✓ ${T_.mark}</button>`}
    </div>`;
  }).join('');
}

function pintarRegistro() {
  const T_ = t(), lun = key(lunesDe(new Date())), lun2 = key(addD(lunesDe(new Date()), -7));
  const c = { laura: [0, 0, 0], roommate: [0, 0, 0] };
  S.registro.filter(cuentaComo).forEach(r => { const x = c[r.quien]; if (!x) return; x[2]++; if (r.fecha >= lun2) x[1]++; if (r.fecha >= lun) x[0]++; });
  const tarjeta = (rol, cls) => `<div class="card ${cls}"><div class="who">${esc(N(rol))}</div><div class="num">${c[rol][2]}</div><div class="of">${T_.registradas}</div>
    <div class="sem">${T_.estaSem}: <b>${c[rol][0]}</b> · ${T_.dosSem}: <b>${c[rol][1]}</b></div></div>`;
  $('score').innerHTML = tarjeta('laura', 'laura') + tarjeta('roommate', 'room');
  const tot = c.laura[2] + c.roommate[2], pl = tot ? Math.round(c.laura[2] / tot * 100) : 50;
  $('bar-laura').style.width = pl + '%'; $('bar-room').style.width = (100 - pl) + '%';
  $('entries-empty').hidden = S.registro.length > 0;
  $('entries').innerHTML = S.registro.map(r => {
    const por = r.creado_por !== r.quien ? `<span class="por">${T_.anotadoPor} ${esc(N(r.creado_por))}</span>` : '';
    return `<li><span class="dot ${r.quien}"></span>
      <span class="what">${esc(textoEntrada(r))}${r.nota ? ` <span class="nota">— ${esc(r.nota)}</span>` : ''}</span>
      <span class="meta">${esc(N(r.quien))}<br>${fmtShort(parse(r.fecha))}${por}</span>
      ${esLaura() ? `<button type="button" class="del" data-act="borrar" data-id="${r.id}" aria-label="Borrar / Supprimer">×</button>` : ''}</li>`;
  }).join('');
}

function pintarBacs() {
  const T_ = t(), sched = bacSchedule(), next = sched[0];
  const pills = (ty) => ty.map(x => `<span class="pill ${x}">${T_.bacNames[x]}</span>`).join('');
  $('bac-next').innerHTML = `<p class="when">${T_.nextBac}: ${fmtDate(next.date, true)}${next.isToday ? ` <span class="today-tag">${T_.today}</span>` : ''}</p>
    <p class="what">${next.isToday ? T_.takeOutToday : T_.takeOut}</p><div class="pills">${pills(next.types)}</div>`;
  $('bac-list').innerHTML = sched.slice(0, 6).map(s => {
    const wed = addD(s.date, -1);
    return `<li><span class="d">${fmtDate(s.date)}</span>${pills(s.types)}${s.isToday ? `<span class="today-tag">${T_.today}</span>` : ''}
      <span class="out">${T_.days[dow(wed)]} ${fmtShort(wed)}, 19:00 →</span></li>`;
  }).join('');
}

function pintarInsumos() {
  const T_ = t();
  $('supplies').innerHTML = S.insumos.map(ins => {
    const nom = S.lang === 'fr' ? ins.fr : ins.es;
    const compra = S.registro.find(r => r.tipo === 'insumo_comprado' && r.insumo_id === ins.id);
    const marca = S.registro.find(r => r.tipo === 'insumo_falta' && r.insumo_id === ins.id);
    let estado = `<button type="button" data-act="falta" data-id="${ins.id}" class="${ins.falta ? 'on' : ''}">${ins.falta ? T_.falta + ' ⚠' : T_.hay}</button>`;
    if (ins.falta) estado += [['laura', 'Laura'], ['roommate', N('roommate')]].map(([v, l]) =>
      `<button type="button" data-act="comprado" data-id="${ins.id}" data-q="${v}">✓ ${esc(l)}</button>`).join('');
    const nota = ins.falta
      ? (marca ? `<span class="falta-por">${T_.faltaPor}: ${esc(N(marca.quien))} · ${fmtShort(parse(marca.fecha))} — ${T_.quienCompro}</span>` : '')
      : (compra ? `<span class="bought">${T_.boughtBy}: ${esc(N(compra.quien))} · ${fmtShort(parse(compra.fecha))}</span>` : '');
    return `<li><span class="item">${esc(nom)}</span><span class="state">${estado}</span>${nota}</li>`;
  }).join('');
}

function pintarRevision() {
  const rev = S.cfg.revision ? parse(S.cfg.revision) : addD(lunesDe(new Date()), 10);
  $('rev-txt').textContent = t().rev(fmtDate(rev).replace(/^\S+/, m => m.toLowerCase()));
  if (document.activeElement !== $('rev')) $('rev').value = key(rev);
}

function linkCasa() { return `${location.origin}${location.pathname}#${S.codigo}`; }

let toastT;
function toast(msg) { const el = $('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2400); }

// ══════════════════════════════════════════════════════════════
// ACCIONES
// ══════════════════════════════════════════════════════════════
document.addEventListener('click', async (ev) => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, v = el.dataset.v, id = el.dataset.id;
  const err = (m) => { const e = $('e-err'); if (e) e.textContent = m; };
  const ta = id ? S.tareas.find(x => x.id === id) : null;

  if (a === 'lang') { S.lang = v; lsSet('casa_lang', v); if ($('calendario')) esqueleto(); pintar(); return; }

  // entrada
  if (a === 'e-cod') {
    const c = $('e-cod').value.trim().toUpperCase(); if (!c) return;
    try { if (await probarCodigo(c)) { lsSet('casa_codigo', c); pintar(); } else err(t().codigoMal); } catch (e) { err(t().sinRed); }
    return;
  }
  if (a === 'e-yo') { if (v === 'laura' && !S.pin) { S.paso = 'pin'; pintar(); } else entrarComo(v); return; }
  if (a === 'e-atras') { S.paso = null; pintar(); return; }
  if (a === 'e-pin') {
    const p = $('e-pin').value.trim(); if (!p) return;
    S.yo = 'laura'; S.pin = p;
    try {
      if (await api('rpc/casa_es_laura', { method: 'POST', body: {} }) === true) { lsSet('casa_pin', p); S.paso = null; entrarComo('laura'); }
      else { S.yo = null; S.pin = null; err(t().pinMal); }
    } catch (e) { S.yo = null; S.pin = null; err(t().sinRed); }
    return;
  }
  if (a === 'salir') { S.yo = null; lsSet('casa_yo', null); pintar(); return; }

  // calendario
  if (a === 'dia') { await guardarSemana(ta, { dia: Number(v) }); return; }
  if (a === 'quien') { await guardarSemana(ta, { quien: v === 'turns' ? null : v }); return; }
  if (a === 'sinhora') { await guardarSemana(ta, { hora: null }); return; }
  if (a === 'hecha') { el.disabled = true; await guardar(() => anotar({ tipo: 'tarea', tarea_id: id, quien: el.dataset.q }), t().anotado); return; }

  // registro
  if (a === 'basura') { el.disabled = true; await guardar(() => anotar({ tipo: 'basura', quien: el.dataset.q }), t().anotado); el.disabled = false; return; }
  if (a === 'f-add') {
    const f = $('f-task').value, fecha = $('f-date').value || key(new Date()), nota = $('f-note').value.trim() || null;
    const row = f.startsWith('t:') ? { tipo: 'tarea', tarea_id: f.slice(2) } : { tipo: f };
    el.disabled = true;
    if (await guardar(() => anotar({ ...row, quien: $('f-who').value, fecha, nota }), t().anotado)) { $('f-note').value = ''; $('f-date').value = key(new Date()); }
    el.disabled = false; return;
  }
  if (a === 'borrar') {
    if (!confirm(t().borrarSeguro)) return;
    // se marca como borrada: la fila queda en la base
    await guardar(() => api(`casa_registro?id=eq.${id}`, { method: 'PATCH', body: { borrado_at: new Date().toISOString() }, prefer: 'return=minimal' }));
    return;
  }

  // insumos
  if (a === 'falta') {
    const ins = S.insumos.find(x => x.id === id), falta = !ins.falta;
    await guardar(async () => {
      await api(`casa_insumos?id=eq.${id}`, { method: 'PATCH', body: { falta, updated_at: new Date().toISOString(), updated_por: S.yo }, prefer: 'return=minimal' });
      if (falta) await anotar({ tipo: 'insumo_falta', insumo_id: id, quien: S.yo });
    }, falta ? t().toastSupplyNeed : null);
    return;
  }
  if (a === 'comprado') {
    await guardar(async () => {
      await api(`casa_insumos?id=eq.${id}`, { method: 'PATCH', body: { falta: false, updated_at: new Date().toISOString(), updated_por: S.yo }, prefer: 'return=minimal' });
      await anotar({ tipo: 'insumo_comprado', insumo_id: id, quien: el.dataset.q });
    }, t().toastSupplyOk);
    return;
  }

  // mensaje
  if (a === 'copiar') {
    try { await navigator.clipboard.writeText($('msg-' + v).textContent); toast(t().copied); } catch (e) { toast(t().copyFail); }
    return;
  }
});

document.addEventListener('change', async (ev) => {
  const el = ev.target;
  if (el.dataset.hora) { const ta = S.tareas.find(x => x.id === el.dataset.hora); el.blur(); await guardarSemana(ta, { hora: el.value || null }); return; }
  if (el.id === 'room-name' && esLaura()) {
    const n = el.value.trim(); el.blur(); if (!n || n === N('roommate')) { el.value = N('roommate'); return; }
    await guardar(() => api('casa_config?clave=eq.roommate', { method: 'PATCH', body: { valor: n, updated_at: new Date().toISOString(), updated_por: S.yo }, prefer: 'return=minimal' }), t().guardado);
    return;
  }
  if (el.id === 'rev' && el.value) {
    const val = el.value; el.blur();
    await guardar(() => api('casa_config?on_conflict=clave', { method: 'POST', prefer: 'resolution=merge-duplicates,return=minimal', body: { clave: 'revision', valor: val, updated_at: new Date().toISOString(), updated_por: S.yo } }), t().guardado);
  }
});
document.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' && ev.target.id === 'room-name') ev.target.blur(); });

async function probarCodigo(c) {
  const prev = S.codigo; S.codigo = c;
  try { const r = await api('casa_config?select=clave,valor'); if (!r.length) { S.codigo = prev; return false; } r.forEach(x => S.cfg[x.clave] = x.valor); return true; }
  catch (e) { S.codigo = prev; throw e; }
}

async function entrarComo(rol) {
  S.yo = rol; lsSet('casa_yo', rol);
  if (!lsGet('casa_lang')) { S.lang = rol === 'roommate' ? 'fr' : 'es'; lsSet('casa_lang', S.lang); }
  try { await cargar(); } catch (e) { toast(t().sinRed); }
  $('raiz').innerHTML = ''; pintar();
}

async function refrescar() {
  if (!S.codigo || !S.yo) return;
  const a = document.activeElement;
  if (a && /INPUT|SELECT|TEXTAREA/.test(a.tagName)) return; // no pisar lo que se está escribiendo
  try { await cargar(); pintar(); } catch (e) { console.warn(e); }
}

// ── ARRANQUE ──
(async function () {
  // el enlace de WhatsApp trae el código: …/casa.html#CODIGO
  const h = decodeURIComponent(location.hash.slice(1)).trim().toUpperCase();
  if (h && /^[A-Z0-9]{4,12}$/.test(h) && h !== S.codigo) { try { if (await probarCodigo(h)) lsSet('casa_codigo', h); } catch (e) {} }
  // si el PIN guardado ya no sirve (se cambió), se vuelve a pedir
  if (S.yo === 'laura') {
    try { if (await api('rpc/casa_es_laura', { method: 'POST', body: {} }) !== true) { S.yo = null; S.pin = null; lsSet('casa_yo', null); lsSet('casa_pin', null); } } catch (e) {}
  }
  if (S.codigo && S.yo) { try { await cargar(); } catch (e) { toast(t().sinRed); } }
  else if (S.codigo) { try { await probarCodigo(S.codigo); } catch (e) {} }
  pintar();
  setInterval(() => { if (!document.hidden) refrescar(); }, REFRESCO_MS);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refrescar(); });
})();
})();
</script>
</body>
</html>
