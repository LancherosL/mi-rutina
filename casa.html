<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nuestra casa">

<title>Nuestra casa</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500;600&display=swap');

:root {
  --bg: #F2EDE4;
  --card: #FAFAF7;
  --ink: #1A1612;
  --muted: #8C7E6E;
  --terra: #B85C35;
  --terra-soft: rgba(184,92,53,0.10);
  --sage: #5C8A65;
  --sage-soft: rgba(92,138,101,0.12);
  --sky: #4A7FA5;
  --sky-soft: rgba(74,127,165,0.12);
  --gold: #C49A3C;
  --gold-soft: rgba(196,154,60,0.12);
  --brown: #8A5A3B;
  --line: rgba(26,22,18,0.08);
  --r: 22px;
  --r-sm: 14px;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { background: var(--bg); }
body {
  font-family: 'DM Sans', sans-serif;
  color: var(--ink);
  min-height: 100vh;
  font-size: 15px;
  line-height: 1.4;
  padding-bottom: calc(84px + env(safe-area-inset-bottom));
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
input, textarea { font: inherit; color: inherit; }
.serif { font-family: 'Cormorant Garamond', serif; }

/* ── HEADER ── */
.header { padding: calc(14px + env(safe-area-inset-top)) 16px 8px; display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
.header h1 { font-family:'Cormorant Garamond', serif; font-weight:600; font-size:28px; line-height:1.05; }
.header .dir { color:var(--muted); font-size:12px; margin-top:2px; }
.header-r { display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
.lang { display:flex; background:var(--card); border-radius:99px; padding:3px; border:1px solid var(--line); }
.lang button { padding:4px 10px; border-radius:99px; font-size:12px; font-weight:600; color:var(--muted); }
.lang button.on { background:var(--ink); color:var(--bg); }
.yo { font-size:12px; color:var(--muted); padding:2px 4px; }
.yo b { color:var(--ink); font-weight:600; }

main { padding: 4px 16px 16px; max-width: 560px; margin: 0 auto; }
.card { background:var(--card); border-radius:var(--r); padding:16px; margin-bottom:12px; border:1px solid var(--line); }
.card h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:600; margin-bottom:10px; }
.muted { color:var(--muted); }
.small { font-size:13px; }
.tiny { font-size:12px; }
.nota-fija { background:var(--gold-soft); border-radius:var(--r-sm); padding:12px 14px; font-size:13.5px; margin-bottom:12px; }
.propuesta { font-size:13px; color:var(--muted); margin: 2px 2px 12px; }

/* ── PILLS ── */
.pill { display:inline-block; font-size:12px; font-weight:600; padding:3px 9px; border-radius:99px; white-space:nowrap; }
.p-laura { background:var(--terra-soft); color:var(--terra); }
.p-roommate { background:var(--sky-soft); color:var(--sky); }

/* ── SEMANA ── */
.weeknav { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.weeknav button { width:38px; height:38px; border-radius:50%; background:var(--card); border:1px solid var(--line); font-size:18px; }
.weeknav .t { font-weight:600; text-align:center; }
.dia { background:var(--card); border-radius:var(--r-sm); border:1px solid var(--line); padding:10px 12px; margin-bottom:8px; }
.dia.hoy { border-color: var(--terra); box-shadow: 0 0 0 1px var(--terra) inset; }
.dia-t { font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; display:flex; justify-content:space-between; }
.dia-vacio { font-size:13px; color:var(--muted); padding-top:2px; opacity:.6; }
.tarea { display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1px solid var(--line); }
.dia-t + .tarea { border-top:0; }
.tarea .info { flex:1; min-width:0; }
.tarea .nom { font-weight:500; }
.tarea .det { font-size:12.5px; color:var(--muted); margin-top:2px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
.tarea.hecha .nom { text-decoration: line-through; text-decoration-color: rgba(26,22,18,.3); }
.btn-hecha { flex-shrink:0; min-width:44px; height:44px; border-radius:14px; background:var(--sage); color:#fff; font-weight:600; font-size:13px; padding:0 12px; }
.ok-hecha { flex-shrink:0; font-size:12px; color:var(--sage); font-weight:600; text-align:right; max-width:110px; }
.diario { font-size:13.5px; }

/* ── BOTONES ── */
.btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:11px 14px; border-radius:14px; font-weight:600; font-size:14px; background:var(--ink); color:var(--bg); }
.btn.sec { background:transparent; color:var(--ink); border:1px solid var(--line); }
.btn.verde { background:var(--sage); color:#fff; }
.btn.full { width:100%; }
.rapidos { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.rapidos .btn { font-size:13.5px; padding:12px 8px; line-height:1.2; }
.rapidos .btn.l { background:var(--terra); }
.rapidos .btn.r { background:var(--sky); }
.seg { display:flex; gap:6px; flex-wrap:wrap; }
.seg button { padding:8px 12px; border-radius:99px; border:1px solid var(--line); background:var(--card); font-size:13.5px; font-weight:500; }
.seg button.on { background:var(--ink); color:var(--bg); border-color:var(--ink); }
.seg.dias button { min-width:40px; padding:8px 0; flex:1; }
.field { width:100%; border:1px solid var(--line); background:#fff; border-radius:12px; padding:11px 12px; font-size:15px; }
textarea.field { resize:vertical; min-height:44px; }
label.l { display:block; font-size:12px; color:var(--muted); font-weight:600; margin:12px 0 6px; }
.row { display:flex; gap:8px; align-items:center; }

/* ── CONTEO ── */
.conteo { display:grid; grid-template-columns: 1fr auto auto; gap:6px 14px; font-size:14px; align-items:center; }
.conteo .h { font-size:11.5px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
.conteo .n { font-weight:600; font-size:17px; text-align:center; min-width:44px; }

/* ── HISTORIAL ── */
.hist-dia { font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin:14px 2px 6px; }
.ent { background:var(--card); border:1px solid var(--line); border-radius:var(--r-sm); padding:10px 12px; margin-bottom:6px; display:flex; gap:10px; align-items:flex-start; }
.ent .hora { font-size:12.5px; color:var(--muted); width:42px; flex-shrink:0; padding-top:2px; }
.ent .cuerpo { flex:1; min-width:0; }
.ent .nota { font-size:13px; color:var(--muted); margin-top:2px; white-space:pre-wrap; }
.ent .por { font-size:11.5px; color:var(--muted); margin-top:3px; }
.ent .ed { font-size:12px; color:var(--muted); padding:4px 6px; border-radius:8px; border:1px solid var(--line); flex-shrink:0; }

/* ── BACS ── */
.bac-big { border-radius:var(--r); padding:18px; color:#fff; margin-bottom:12px; }
.bac-big .q { font-size:12px; text-transform:uppercase; letter-spacing:.06em; opacity:.85; font-weight:600; }
.bac-big .tipo { font-family:'Cormorant Garamond', serif; font-size:28px; font-weight:600; line-height:1.1; margin:4px 0 8px; }
.bac-big .cuando { font-size:14px; opacity:.95; }
.b-bleu { background: #3D6E9A; }
.b-vert { background: linear-gradient(135deg, #4F7D57 0%, #4F7D57 55%, #8A5A3B 100%); }
.bac-li { display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px solid var(--line); font-size:14px; }
.bac-li:first-of-type { border-top:0; }
.dot { width:12px; height:12px; border-radius:50%; flex-shrink:0; }
.d-bleu { background:#3D6E9A; }
.d-vert { background:#4F7D57; }
.d-brun { background:#8A5A3B; }

/* ── LISTAS ── */
ul.pasos { list-style:none; }
ul.pasos li { padding:8px 0 8px 22px; border-top:1px solid var(--line); position:relative; font-size:14.5px; }
ul.pasos li:first-child { border-top:0; }
ul.pasos li::before { content:''; position:absolute; left:4px; top:15px; width:7px; height:7px; border-radius:50%; background:var(--sage); }

/* ── INSUMOS ── */
.ins { display:flex; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--line); }
.ins:first-of-type { border-top:0; }
.ins .info { flex:1; min-width:0; }
.ins .est { font-size:12.5px; color:var(--muted); margin-top:2px; }
.ins.falta .nom { color:var(--terra); font-weight:600; }
.ins .bt { padding:9px 11px; border-radius:12px; font-size:13px; font-weight:600; border:1px solid var(--line); }
.ins .bt.falta { color:var(--terra); }
.ins .bt.comprado { background:var(--sage); color:#fff; border-color:var(--sage); }

/* ── MENSAJE ── */
.msg { background:#fff; border:1px solid var(--line); border-radius:var(--r-sm); padding:12px; font-size:14.5px; white-space:pre-wrap; margin-bottom:8px; }

/* ── TABBAR ── */
.tabbar { position:fixed; bottom:0; left:0; right:0; background:rgba(250,250,247,.96); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top:1px solid var(--line); display:flex; padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); z-index:20; }
.tabbar button { flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 0; font-size:10.5px; color:var(--muted); font-weight:500; border-radius:12px; min-width:0; }
.tabbar button .i { font-size:19px; line-height:1; }
.tabbar button.on { color:var(--ink); font-weight:600; background:var(--bg); }

/* ── SHEET ── */
.velo { position:fixed; inset:0; background:rgba(26,22,18,.35); z-index:30; display:none; }
.velo.on { display:block; }
.sheet { position:fixed; left:0; right:0; bottom:0; background:var(--card); border-radius:24px 24px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom)); z-index:31; transform:translateY(105%); transition:transform .22s ease; max-height:88vh; overflow:auto; max-width:560px; margin:0 auto; }
.sheet.on { transform:none; }
.sheet h3 { font-size:18px; font-weight:600; margin-bottom:2px; }

/* ── ENTRADA ── */
.entrada { max-width:420px; margin: 0 auto; padding: calc(40px + env(safe-area-inset-top)) 20px 40px; }
.entrada h1 { font-family:'Cormorant Garamond', serif; font-size:38px; font-weight:600; line-height:1; }
.entrada .sub { color:var(--muted); margin:8px 0 26px; }
.quien-btns { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.quien-btns button { padding:18px 10px; border-radius:var(--r); font-size:17px; font-weight:600; color:#fff; }
.quien-btns .l { background:var(--terra); }
.quien-btns .r { background:var(--sky); }
.err { color:var(--terra); font-size:13px; margin-top:8px; min-height:18px; }

.toast { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(92px + env(safe-area-inset-bottom)); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:99px; font-size:13.5px; z-index:40; opacity:0; transition:opacity .2s; pointer-events:none; max-width:90vw; text-align:center; }
.toast.on { opacity:1; }
.oculto { display:none !important; }
</style>
</head>

// ── FECHAS (hora local) ──
const pad = (n) => String(n).padStart(2,'0');
const key = (d) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = (k) => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const addD = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const lunesDe = (d) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); const w = (x.getDay()+6)%7; return addD(x, -w); };
const semanasEntre = (a, b) => Math.round((b - a) / (7*864e5));
const loc = () => S.lang === 'fr' ? 'fr-CA' : 'es-CO';
const fCorta = (d) => d.toLocaleDateString(loc(), { day:'numeric', month:'short' });
const fDia = (d) => d.toLocaleDateString(loc(), { weekday:'short', day:'numeric', month:'short' });
const fLarga = (d) => d.toLocaleDateString(loc(), { weekday:'long', day:'numeric', month:'long' });
const fHora = (d) => d.toLocaleTimeString(loc(), { hour:'2-digit', minute:'2-digit', hour12:false });

// ── SUPABASE ──
async function api(path, { method='GET', body, prefer } = {}) {
  const h = { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}`, 'x-casa': S.codigo || '', 'Content-Type': 'application/json' };
  if (S.yo === 'laura' && S.pin) h['x-laura'] = S.pin;
  if (prefer) h.Prefer = prefer;
  const res = await fetch(`${SB_URL}/${path}`, { method, headers: h, body: body ? JSON.stringify(body) : undefined, cache: 'no-store' });
  if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
  const txt = await res.text();
  return txt ? JSON.parse(txt) : null;
}

async function cargar() {
  const desde = key(addD(S.lunesVista, -7));
  const [cfg, tareas, semana, registro, insumos] = await Promise.all([
    api('casa_config?select=clave,valor'),
    api('casa_tareas?select=*&activa=eq.true&order=orden'),
    api(`casa_semana?select=*&lunes=gte.${desde}`),
    api('casa_registro?select=*&borrado_at=is.null&order=created_at.desc&limit=2000'),
    api('casa_insumos?select=*&order=orden'),
  ]);
  S.cfg = { roommate: 'Adam' };
  cfg.forEach(r => S.cfg[r.clave] = r.valor);
  S.tareas = tareas; S.semana = semana; S.registro = registro; S.insumos = insumos;
  S.cargado = true;
}

async function refrescar() {
  if (!S.codigo || !S.yo) return;
  try { await cargar(); render(); } catch(e) { console.warn(e); }
}

async function guardar(fn) {
  try { await fn(); await cargar(); render(); return true; }
  catch(e) { console.warn(e); toast(t('noGuardo')); return false; }
}

function anotar(row) {
  return api('casa_registro', { method:'POST', body: { creado_por: S.yo, ...row }, prefer:'return=minimal' });
}

// ── LÓGICA DE TAREAS ──
function tareaEnSemana(tarea, lunesK) {
  const s = S.semana.find(x => x.tarea_id === tarea.id && x.lunes === lunesK);
  const par = ((semanasEntre(parse(LUNES_ANCLA), parse(lunesK)) % 2) + 2) % 2 === 0;
  return {
    dia: s ? s.dia : tarea.dia_def,
    hora: s && s.hora !== undefined ? s.hora : tarea.hora_def,
    quien: (s && s.quien) || (par ? tarea.quien_base : otro(tarea.quien_base)),
  };
}
// Hecha = hay una anotación de esa tarea dentro de esa semana
function hechaEn(tarea, lunesK) {
  const a = parse(lunesK), b = addD(a, 7);
  return S.registro.find(r => r.tipo === 'tarea' && r.tarea_id === tarea.id && new Date(r.created_at) >= a && new Date(r.created_at) < b);
}

// ── BACS ──
function proxJueves(desde) { let d = new Date(desde.getFullYear(), desde.getMonth(), desde.getDate()); while (d.getDay() !== 4) d = addD(d, 1); return d; }
function bacDe(jueves) {
  const ref = S.cfg.bac_ref; if (!ref) return null;
  const n = semanasEntre(parse(ref.fecha), jueves);
  return (((n % 2) + 2) % 2 === 0) ? ref.tipo : (ref.tipo === 'bleu' ? 'vert' : 'bleu');
}

// ── TEXTO DE CADA ANOTACIÓN ──
function textoEntrada(r) {
  const T_ = T[S.lang];
  if (r.tipo === 'tarea') { const ta = S.tareas.find(x => x.id === r.tarea_id); return ta ? (S.lang==='fr' ? ta.fr : ta.es) : (r.texto || '—'); }
  if (r.tipo === 'basura') return T_.eBasura;
  const ins = S.insumos.find(x => x.id === r.insumo_id); const nom = ins ? (S.lang==='fr' ? ins.fr : ins.es) : (r.texto || '');
  if (r.tipo === 'insumo_falta') return T_.eFalta(nom);
  if (r.tipo === 'insumo_comprado') return T_.eCompro(nom);
  return r.texto || '';
}
const cuentaComo = (r) => r.tipo !== 'insumo_falta';

    `<button data-act="tab" data-v="${id}" class="${S.tab===id?'on':''}"><span class="i">${ic}</span>${t('tabs')[i]}</button>`).join('');

function pillQuien(rol) { return `<span class="pill p-${rol}">${esc(N(rol))}</span>`; }

function vSemana() {
  const lunesK = key(S.lunesVista), hoyK = key(new Date());
  const esActual = lunesK === key(lunesDe(new Date()));
  const porDia = { 0: [] }; for (let i=1;i<=7;i++) porDia[i] = [];
  S.tareas.forEach(ta => { const e = tareaEnSemana(ta, lunesK); (porDia[e.dia || 0]).push({ ta, e }); });
  Object.values(porDia).forEach(l => l.sort((a,b) => (a.e.hora||'99').localeCompare(b.e.hora||'99') || a.ta.orden - b.ta.orden));

  const filaTarea = ({ ta, e }) => {
    const h = hechaEn(ta, lunesK);
    const nom = S.lang==='fr' ? ta.fr : ta.es, nota = S.lang==='fr' ? ta.nota_fr : ta.nota_es;
    let bac = '';
    if (ta.orden === 2 || ta.orden === 3) { const tipo = bacDe(addD(S.lunesVista, 3)); if (tipo) bac = tipo === 'bleu' ? '<span class="dot d-bleu"></span>bleu' : '<span class="dot d-vert"></span><span class="dot d-brun"></span>vert + brun'; }
    const der = h
      ? `<div class="ok-hecha">✓ ${esc(N(h.quien))}<br><span class="muted" style="font-weight:400">${fDia(new Date(h.created_at))}</span></div>`
      : (esActual ? `<button class="btn-hecha" data-act="hecha" data-id="${ta.id}" data-q="${e.quien}">${t('hecha')}</button>` : '');
    return `<div class="tarea ${h?'hecha':''}">
      <div class="info" data-act="mover" data-id="${ta.id}">
        <div class="nom">${esc(nom)}</div>
        <div class="det">${pillQuien(e.quien)}${e.hora ? `<span>${esc(e.hora)}</span>` : ''}${nota ? `<span>${esc(nota)}</span>` : ''}${bac ? `<span class="row" style="gap:4px">${bac}</span>` : ''}</div>
      </div>${der}</div>`;
  };

  let html = `<div class="weeknav">
    <button data-act="sem" data-v="-1">‹</button>
    <div class="t">${t('semanaDel')} ${fCorta(S.lunesVista)}${esActual ? `<div class="tiny muted">${t('estaSemana')}</div>` : `<div class="tiny"><button data-act="sem" data-v="0" class="muted" style="text-decoration:underline">${t('estaSemana')}</button></div>`}</div>
    <button data-act="sem" data-v="1">›</button></div>
    <p class="propuesta">${t('propSemana')}</p>`;
  for (let i=1;i<=7;i++) {
    const d = addD(S.lunesVista, i-1), esHoy = key(d) === hoyK;
    html += `<div class="dia ${esHoy?'hoy':''}"><div class="dia-t"><span>${t('dias')[i-1]} ${d.getDate()}</span>${esHoy?`<span style="color:var(--terra)">${t('hoy')}</span>`:''}</div>
      ${porDia[i].length ? porDia[i].map(filaTarea).join('') : `<div class="dia-vacio">${t('nada')}</div>`}</div>`;
  }
  if (porDia[0].length) html += `<div class="dia"><div class="dia-t"><span>${t('cualquierDia')}</span></div>${porDia[0].map(filaTarea).join('')}</div>`;
  html += `<div class="nota-fija diario">🍽️ ${t('diario')}</div>`;
  return html;
}

function linkCasa() { return `${location.origin}${location.pathname}#${S.codigo}`; }

function vMensaje() {
  const rev = S.cfg.revision ? parse(S.cfg.revision) : proxJueves(new Date());
  const r = N('roommate'), link = linkCasa();
  const es = T.es.msgEs(r, link, rev.toLocaleDateString('es-CO', { day:'numeric', month:'long' }));
  const fr = T.fr.msgFr(r, link, rev.toLocaleDateString('fr-CA', { day:'numeric', month:'long' }));
  S._msgs = { es, fr };
  return `<p class="propuesta">${t('msgSub')}</p>
    <div class="card"><h2>Español</h2><div class="msg">${esc(es)}</div>
      <div class="row"><button class="btn sec" data-act="copiar" data-v="es">${t('copiar')}</button><button class="btn verde" data-act="wa" data-v="es">${t('enviarWa')}</button></div></div>
    <div class="card"><h2>Français</h2><div class="msg">${esc(fr)}</div>
      <div class="row"><button class="btn sec" data-act="copiar" data-v="fr">${t('copiar')}</button><button class="btn verde" data-act="wa" data-v="fr">${t('enviarWa')}</button></div></div>
    <div class="card"><h2>${t('revision')}</h2><p style="margin-bottom:10px">${t('revTexto')}</p>
      <label class="l" for="rev">${t('fechaRev')}</label>
      <input type="date" class="field" id="rev" value="${esc(S.cfg.revision || key(rev))}" data-chg="revision"></div>
    <div class="card"><h2>${t('ajustes')}</h2>
      <label class="l" for="rm" style="margin-top:0">${t('nombreRm')}</label>
      ${esLaura()
        ? `<div class="row"><input class="field" id="rm" value="${esc(N('roommate'))}" maxlength="30"><button class="btn" data-act="rm">${t('listo')}</button></div>`
        : `<div class="field" style="background:transparent">${esc(N('roommate'))}</div><p class="tiny muted" style="margin-top:6px">${t('nombreSoloLaura')}</p>`}
    </div>`;
}

// ── ENTRADA ──
function renderEntrada() {
  document.getElementById('app').classList.add('oculto');
  const el = document.getElementById('entrada'); el.classList.remove('oculto');
  const paso = S.codigo ? (S._pidePin ? 'pin' : 'quien') : 'codigo';
  let html = `<div class="row" style="justify-content:flex-end;margin-bottom:20px"><div class="lang">
    <button data-act="lang" data-v="es" class="${S.lang==='es'?'on':''}">ES</button><button data-act="lang" data-v="fr" class="${S.lang==='fr'?'on':''}">FR</button></div></div>
    <h1>${t('titulo')}</h1><p class="sub">${t('entradaSub')}</p>`;
  if (paso === 'codigo') html += `<label class="l" for="e-cod">${t('codigo')}</label>
    <input class="field" id="e-cod" autocapitalize="characters" autocomplete="off" style="text-transform:uppercase;letter-spacing:.2em;font-weight:600">
    <button class="btn full" style="margin-top:10px" data-act="e-cod">${t('entrar')}</button>`;
  if (paso === 'quien') html += `<label class="l">${t('quienEres')}</label>
    <div class="quien-btns"><button class="l" data-act="e-yo" data-v="laura">Laura</button><button class="r" data-act="e-yo" data-v="roommate">${esc(N('roommate'))}</button></div>`;
  if (paso === 'pin') html += `<label class="l" for="e-pin">${t('pin')}</label>
    <input class="field" id="e-pin" inputmode="numeric" type="password" autocomplete="off" style="letter-spacing:.3em">
    <div class="row" style="margin-top:10px"><button class="btn sec" data-act="e-atras">‹</button><button class="btn" style="flex:1" data-act="e-pin">${t('entrar')}</button></div>`;
  html += `<div class="err" id="e-err"></div>`;
  el.innerHTML = html;
  const inp = el.querySelector('input'); if (inp) { inp.focus(); inp.addEventListener('keydown', e => { if (e.key === 'Enter') el.querySelector('.btn:not(.sec)').click(); }); }
}

async function probarCodigo(c) {
  const prev = S.codigo; S.codigo = c;
  try { const r = await api('casa_config?select=clave,valor'); if (!r.length) { S.codigo = prev; return false; } r.forEach(x => S.cfg[x.clave] = x.valor); return true; }
  catch(e) { S.codigo = prev; throw e; }
}

// ── SHEET ──
function abrirSheet(html) { const s = document.getElementById('sheet'); s.innerHTML = html; s.classList.add('on'); document.getElementById('velo').classList.add('on'); }
function cerrarSheet() { document.getElementById('sheet').classList.remove('on'); document.getElementById('velo').classList.remove('on'); S._mover = null; S._corr = null; }

function sheetMover(id) {
  const ta = S.tareas.find(x => x.id === id), lunesK = key(S.lunesVista), e = tareaEnSemana(ta, lunesK);
  S._mover = { id, lunesK, ...e };
  const m = S._mover, esActual = lunesK === key(lunesDe(new Date())), h = hechaEn(ta, lunesK);
  abrirSheet(`<h3>${esc(S.lang==='fr'?ta.fr:ta.es)}</h3><p class="tiny muted">${t('mover')} · ${t('soloSemana')}</p>
    <label class="l">${t('dia')}</label>
    <div class="seg dias">${t('diasC').map((c,i) => `<button data-act="m-dia" data-v="${i+1}" class="${m.dia===i+1?'on':''}" title="${t('dias')[i]}">${c}</button>`).join('')}</div>
    <div class="seg" style="margin-top:6px"><button data-act="m-dia" data-v="0" class="${!m.dia?'on':''}">${t('cualquierDia')}</button></div>
    <label class="l">${t('hora')}</label>
    <div class="row"><input type="time" class="field" id="m-hora" value="${esc(m.hora||'')}" style="flex:1"><button class="btn sec" data-act="m-sinhora">${t('sinHora')}</button></div>
    <label class="l">${t('quien')}</label>
    <div class="seg"><button data-act="m-q" data-v="laura" class="${m.quien==='laura'?'on':''}">Laura</button><button data-act="m-q" data-v="roommate" class="${m.quien==='roommate'?'on':''}">${esc(N('roommate'))}</button></div>
    <div class="row" style="margin-top:18px">
      ${esActual && !h ? `<button class="btn verde" style="flex:1" data-act="m-hecha">${t('marcarHecha')}</button>` : ''}
      <button class="btn" style="flex:1" data-act="m-ok">${t('listo')}</button></div>`);
}

async function guardarMover() {
  const m = S._mover; if (!m) return;
  const hora = document.getElementById('m-hora')?.value || null;
  await guardar(() => api('casa_semana?on_conflict=tarea_id,lunes', { method:'POST', prefer:'resolution=merge-duplicates,return=minimal',
    body: { tarea_id: m.id, lunes: m.lunesK, dia: m.dia || null, hora, quien: m.quien, updated_at: new Date().toISOString(), updated_por: S.yo } }));
}

function sheetCorregir(id) {
  const r = S.registro.find(x => x.id === id); if (!r) return;
  S._corr = { id, quien: r.quien };
  abrirSheet(`<h3>${t('corregir')}</h3><p class="tiny muted">${fLarga(new Date(r.created_at))} · ${fHora(new Date(r.created_at))}</p>
    ${r.tipo === 'libre' ? `<label class="l">${t('queHizo')}</label><input class="field" id="c-texto" value="${esc(r.texto)}">` : `<p style="margin-top:10px">${esc(textoEntrada(r))}</p>`}
    <label class="l">${t('quien')}</label>
    <div class="seg"><button data-act="c-q" data-v="laura" class="${r.quien==='laura'?'on':''}">Laura</button><button data-act="c-q" data-v="roommate" class="${r.quien==='roommate'?'on':''}">${esc(N('roommate'))}</button></div>
    <label class="l">${t('nota')}</label><textarea class="field" id="c-nota" rows="2">${esc(r.nota||'')}</textarea>
    <div class="row" style="margin-top:18px"><button class="btn sec" data-act="c-borrar" style="color:var(--terra)">${t('borrar')}</button><button class="btn" style="flex:1" data-act="c-ok">${t('listo')}</button></div>`);
}

// ── TOAST ──
let toastT;
function toast(msg) { const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 2200); }

// ══════════════════════════════════════════════════════════════
// ACCIONES
// ══════════════════════════════════════════════════════════════
document.addEventListener('click', async (ev) => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, v = el.dataset.v, id = el.dataset.id;
  const err = (m) => { const e = document.getElementById('e-err'); if (e) e.textContent = m; };

  if (a === 'lang') { S.lang = v; lsSet('casa_lang', v); render(); return; }
  if (a === 'cerrar') { cerrarSheet(); return; }

  // entrada
  if (a === 'e-cod') {
    const c = document.getElementById('e-cod').value.trim().toUpperCase(); if (!c) return;
    try { if (await probarCodigo(c)) { lsSet('casa_codigo', c); renderEntrada(); } else err(t('codigoMal')); } catch(e) { err(t('sinRed')); }
    return;
  }
  if (a === 'e-yo') {
    if (v === 'laura' && !S.pin) { S._pidePin = true; renderEntrada(); return; }
    entrarComo(v); return;
  }
  if (a === 'e-atras') { S._pidePin = false; renderEntrada(); return; }
  if (a === 'e-pin') {
    const p = document.getElementById('e-pin').value.trim(); if (!p) return;
    S.yo = 'laura'; S.pin = p;
    try { const ok = await api('rpc/casa_es_laura', { method:'POST', body:{} });
      if (ok === true) { lsSet('casa_pin', p); S._pidePin = false; entrarComo('laura'); }
      else { S.yo = null; S.pin = null; err(t('pinMal')); }
    } catch(e) { S.yo = null; S.pin = null; err(t('sinRed')); }
    return;
  }
  if (a === 'salir') { S.yo = null; lsSet('casa_yo', null); render(); return; }

  // navegación
  if (a === 'tab') { S.tab = v; lsSet('casa_tab', v); render(); window.scrollTo(0,0); return; }
  if (a === 'sem') { S.lunesVista = v === '0' ? lunesDe(new Date()) : addD(S.lunesVista, 7*Number(v)); render(); refrescar(); return; }

  // semana
  if (a === 'hecha') { el.disabled = true; if (await guardar(() => anotar({ tipo:'tarea', tarea_id:id, quien: el.dataset.q }))) toast('✓'); return; }
  if (a === 'mover') { sheetMover(id); return; }
  if (a === 'm-dia') { S._mover.dia = Number(v) || null; el.parentElement.parentElement.querySelectorAll('[data-act="m-dia"]').forEach(b => b.classList.toggle('on', b === el)); return; }
  if (a === 'm-q') { S._mover.quien = v; el.parentElement.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === el)); return; }
  if (a === 'm-sinhora') { document.getElementById('m-hora').value = ''; return; }
  if (a === 'm-ok') { await guardarMover(); cerrarSheet(); return; }
  if (a === 'm-hecha') { const m = S._mover; await guardarMover(); cerrarSheet(); if (await guardar(() => anotar({ tipo:'tarea', tarea_id:m.id, quien:m.quien }))) toast('✓'); return; }

  // registro
  if (a === 'basura') { el.disabled = true; if (await guardar(() => anotar({ tipo:'basura', quien: el.dataset.q }))) toast('✓'); el.disabled = false; return; }
  if (a === 'rq') { S.rq = v; el.parentElement.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === el)); return; }
  if (a === 'anotar') {
    const tx = document.getElementById('r-texto'), no = document.getElementById('r-nota');
    const texto = tx.value.trim(); if (!texto) { tx.focus(); return; }
    const nota = no.value.trim() || null; el.disabled = true;
    tx.value = ''; no.value = ''; tx.blur(); no.blur();
    if (await guardar(() => anotar({ tipo:'libre', texto, nota, quien: S.rq || S.yo }))) { S.rq = null; toast('✓'); render(); }
    else { tx.value = texto; no.value = nota || ''; }
    el.disabled = false; return;
  }
  if (a === 'corregir') { sheetCorregir(id); return; }
  if (a === 'c-q') { S._corr.quien = v; el.parentElement.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === el)); return; }
  if (a === 'c-ok') {
    const c = S._corr, body = { quien: c.quien, nota: document.getElementById('c-nota').value.trim() || null, editado_at: new Date().toISOString() };
    const ct = document.getElementById('c-texto'); if (ct) body.texto = ct.value.trim();
    cerrarSheet(); if (await guardar(() => api(`casa_registro?id=eq.${c.id}`, { method:'PATCH', body, prefer:'return=minimal' }))) toast(t('guardado'));
    return;
  }
  if (a === 'c-borrar') {
    if (!confirm(t('borrarSeguro'))) return;
    const c = S._corr; cerrarSheet();
    // se marca como borrada: la fila queda en la base
    await guardar(() => api(`casa_registro?id=eq.${c.id}`, { method:'PATCH', body:{ borrado_at: new Date().toISOString() }, prefer:'return=minimal' }));
    return;
  }

  // bacs
  if (a === 'bacref') { await guardar(() => api('casa_config?on_conflict=clave', { method:'POST', prefer:'resolution=merge-duplicates,return=minimal', body:{ clave:'bac_ref', valor:{ fecha: el.dataset.f, tipo: v }, updated_at: new Date().toISOString(), updated_por: S.yo } })); return; }
  if (a === 'bacreset') { S.cfg.bac_ref = null; document.getElementById('vista').innerHTML = vBacs(); return; }

  // insumos
  if (a === 'falta' || a === 'comprado') {
    el.disabled = true;
    await guardar(async () => {
      await api(`casa_insumos?id=eq.${id}`, { method:'PATCH', body:{ falta: a === 'falta', updated_at: new Date().toISOString(), updated_por: S.yo }, prefer:'return=minimal' });
      await anotar({ tipo: a === 'falta' ? 'insumo_falta' : 'insumo_comprado', insumo_id: id, quien: S.yo });
    });
    return;
  }

  // mensaje
  if (a === 'copiar') { try { await navigator.clipboard.writeText(S._msgs[v]); toast(t('copiado')); } catch(e) { toast('—'); } return; }
  if (a === 'wa') { window.open(`https://wa.me/?text=${encodeURIComponent(S._msgs[v])}`, '_blank'); return; }
  if (a === 'rm') {
    const n = document.getElementById('rm').value.trim(); if (!n) return;
    if (await guardar(() => api('casa_config?clave=eq.roommate', { method:'PATCH', body:{ valor:n, updated_at:new Date().toISOString(), updated_por:S.yo }, prefer:'return=minimal' }))) toast(t('guardado'));
    return;
  }
});

document.addEventListener('change', async (ev) => {
  if (ev.target.dataset.chg === 'revision' && ev.target.value) {
    const val = ev.target.value; ev.target.blur();
    if (await guardar(() => api('casa_config?on_conflict=clave', { method:'POST', prefer:'resolution=merge-duplicates,return=minimal', body:{ clave:'revision', valor: val, updated_at:new Date().toISOString(), updated_por:S.yo } }))) toast(t('guardado'));
  }
});

async function entrarComo(rol) {
  S.yo = rol; lsSet('casa_yo', rol);
  if (!lsGet('casa_lang')) { S.lang = rol === 'roommate' ? 'fr' : 'es'; lsSet('casa_lang', S.lang); }
  render();
  try { await cargar(); render(); } catch(e) { toast(t('sinRed')); }
}

// ── ARRANQUE ──
(async function () {
  S.lunesVista = lunesDe(new Date());
  // el enlace de WhatsApp trae el código: …/casa.html#CODIGO
  const h = decodeURIComponent(location.hash.slice(1)).trim().toUpperCase();
  if (h && h !== S.codigo) {
    try { if (await probarCodigo(h)) { lsSet('casa_codigo', h); } } catch(e) {}
  }
  if (S.codigo && S.yo) { render(); try { await cargar(); } catch(e) { toast(t('sinRed')); } }
  else if (S.codigo) { try { await probarCodigo(S.codigo); } catch(e) {} }
  render();
  setInterval(() => { if (!document.hidden) refrescar(); }, REFRESCO_MS);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refrescar(); });
})();
</script>
</body>
