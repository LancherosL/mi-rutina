<!DOCTYPE html>
<html lang="es">
<head>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nova">

<title>Nova</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500;600;700&display=swap');

/* Estilo Tierra · Calma · Directo. Un acento por pantalla:
   terra = hacer (botón principal) · salvia = hecho. Nada de lavanda ni azul. */
:root {
  --bg: #F6F1E7;
  --card: #FFFDF9;
  --ink: #211A13;
  --muted: #6E6052;
  --line: rgba(33,26,19,.12);
  --terra: #B85C35;
  --terra-soft: rgba(184,92,53,.12);
  --sage: #4F7A58;
  --sage-soft: rgba(79,122,88,.13);
  --r: 24px;
  --r-sm: 16px;
  --sombra: 0 1px 0 var(--line), 0 8px 24px rgba(33,26,19,.06);
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { font-family:'DM Sans',sans-serif; font-size:17px; line-height:1.5; background:var(--bg); color:var(--ink); min-height:100vh; }
button { font-family:inherit; color:inherit; border:none; background:none; cursor:pointer; }
input, select { font-family:inherit; font-size:17px; color:var(--ink); }

.wrap { max-width:520px; margin:0 auto; padding:20px 16px 60px; }

.header { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:16px; }
.titulo { font-family:'Cormorant Garamond',serif; font-size:36px; font-weight:600; line-height:1.1; }
.fecha { font-size:13px; color:var(--muted); }
.fase-chip { font-size:13px; font-weight:600; color:var(--sage); background:var(--sage-soft); padding:7px 12px; border-radius:20px; white-space:nowrap; }

.card { background:var(--card); border-radius:var(--r); padding:20px; margin-bottom:16px; box-shadow:var(--sombra); }
.label { font-size:12px; font-weight:600; letter-spacing:1.2px; text-transform:uppercase; color:var(--muted); margin-bottom:12px; }

/* Hero: lo de hoy, listo */
.hero { border-radius:var(--r); padding:24px 20px 20px; margin-bottom:16px; color:#fff; box-shadow:var(--sombra);
  background:linear-gradient(140deg, var(--terra) 0%, #98663F 55%, var(--sage) 100%); }
.hero-hola { font-family:'Cormorant Garamond',serif; font-size:36px; font-weight:600; line-height:1.1; }
.hero-txt { font-size:17px; line-height:1.45; margin-top:8px; }
.hero-chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:14px; }
.hero-chip { font-size:13px; font-weight:600; background:rgba(255,255,255,.2); padding:5px 11px; border-radius:20px; }
.hero-ayer { font-size:15px; margin-top:14px; }
.hero-btn { width:100%; min-height:56px; margin-top:16px; border-radius:var(--r-sm); background:#fff; color:var(--terra); font-size:17px; font-weight:600; padding:0 12px; }

/* ReX */
.rex { display:flex; gap:14px; align-items:flex-start; }
.rex-avatar { flex:0 0 44px; height:44px; border-radius:50%; background:var(--terra); color:#fff;
  display:flex; align-items:center; justify-content:center; font-family:'Cormorant Garamond',serif; font-weight:600; font-size:23px; }
.rex-texto { font-family:'Cormorant Garamond',serif; font-size:22px; line-height:1.3; padding-top:5px; }
.rex-datos { margin-top:12px; display:flex; flex-wrap:wrap; gap:8px; }
.dato { font-size:14px; color:var(--ink); background:var(--bg); padding:6px 12px; border-radius:20px; }
button.dato { border:1.5px solid var(--line); }

/* Escalas 0-10: dos filas (0-5, 6-10), botones grandes */
.escala { display:grid; grid-template-columns:repeat(6,1fr); gap:15px 8px; }
.escala button { height:52px; border-radius:14px; background:var(--bg); font-size:17px; font-weight:600; font-variant-numeric:tabular-nums; }
.escala button.sel { background:var(--terra); color:#fff; }
.pie-fila { margin-top:14px; }
.pie-fila:first-of-type { margin-top:4px; }
.pie-sub { font-size:13px; color:var(--muted); margin-bottom:8px; }
.pie-pills { display:flex; flex-wrap:wrap; gap:8px; }
.pie-pill { font-size:15px; padding:9px 14px; border-radius:20px; background:var(--bg); }
.pie-pill.sel { background:var(--sage); color:#fff; }
.pie-nota { width:100%; margin-top:14px; font-size:16px; padding:11px 14px; border-radius:14px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font-family:inherit; }
.escala-ext { display:flex; justify-content:space-between; font-size:13px; color:var(--muted); margin-top:10px; }
.link { font-size:15px; color:var(--muted); text-decoration:underline; text-underline-offset:3px; padding:10px 0; }

/* Sesión */
.sesion-head { display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:6px; }
.sesion-nombre { font-family:'Cormorant Garamond',serif; font-size:28px; font-weight:600; line-height:1.15; }
.sesion-min { font-size:15px; color:var(--muted); white-space:nowrap; font-variant-numeric:tabular-nums; }
.progreso { margin:6px 0 4px; }
.progreso-barra { height:6px; border-radius:6px; background:var(--terra-soft); overflow:hidden; }
.progreso-barra span { display:block; height:100%; background:var(--terra); border-radius:6px; }
.progreso-txt { font-size:13px; color:var(--muted); margin-top:6px; font-variant-numeric:tabular-nums; }
.pregunta { font-size:15px; margin-top:10px; padding:12px 14px; border-radius:var(--r-sm); background:var(--bg); }
.pregunta-bot { display:flex; gap:8px; margin-top:8px; }
.pregunta-bot button { min-height:44px; padding:0 16px; border-radius:22px; border:1.5px solid var(--line); background:var(--card); font-size:15px; font-weight:600; }
.ej-lista { list-style:none; }
.ej { display:flex; align-items:flex-start; gap:6px; padding:12px 0; border-top:1px solid var(--line); }
.ej:first-child { border-top:none; }
.ej-cuerpo { flex:1; min-width:0; padding-top:2px; }
.ej-fila { display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
.ej-nombre { font-size:17px; font-weight:600; line-height:1.3; }
.ej-dosis { color:var(--terra); font-size:15px; font-weight:600; text-align:right; }
.ej-desc { font-size:14px; color:var(--muted); line-height:1.45; margin-top:2px; }
.ej.ok .ej-nombre, .ej-run.ok .ej-run-nombre { color:var(--muted); text-decoration:line-through; text-decoration-color:rgba(110,96,82,.5); }
/* Check: círculo de 32 px dentro de un área tocable de 48 px */
.check { flex:0 0 48px; height:48px; margin:-8px 0 -8px -8px; display:flex; align-items:center; justify-content:center; }
.check span { width:32px; height:32px; border-radius:50%; border:2px solid var(--line); background:var(--card);
  display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:700; color:transparent; }
.ok > .check span { background:var(--sage); border-color:var(--sage); color:#fff; }

.botones { display:flex; gap:10px; margin-top:16px; }
.btn { flex:1; min-height:56px; border-radius:var(--r-sm); font-size:17px; font-weight:600; padding:0 12px;
  display:flex; align-items:center; justify-content:center; text-decoration:none; }
.btn-1 { background:var(--terra); color:#fff; }
.btn-2 { background:var(--card); color:var(--ink); border:1.5px solid var(--ink); }
.btn-hecho { background:var(--sage); color:#fff; }
.btn:disabled { opacity:.4; }
.aviso { font-size:14px; color:var(--muted); margin-top:10px; }
.hecho-resumen { font-size:17px; line-height:1.5; }

/* Vista sesión en curso */
.ej-run { display:flex; gap:6px; padding:14px 0; border-top:1px solid var(--line); }
.ej-run:first-child { border-top:none; }
.ej-run-nombre { font-weight:600; font-size:17px; }
.ej-run-dosis { font-size:15px; color:var(--terra); font-weight:600; margin-left:6px; }
.ej-run-desc { font-size:15px; line-height:1.5; margin-top:3px; }
.ej-run-ojo { font-size:14px; color:var(--terra); margin-top:4px; }

.senti { display:flex; gap:10px; }
.senti button { flex:1; height:56px; border-radius:var(--r-sm); background:var(--bg); font-size:26px; }
.senti button.sel { background:var(--sage-soft); outline:2px solid var(--sage); }
.nota-input { width:100%; border:1.5px solid var(--line); background:var(--bg); border-radius:var(--r-sm); padding:14px; margin-top:16px; }
.sub { font-size:15px; color:var(--muted); margin:18px 0 10px; }

/* Recuperación */
.tl { list-style:none; position:relative; padding-left:24px; }
.tl::before { content:''; position:absolute; left:6px; top:10px; bottom:10px; width:2px; background:var(--line); }
.tl li { position:relative; padding:6px 0 12px; }
.tl li::before { content:''; position:absolute; left:-24px; top:11px; width:14px; height:14px; border-radius:50%; background:var(--ink); box-sizing:border-box; }
.tl li.previsto::before { background:var(--card); border:2px solid var(--muted); }
.tl li.fase::before { background:var(--sage); }
.tl li.mas::before { background:var(--card); border:2px solid var(--line); }
.tl-fecha { font-size:12px; font-weight:600; color:var(--muted); }
.tl-desc { font-size:15px; }
.tl li.previsto .tl-desc { color:var(--muted); }
.tl-pend { font-size:15px; color:var(--muted); text-align:left; padding:2px 0; }
.tl-accion { font-size:13px; font-weight:600; color:var(--terra); margin-left:8px; }
.hito-form { display:none; margin-top:12px; }
.hito-form.abierto { display:block; }
.hito-form input, .hito-form select { width:100%; border:1.5px solid var(--line); background:var(--bg); border-radius:var(--r-sm); padding:13px; margin-bottom:10px; }
.fila { display:flex; gap:8px; }

/* Tai Chi en silla: un video al día. Imagen = frame limpio del video, nunca la miniatura publicitaria */
.tc { margin-top:18px; border-radius:var(--r-sm); background:var(--bg); overflow:hidden; }
/* El frame de YouTube viene 4:3 con franjas negras; 112% las saca del cuadro. */
.tc-img { position:relative; display:block; aspect-ratio:16/10; background-size:112% auto, cover; background-position:center; background-repeat:no-repeat; }
.tc-hoy { position:absolute; left:12px; top:12px; font-size:12px; font-weight:700; letter-spacing:1.2px; color:#fff;
  background:rgba(33,26,19,.72); padding:5px 10px; border-radius:20px; }
.tc-play { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:64px; height:64px; border-radius:50%;
  background:rgba(184,92,53,.9); color:#fff; font-size:24px; display:flex; align-items:center; justify-content:center; padding-left:5px; }
.tc-min { position:absolute; right:12px; bottom:12px; font-size:12px; font-weight:600; color:#fff; background:rgba(33,26,19,.72);
  padding:4px 8px; border-radius:8px; }
.tc-info { padding:16px; }
.tc-titulo { font-family:'Cormorant Garamond',serif; font-size:24px; font-weight:600; line-height:1.2; }
.tc-sub { display:inline-block; font-size:14px; font-weight:600; color:var(--sage); background:var(--sage-soft); padding:5px 11px; border-radius:20px; margin-top:8px; }
.tc-clase { font-size:14px; color:var(--muted); margin-top:8px; }
.tc .btn { width:100%; margin-top:12px; }
.tc-hecho { font-size:17px; font-weight:600; color:var(--sage); margin-top:12px; }

/* Pausa corta (Instagram): una línea, no sesión principal */
.pausa { display:flex; align-items:center; gap:12px; margin-top:12px; padding:14px 16px; border-radius:var(--r-sm); background:var(--bg); }
.pausa-txt { flex:1; color:inherit; text-decoration:none; min-width:0; }
.pausa-tit { font-size:15px; font-weight:600; }
.pausa-sub { font-size:13px; color:var(--muted); margin-top:2px; }
.pausa-btn { flex:0 0 auto; min-height:44px; padding:0 16px; border-radius:22px; background:var(--sage); color:#fff; font-size:15px; font-weight:600; }
.pausa-ok { flex:0 0 auto; font-size:15px; font-weight:600; color:var(--sage); }

.error { font-size:15px; color:var(--terra); margin-top:8px; }
.oculto { display:none !important; }
</style>

<div class="wrap">

  <div class="header">
    <div>
      <div class="titulo">Nova</div>
      <div class="fecha" id="fecha"></div>
    </div>
    <div class="fase-chip" id="fase-chip">Fase …</div>
  </div>

  <!-- ═══ PANTALLA PRINCIPAL ═══ -->
  <div id="vista-inicio">

    <!-- Hero: sólo mientras hay algo por hacer hoy -->
    <div class="hero oculto" id="hero"></div>

    <div class="card">
      <div class="rex">
        <div class="rex-avatar" aria-label="ReX">R</div>
        <div>
          <div class="rex-texto" id="rex-texto"><p>Leyendo cómo amaneciste…</p></div>
          <div class="rex-datos" id="rex-datos"></div>
        </div>
      </div>
    </div>

    <!-- Dolor del pie: sólo si no hay dato de hoy. Respondido, desaparece y queda en un chip. -->
    <div class="card oculto" id="card-dolor">
      <div class="label">¿Cómo está el pie hoy?</div>
      <div class="escala" id="escala-dolor"></div>
      <div class="escala-ext"><span>Nada</span><span>Molesta</span><span>Lo peor</span></div>
    </div>

    <!-- El resto del pie (antes en Mi Sistema): aparece después del dolor, todo saltable.
         Se cierra al responder movilidad y ánimo, o con "Listo"; queda en el chip del pie. -->
    <div class="card oculto" id="card-pie">
      <div class="label">Mi pie hoy</div>
      <div class="pie-fila"><div class="pie-sub">Movilidad</div><div class="pie-pills" id="pie-movilidad"></div></div>
      <div class="pie-fila"><div class="pie-sub">Ánimo</div><div class="pie-pills" id="pie-animo"></div></div>
      <input class="pie-nota" id="pie-nota" placeholder="Algo que quieras anotar (opcional)" onchange="setPieNota(this.value)">
      <button class="link" onclick="cerrarPie()">Listo ✓</button>
    </div>

    <div class="card" id="card-sesion">
      <div class="label" id="sesion-label">Sesión de hoy</div>
      <div id="sesion-cuerpo"></div>
    </div>

    <div class="card">
      <div class="label">Recuperación</div>
      <ul class="tl" id="timeline"></ul>
      <button class="link" id="btn-hito" onclick="abrirHito()">+ anotar un hito</button>
      <div class="hito-form" id="hito-form">
        <input id="hito-desc" placeholder="Qué pasó (ej. radiografía: consolidando bien)">
        <div class="fila">
          <input type="date" id="hito-fecha">
          <select id="hito-fase"></select>
        </div>
        <div class="botones" style="margin-top:4px">
          <button class="btn btn-2" onclick="cerrarHito()">Cancelar</button>
          <button class="btn btn-1" onclick="guardarHito()">Guardar</button>
        </div>
      </div>
    </div>

    <div class="error oculto" id="error"></div>
  </div>

  <!-- ═══ SESIÓN EN CURSO ═══ -->
  <div id="vista-sesion" class="oculto">
    <div class="card">
      <div class="sesion-head">
        <div class="sesion-nombre" id="run-titulo">Sesión</div>
        <button class="link" onclick="salirSesion()">salir</button>
      </div>
      <div class="aviso" id="run-aviso" style="margin:0 0 6px">Si algo le pide al pie, se para ahí.</div>
      <div id="run-lista"></div>
      <div class="botones">
        <button class="btn btn-1" onclick="terminarSesion()">Terminé</button>
      </div>
    </div>
  </div>

  <!-- ═══ CIERRE ═══ -->
  <div id="vista-cierre" class="oculto">
    <div class="card">
      <div class="label">¿Cómo te sentiste?</div>
      <div class="senti" id="senti">
        <button data-v="bien" onclick="setSenti(this)">👍</button>
        <button data-v="regular" onclick="setSenti(this)">😐</button>
        <button data-v="mal" onclick="setSenti(this)">👎</button>
      </div>
      <div class="sub">Pie ahora (0 = nada, 10 = lo peor)</div>
      <div class="escala" id="escala-dolor-cierre"></div>
      <div class="sub">Fatiga ahora (0 = fresca, 10 = agotada)</div>
      <div class="escala" id="escala-fatiga"></div>
      <input class="nota-input" id="cierre-nota" placeholder="Algo que quieras anotar (opcional)">
      <div class="botones">
        <button class="btn btn-1" id="btn-guardar-cierre" onclick="guardarCierre()">Guardar</button>
      </div>
      <button class="link oculto" id="btn-saltar-cierre" onclick="saltarCierre()">saltar</button>
    </div>
  </div>

</div>

  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
const hoy = fechaLocal(new Date());
const ayer = fechaLocal(new Date(Date.now() - 864e5));
const PREVIA = hoy < INICIO;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function sb(tabla, method='GET', body=null, params='') {
  const headers = {'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`,'Content-Type':'application/json'};
  if (method !== 'GET') headers['Prefer'] = 'return=representation'+(params.includes('on_conflict')?',resolution=merge-duplicates':'');
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${tabla}${params}`, {method, headers, body: body?JSON.stringify(body):null});
  if (!res.ok) throw new Error(tabla+' HTTP '+res.status);
  const txt = await res.text();
  return txt ? JSON.parse(txt) : null;
}

function mostrarError(msg) { const e=$('error'); e.textContent=msg; e.classList.remove('oculto'); }

function fechaBonita(f) {
  if (!f) return '';
  const [y,m,d] = f.split('-').map(Number);
  return new Date(y,m-1,d).toLocaleDateString('es', {day:'numeric', month:'short'});
}

// Minutos estimados a partir de la dosis: "2 min", "2 × 12" (≈4 s/rep + 30 s pausa), "5 × 10 s" (+10 s pausa),
// "5 × 15 s · descanso 1 min" (el descanso indicado reemplaza la pausa de 10 s).
function minutosDe(dosis) {
  if (!dosis) return 0;
  let m;
  if ((m = dosis.match(/^(\d+(?:\.\d+)?)\s*min/))) return +m[1];
  if ((m = dosis.match(/^(\d+)\s*×\s*(\d+)\s*s/))) {
    const d = dosis.match(/descanso\s*(\d+(?:\.\d+)?)\s*min/);
    return +m[1] * (+m[2] + (d ? +d[1] * 60 : 10)) / 60;
  }
  if ((m = dosis.match(/^(\d+)\s*×\s*(\d+)/))) return (+m[1] * (+m[2] * 4 + 30)) / 60;
  return 0;
}

let reg = null;          // registro_diario de hoy (Mi Sistema)
let sesionHoy = null;    // nova_sesiones de hoy
let sesionAyer = null;
let catalogo = [];       // ejercicios de la fase actual
let hitos = [];
let fase = '1A';
let plan = [];           // ejercicios de la versión de hoy
let version = 'completa';
let hechos = new Set();  // nombres marcados en la sesión en curso
let inicioSesion = null;
let sentiSel = null, fatigaSel = null, dolorCierre = null;
let verPendientes = false; // hitos pendientes desplegados
let verAnteriores = false; // hitos pasados (menos el último) desplegados
let cierreModo = 'sesion'; // 'sesion' | 'video'
let taichiUltimo = null;   // último Tai Chi marcado: {ejercicio, created_at}
let pausasHoy = [];        // pausas marcadas hoy (nombres)

// ═══ CARGA ═══
async function init() {
  $('fecha').textContent = new Date().toLocaleDateString('es', {weekday:'long', day:'numeric', month:'long'});
  construirEscala('escala-fatiga', v => { fatigaSel = v; pintarEscala('escala-fatiga', v); });
  construirEscala('escala-dolor', setDolor);
  construirEscala('escala-dolor-cierre', v => { dolorCierre = dolorCierre === v ? null : v; pintarEscala('escala-dolor-cierre', dolorCierre); });
  $('hito-fase').innerHTML = '<option value="">Sin cambio de fase</option>' +
    Object.entries(FASES).map(([k,v]) => `<option value="${k}">Paso a Fase ${k} · ${v}</option>`).join('');
  await cargar();
  // Al volver a la app (p. ej. desde un video), releer sin recargar la página.
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && !$('vista-inicio').classList.contains('oculto')) cargar();
  });
}

async function cargar() {
  try {
    const [r, ses, hs, tc, pz, rc] = await Promise.all([
      sb('registro_diario','GET',null,`?fecha=eq.${hoy}&select=fecha,energia,sueno_horas,sueno_calidad,emocion,emocion_fina,ciclo_fase`),
      sb('nova_sesiones','GET',null,`?fecha=in.(${ayer},${hoy})`),
      sb('nova_hitos','GET',null,'?order=fecha.asc.nullslast,created_at.asc'),
      sb('nova_ejercicios_sesion','GET',null,`?ejercicio=like.${encodeURIComponent(TAICHI_PREFIJO)}*&select=ejercicio,created_at&order=created_at.desc&limit=1`),
      sb('nova_ejercicios_sesion','GET',null,`?ejercicio=like.${encodeURIComponent(PAUSA_PREFIJO)}*&select=ejercicio,created_at&order=created_at.desc&limit=10`),
      sb('recuperacion','GET',null,`?fecha=eq.${hoy}&select=movilidad,animo,nota_libre`)
    ]);
    if (!pieTimer) { const p = rc?.[0] || {}; pie = {movilidad:p.movilidad||'', animo:p.animo||'', nota_libre:p.nota_libre||''}; }
    taichiUltimo = tc?.[0] || null;
    pausasHoy = (pz || []).filter(p => fechaLocal(new Date(p.created_at)) === hoy).map(p => p.ejercicio);
    const [dias, ejHoy] = await Promise.all([
      sb('nova_sesiones','GET',null,'?select=fecha'),
      sesionHoy?.id ? sb('nova_ejercicios_sesion','GET',null,`?sesion_id=eq.${sesionHoy.id}&select=ejercicio`) : []
    ]);
    diasUsados = (dias || []).length;
    hechos = new Set((ejHoy || []).map(e => e.ejercicio));
    reg = r?.[0] || null;
    sesionHoy = ses.find(s => s.fecha === hoy) || null;
    sesionAyer = ses.find(s => s.fecha === ayer) || null;
    hitos = hs || [];
    fase = faseActual();
    catalogo = await sb('nova_catalogo_ejercicios','GET',null,`?fase=eq.${encodeURIComponent(fase)}&order=orden.asc.nullslast`);
  } catch (e) {
    console.error(e);
    mostrarError('No pude conectar con la base. Revisa la conexión y recarga.');
  }
  pintarTodo();
}

function faseActual() {
  const cambios = hitos.filter(h => h.fase_nueva && !h.previsto && h.fecha && h.fecha <= hoy);
  return cambios.length ? cambios[cambios.length-1].fase_nueva : '1A';
}

// ═══ ReX ═══
function dolorNum() { return sesionHoy?.dolor_pie ?? null; }
function dolorNivel() {
  const n = dolorNum();
  return n === null ? null : n >= DOLOR_ALTO ? 'alto' : n >= DOLOR_MEDIO ? 'medio' : 'bajo';
}
function suenoMalo() {
  if (!reg) return false;
  return (reg.sueno_horas != null && +reg.sueno_horas < SUENO_POCO_H) ||
         (reg.sueno_calidad != null && reg.sueno_calidad <= SUENO_MALA);
}
function energiaBaja() { return reg?.energia != null && reg.energia <= ENERGIA_BAJA; }

function elegirVersion() {
  const d = dolorNivel();
  if (d === 'alto') return 'minima';
  if (d === 'medio' || suenoMalo() || energiaBaja()) return 'suave';
  return 'completa';
}

function horasTexto(h) {
  const hh = Math.floor(h), mm = Math.round((h - hh) * 60);
  return mm ? `${hh} h ${mm} min` : `${hh} h`;
}

// ReX dice UNA línea: lo que propone hoy. El contexto (sueño, ayer, ciclo) va en los chips.
function textoRex() {
  const d = dolorNivel(), n = dolorNum();
  if (sesionHoy?.estado === 'hecha') return 'La de hoy ya está. Lo que queda del día es para el cuerpo.';
  if (sesionHoy?.estado === 'descanso') return 'Hoy es descanso. Si más tarde te provoca moverte, la sesión sigue aquí.';
  if (PREVIA) return 'Mañana arrancamos. Te dejo la primera sesión lista abajo para que la mires.';
  if (d === 'alto') return `Con el pie en ${n}, hoy no hay nada que demostrar: respirar y mover cuello y hombros, o descansar.`;
  if (d === 'medio') return `El pie está en ${n}. Te propongo la versión suave.`;
  if (suenoMalo() || energiaBaja()) return 'Con ese descanso, va la versión suave. Corta y sin exigirte.';
  if (d === null) return 'Antes de proponerte algo: ¿cómo está el pie?';
  if (reg?.ciclo_fase === 'Menstrual') return 'Si el cuerpo pide menos hoy, se le da menos. La sesión está lista.';
  return `Si te provoca, la sesión de hoy está lista. Unos ${minutosPlan()} minutos.`;
}

function datosRex() {
  const out = [];
  const n = dolorNum();
  if (n !== null) out.push({t:['🦶 pie '+n+'/10', pie.movilidad, pie.animo].filter(Boolean).join(' · '), fn:'cambiarDolor()'});
  if (reg?.sueno_horas != null) {
    let s = `😴 ${horasTexto(+reg.sueno_horas)}`;
    if (reg.sueno_calidad != null && reg.sueno_calidad <= SUENO_MALA) s += ', no muy bien';
    out.push({t:s});
  }
  if (reg?.energia != null) out.push({t:`⚡ energía ${reg.energia}/5`});
  if (reg?.emocion) out.push({t:reg.emocion.split(' ')[0] + ' ' + (reg.emocion_fina || reg.emocion.replace(/^\S+\s/, '').toLowerCase())});
  if (reg?.ciclo_fase) out.push({t:`🌙 ${reg.ciclo_fase.toLowerCase()}`});
  return out;
}

// ═══ PINTAR ═══
function pintarTodo() {
  armarPlan();
  pintarHero();
  $('fase-chip').textContent = `Fase ${fase} · ${FASES[fase] || ''}`;
  $('rex-texto').innerHTML = `<p>${esc(textoRex())}</p>`;
  $('rex-datos').innerHTML = datosRex().map(d => d.fn
    ? `<button class="dato" onclick="${d.fn}">${esc(d.t)}</button>`
    : `<span class="dato">${esc(d.t)}</span>`).join('');
  // Pregunta del pie: sólo si falta y el día no está cerrado. Respondida, desaparece.
  $('card-dolor').classList.toggle('oculto', dolorNum() !== null || PREVIA || !!sesionHoy?.estado);
  pintarEscala('escala-dolor', dolorNum());
  pintarPie();
  pintarSesion();
  pintarTimeline();
}

// Hero: sólo si hay sesión por hacer hoy. Lo de ayer, dicho sin juicio (no es racha).
function textoAyer() {
  const tcAyer = !!taichiUltimo && fechaLocal(new Date(taichiUltimo.created_at)) === ayer;
  if (tcAyer) return '✓ Ayer hiciste Tai Chi.';
  if (sesionAyer?.estado === 'hecha') return '✓ Ayer hiciste la sesión.';
  if (sesionAyer?.estado === 'descanso') return 'Ayer descansaste.';
  return '';
}

function pintarHero() {
  const h = $('hero');
  const ver = !PREVIA && plan.length && !sesionHoy?.estado;
  h.classList.toggle('oculto', !ver);
  if (!ver) return;
  const min = minutosPlan();
  const chips = [`${min} min`, 'Sentada'];
  if (version !== 'completa') chips.push(VERSIONES[version]);
  if (taichiPendiente()) chips.push('1 video');
  const ayerTxt = textoAyer();
  const p0 = plan[0];
  h.innerHTML = `
    <div class="hero-hola">Hola, ${esc(NOMBRE)}.</div>
    <div class="hero-txt">Tu momento de hoy ya está listo. Son ${min} minutos, sentada.</div>
    <div class="hero-chips">${chips.map(c => `<span class="hero-chip">${esc(c)}</span>`).join('')}</div>
    ${ayerTxt ? `<div class="hero-ayer">${esc(ayerTxt)}</div>` : ''}
    <button class="hero-btn" onclick="empezarSesion()">Empezar: ${esc(p0.nombre.toLowerCase())}${p0.dosis && minutosDe(p0.dosis) ? ' · ' + esc(p0.dosis) : ''}</button>`;
}

function construirEscala(id, fn) {
  const cont = $(id);
  cont.innerHTML = Array.from({length:11}, (_,i) => `<button data-v="${i}">${i}</button>`).join('');
  cont.querySelectorAll('button').forEach(b => b.onclick = () => fn(+b.dataset.v));
}
function pintarEscala(id, v) {
  $(id).querySelectorAll('button').forEach(b => b.classList.toggle('sel', v !== null && +b.dataset.v === v));
}

function armarPlan() {
  version = elegirVersion();
  const base = catalogo.filter(e => e.orden != null);
  plan = version === 'minima' ? base.filter(e => e.minima)
       : version === 'suave'  ? base.filter(e => e.suave)
       : base;
}

function minutosPlan() { return Math.round(plan.reduce((s,e) => s + minutosDe(e.dosis), 0)); }

function pintarSesion() {
  $('sesion-label').textContent = PREVIA ? `Sesión de mañana · ${fechaBonita(INICIO)}` : 'Sesión de hoy';
  const c = $('sesion-cuerpo');

  if (!plan.length) {
    c.innerHTML = `<div class="hecho-resumen">Todavía no hay plan para la Fase ${esc(fase)}. Lo armamos cuando llegue.</div>` + tarjetaTaichi() + lineaPausa();
    return;
  }

  if (sesionHoy?.estado === 'hecha') {
    const caras = {bien:'👍', regular:'😐', mal:'👎'};
    const partes = ['Hecha'];
    if (sesionHoy.duracion_min) partes.push(`${sesionHoy.duracion_min} min`);
    if (sesionHoy.como_me_senti) partes.push(caras[sesionHoy.como_me_senti]);
    if (sesionHoy.fatiga_percibida != null) partes.push(`fatiga ${sesionHoy.fatiga_percibida}`);
    c.innerHTML = `<div class="hecho-resumen">${partes.join(' · ')}</div>` +
      (sesionHoy.nota ? `<div class="aviso">${esc(sesionHoy.nota)}</div>` : '') + tarjetaTaichi() + lineaPausa();
    return;
  }

  const min = minutosPlan();
  c.innerHTML = `
    <div class="sesion-head">
      <div class="sesion-nombre">${VERSIONES[version]}</div>
      <div class="sesion-min">≈ ${min} min</div>
    </div>
    ${bloqueProgreso()}
    <ul class="ej-lista">${plan.map((e,i) => `
      <li class="ej${hechos.has(e.nombre) ? ' ok' : ''}">
        <button class="check" onclick="toggleEj(${i})" aria-label="Hecho"><span>✓</span></button>
        <div class="ej-cuerpo">
          <div class="ej-fila"><span class="ej-nombre">${esc(e.nombre)}</span><span class="ej-dosis">${esc(e.dosis||'')}</span></div>
          ${e.descripcion ? `<div class="ej-desc">${esc(e.descripcion)}</div>` : ''}
        </div>
      </li>`).join('')}</ul>
    ${tarjetaTaichi()}
    ${lineaPausa()}
    <div class="botones">
      <button class="btn btn-2" onclick="descansar()" ${PREVIA?'disabled':''}>${sesionHoy?.estado==='descanso'?'Descansando':'Hoy descanso'}</button>
      <button class="btn ${taichiPendiente() ? 'btn-2' : 'btn-1'}" onclick="empezarSesion()">${PREVIA?'Ver cómo es':'Hacer sesión'}</button>
    </div>
    ${PREVIA ? '<div class="aviso">Vista previa: hoy nada se guarda. Mañana sí.</div>' : ''}
    ${version === 'suave' && !PREVIA ? `<button class="link" onclick="forzarVersion('completa')">prefiero la completa</button>` : ''}`;
}

// ═══ TAI CHI EN SILLA ═══
// Abrir → hacer → marcar. Nada de lista ni feed: una tarjeta, un video.
function videoDeHoy() {
  if (!TAICHI.length) return null;
  const ult = taichiUltimo ? TAICHI.findIndex(v => taichiUltimo.ejercicio === TAICHI_PREFIJO + v.clase) : -1;
  const hechoHoy = !!taichiUltimo && fechaLocal(new Date(taichiUltimo.created_at)) === hoy;
  if (hechoHoy && ult >= 0) return { v: TAICHI[ult], hecho: true };
  return { v: TAICHI[ult >= 0 ? (ult + 1) % TAICHI.length : 0], hecho: false };
}

function taichiPendiente() { const d = videoDeHoy(); return !!d && !d.hecho && !PREVIA; }

function tarjetaTaichi() {
  const d = videoDeHoy();
  if (!d || PREVIA) return '';
  const { v, hecho } = d;
  const fondo = `background-image:url('${taichiImagen(v)}'), linear-gradient(140deg, var(--sage), var(--terra))`;
  const acciones = hecho
    ? `<div class="tc-hecho">✓ Hecho hoy</div>`
    : `<a class="btn btn-1" href="${v.url}" target="_blank" rel="noopener">▶ Ver video</a>
       <button class="btn btn-hecho" onclick="hiceTaichi()">✓ Lo hice</button>`;
  return `
    <div class="tc">
      <a class="tc-img" href="${v.url}" target="_blank" rel="noopener" style="${fondo}" aria-label="Ver video">
        ${hecho ? '' : '<span class="tc-hoy">HOY TE TOCA</span>'}
        <span class="tc-play">▶</span><span class="tc-min">${v.min} min</span>
      </a>
      <div class="tc-info">
        <div class="tc-titulo">Tai Chi en silla — ${esc(TAICHI_AUTOR)}</div>
        <div class="tc-sub">Sentado · sin pie · si no puedes, imagínalo</div>
        <div class="tc-clase">${esc(v.clase)} · ${v.min} min</div>
        ${acciones}
      </div>
    </div>`;
}

// Guarda primero; lo reflexivo (cómo te sentiste, fatiga) se pregunta después y es saltable.
async function hiceTaichi() {
  const { v } = videoDeHoy();
  try {
    const s = await asegurarSesionHoy({estado:'hecha'});
    const filas = await sb('nova_ejercicios_sesion','POST', {
      sesion_id: s.id, ejercicio: TAICHI_PREFIJO + v.clase, reps: v.min + ' min'
    }, '?on_conflict=sesion_id,ejercicio');
    taichiUltimo = filas?.[0] || {ejercicio: TAICHI_PREFIJO + v.clase, created_at: new Date().toISOString()};
    abrirCierre('video');
  } catch (e) { console.error(e); mostrarError('No se guardó. Intenta otra vez.'); }
}

// ═══ PAUSA CORTA ═══
// Una al día: rota por fecha entre las de día; desde HORA_NOCHE, la de noche.
function pausaDeHoy() {
  const noche = new Date().getHours() >= HORA_NOCHE;
  const opciones = PAUSAS.filter(p => !!p.noche === noche);
  if (!opciones.length) return null;
  const [y,m,d] = hoy.split('-').map(Number);
  const dia = Math.floor(Date.UTC(y, m-1, d) / 864e5);
  return opciones[dia % opciones.length];
}

function lineaPausa() {
  const p = pausaDeHoy();
  if (!p || PREVIA) return '';
  const hecha = pausasHoy.includes(PAUSA_PREFIJO + p.titulo);
  return `
    <div class="pausa">
      <a class="pausa-txt" href="${p.url}" target="_blank" rel="noopener">
        <div class="pausa-tit">Pausa corta · ${esc(p.titulo)} ↗</div>
        <div class="pausa-sub">${esc(p.sub)} · sentada</div>
      </a>
      ${hecha ? '<span class="pausa-ok">✓ hecha</span>'
              : '<button class="pausa-btn" onclick="hicePausa()">Lo hice</button>'}
    </div>`;
}

// Un tap y listo. No cuenta como la sesión del día ni pregunta nada.
async function hicePausa() {
  const p = pausaDeHoy();
  const nombre = PAUSA_PREFIJO + p.titulo;
  try {
    const s = sesionHoy?.id ? sesionHoy : await asegurarSesionHoy({});
    await sb('nova_ejercicios_sesion','POST', {sesion_id: s.id, ejercicio: nombre}, '?on_conflict=sesion_id,ejercicio');
    pausasHoy.push(nombre);
    pintarSesion();
  } catch (e) { console.error(e); mostrarError('No se guardó. Intenta otra vez.'); }
}

// "3 de 8": sólo cuenta, sin "te faltan" ni mensaje final. A los DIAS_PREGUNTA_BARRA días
// con registro, Nova pregunta una vez si sirve. La respuesta vive en este dispositivo.
function prefBarra() { try { return localStorage.getItem('nova_barra'); } catch (e) { return null; } }
function responderBarra(v) { try { localStorage.setItem('nova_barra', v); } catch (e) {} pintarSesion(); }

function bloqueProgreso() {
  const n = plan.filter(e => hechos.has(e.nombre)).length;
  const pref = prefBarra();
  let html = '';
  if (pref !== 'no' && n > 0) {
    html += `<div class="progreso"><div class="progreso-barra"><span style="width:${Math.round(100*n/plan.length)}%"></span></div>
      <div class="progreso-txt">${n} de ${plan.length}</div></div>`;
  }
  if (!pref && diasUsados >= DIAS_PREGUNTA_BARRA) {
    html += `<div class="pregunta">Llevas ${diasUsados} días con Nova. ¿Te sirve ver cuántos llevas ("3 de 8") en la sesión?
      <div class="pregunta-bot"><button onclick="responderBarra('si')">Sí, déjala</button><button onclick="responderBarra('no')">Quítala</button></div></div>`;
  }
  return html;
}

function forzarVersion(v) {
  version = v;
  plan = catalogo.filter(e => e.orden != null);
  empezarSesion(true);
}

// Lo que ya pasó, completo. Lo pendiente/previsto, en UNA línea que se despliega.
function pintarTimeline() {
  const pasados = hitos.filter(h => !h.previsto);
  const pendientes = hitos.filter(h => h.previsto);
  const li = h => {
    const cls = [h.previsto ? 'previsto' : '', h.fase_nueva && !h.previsto ? 'fase' : ''].join(' ');
    const fechaTxt = h.fecha ? fechaBonita(h.fecha) + (h.previsto ? ' · previsto' : '') : 'sin fecha';
    const accion = h.previsto && !PREVIA ? `<button class="tl-accion" onclick="marcarHito('${h.id}')">ya pasó</button>` : '';
    const faseTxt = h.fase_nueva && !h.previsto ? ` <span class="tl-fecha">→ Fase ${esc(h.fase_nueva)}</span>` : '';
    return `<li class="${cls}"><div class="tl-fecha">${esc(fechaTxt)}${accion}</div><div class="tl-desc">${esc(h.descripcion)}${faseTxt}</div></li>`;
  };
  // Se ve el último hito; los anteriores colapsan en una línea.
  const anteriores = pasados.slice(0, -1), ultimo = pasados.slice(-1);
  let html = '';
  if (anteriores.length) {
    html += verAnteriores
      ? anteriores.map(li).join('')
      : `<li class="mas"><button class="tl-pend" onclick="toggleAnteriores()">${anteriores.length} hito${anteriores.length>1?'s':''} anterior${anteriores.length>1?'es':''} ›</button></li>`;
  }
  html += ultimo.map(li).join('');
  if (pendientes.length) {
    html += verPendientes
      ? pendientes.map(li).join('') + `<li class="previsto"><button class="tl-pend" onclick="togglePendientes()">ocultar pendientes</button></li>`
      : `<li class="previsto"><button class="tl-pend" onclick="togglePendientes()">${pendientes.length} pendiente${pendientes.length>1?'s':''}: ${esc(pendientes.map(h => h.descripcion.replace(/\.$/,'')).join(' · '))} ›</button></li>`;
  }
  $('timeline').innerHTML = html;
}
function togglePendientes() { verPendientes = !verPendientes; pintarTimeline(); }
function toggleAnteriores() { verAnteriores = !verAnteriores; pintarTimeline(); }

// ═══ GUARDAR ═══
async function asegurarSesionHoy(campos) {
  const filas = await sb('nova_sesiones','POST', {fecha:hoy, fase, ...campos, updated_at:new Date().toISOString()}, '?on_conflict=fecha');
  sesionHoy = filas[0];
  return sesionHoy;
}

// ═══ DOLOR ═══
async function setDolor(v) {
  if (PREVIA) return;
  pintarEscala('escala-dolor', v);
  try {
    await asegurarSesionHoy({dolor_pie: v});
    pintarTodo();
  } catch (e) { console.error(e); mostrarError('No se guardó el dolor. Intenta otra vez.'); }
}
function cambiarDolor() {
  pieAbierto = true; pintarPie();
  $('card-dolor').classList.remove('oculto');
  $('card-dolor').scrollIntoView({block:'center', behavior:'smooth'});
}

// ═══ MI PIE: movilidad, ánimo y nota (tabla recuperacion) ═══
let pie = {movilidad:'', animo:'', nota_libre:''};
let pieTimer = null;
let pieAbierto = (() => { try { return localStorage.getItem('nova_pie_cerrado') !== hoy; } catch(e) { return true; } })();

function pintarPie() {
  const visible = pieAbierto && !PREVIA && !sesionHoy?.estado && dolorNum() !== null;
  $('card-pie').classList.toggle('oculto', !visible);
  Object.keys(PIE_VOCAB).forEach(campo => {
    $('pie-'+campo).innerHTML = PIE_VOCAB[campo].map(v =>
      `<button class="pie-pill${pie[campo]===v?' sel':''}" data-v="${esc(v)}" onclick="setPie('${campo}',this.dataset.v)">${esc(v)}</button>`).join('');
  });
  if (document.activeElement !== $('pie-nota')) $('pie-nota').value = pie.nota_libre || '';
}

function setPie(campo, v) {
  pie[campo] = pie[campo] === v ? '' : v;   // tocar de nuevo lo quita
  pintarPie(); guardarPie();
  // Con las dos respondidas, la tarjeta se va sola (salvo que estés escribiendo la nota)
  if (pie.movilidad && pie.animo) setTimeout(() => { if (document.activeElement !== $('pie-nota')) cerrarPie(); }, 1200);
}
function setPieNota(v) { pie.nota_libre = v; guardarPie(); }
function cerrarPie() {
  pieAbierto = false;
  try { localStorage.setItem('nova_pie_cerrado', hoy); } catch(e) {}
  guardarPieYa(); pintarTodo();
}
function guardarPie() { clearTimeout(pieTimer); pieTimer = setTimeout(guardarPieYa, 800); }
async function guardarPieYa() {
  if (!pieTimer) return;
  clearTimeout(pieTimer); pieTimer = null;
  try {
    await sb('recuperacion','POST',{fecha:hoy, movilidad:pie.movilidad||null, animo:pie.animo||null, nota_libre:pie.nota_libre||null},'?on_conflict=fecha');
  } catch (e) { console.error(e); mostrarError('No se guardó lo del pie. Intenta otra vez.'); }
}
window.addEventListener('pagehide', guardarPieYa);
document.addEventListener('visibilitychange', () => { if (document.hidden) guardarPieYa(); });

// ═══ DESCANSO ═══
async function descansar() {
  if (PREVIA) return;
  try {
    await asegurarSesionHoy({estado:'descanso'});
    pintarTodo();
  } catch (e) { console.error(e); mostrarError('No se guardó. Intenta otra vez.'); }
}

// ═══ SESIÓN EN CURSO ═══
function empezarSesion(yaArmado) {
  if (!yaArmado) armarPlan();
  inicioSesion = Date.now();
  $('run-titulo').textContent = VERSIONES[version];
  $('run-lista').innerHTML = plan.map((e,i) => `
    <div class="ej-run${hechos.has(e.nombre) ? ' ok' : ''}" id="ejr-${i}">
      <button class="check" onclick="toggleEj(${i})" aria-label="Hecho"><span>✓</span></button>
      <div>
        <div><span class="ej-run-nombre">${esc(e.nombre)}</span><span class="ej-run-dosis">${esc(e.dosis||'')}</span></div>
        <div class="ej-run-desc">${esc(e.descripcion||'')}</div>
        ${e.contraindicaciones ? `<div class="ej-run-ojo">${esc(e.contraindicaciones)}</div>` : ''}
      </div>
    </div>`).join('');
  mostrarVista('vista-sesion');
  window.scrollTo(0,0);
}

async function toggleEj(i) {
  const e = plan[i];
  const on = !hechos.has(e.nombre);
  on ? hechos.add(e.nombre) : hechos.delete(e.nombre);
  $('ejr-'+i)?.classList.toggle('ok', on);
  pintarSesion();
  if (PREVIA) return;
  try {
    const s = sesionHoy?.id ? sesionHoy : await asegurarSesionHoy({version});
    if (on) {
      const m = (e.dosis||'').match(/^(\d+)\s*×\s*(.+)$/);
      await sb('nova_ejercicios_sesion','POST', {
        sesion_id: s.id, catalogo_id: e.id, ejercicio: e.nombre,
        series: m ? +m[1] : null, reps: m ? m[2] : (e.dosis || null)
      }, '?on_conflict=sesion_id,ejercicio');
    } else {
      await sb('nova_ejercicios_sesion','DELETE', null, `?sesion_id=eq.${s.id}&ejercicio=eq.${encodeURIComponent(e.nombre)}`);
    }
  } catch (err) { console.error(err); }
}

function salirSesion() { mostrarVista('vista-inicio'); }

function terminarSesion() { abrirCierre('sesion'); }

function abrirCierre(modo) {
  cierreModo = modo;
  $('btn-saltar-cierre').classList.toggle('oculto', modo !== 'video');
  sentiSel = null; fatigaSel = null; dolorCierre = dolorNum();
  pintarEscala('escala-dolor-cierre', dolorCierre);
  document.querySelectorAll('#senti button').forEach(b => b.classList.remove('sel'));
  pintarEscala('escala-fatiga', null);
  $('cierre-nota').value = '';
  $('btn-guardar-cierre').textContent = PREVIA ? 'Volver (vista previa)' : 'Guardar';
  mostrarVista('vista-cierre');
  window.scrollTo(0,0);
}

function setSenti(btn) {
  sentiSel = sentiSel === btn.dataset.v ? null : btn.dataset.v;
  document.querySelectorAll('#senti button').forEach(b => b.classList.toggle('sel', b.dataset.v === sentiSel));
}

async function guardarCierre() {
  if (PREVIA) { mostrarVista('vista-inicio'); return; }
  const btn = $('btn-guardar-cierre');
  btn.disabled = true;
  const reflexion = {
    como_me_senti: sentiSel,
    fatiga_percibida: fatigaSel,
    nota: $('cierre-nota').value.trim() || null
  };
  if (dolorCierre !== null) reflexion.dolor_pie = dolorCierre;
  try {
    // Video: ya quedó guardado como hecho; aquí sólo se suma lo reflexivo.
    await asegurarSesionHoy(cierreModo === 'video' ? reflexion : {
      estado: 'hecha',
      version,
      duracion_min: Math.max(1, Math.round((Date.now() - inicioSesion) / 60000)),
      completada: plan.every(e => hechos.has(e.nombre)),
      ...reflexion
    });
    mostrarVista('vista-inicio');
    pintarTodo();
  } catch (e) { console.error(e); mostrarError('No se guardó la sesión. Intenta otra vez.'); mostrarVista('vista-inicio'); }
  btn.disabled = false;
}

function saltarCierre() { mostrarVista('vista-inicio'); pintarTodo(); }

function mostrarVista(id) {
  ['vista-inicio','vista-sesion','vista-cierre'].forEach(v => $(v).classList.toggle('oculto', v !== id));
}

// ═══ HITOS ═══
function abrirHito() {
  $('hito-fecha').value = hoy;
  $('hito-desc').value = '';
  $('hito-fase').value = '';
  $('hito-form').classList.add('abierto');
  $('btn-hito').classList.add('oculto');
}
function cerrarHito() {
  $('hito-form').classList.remove('abierto');
  $('btn-hito').classList.remove('oculto');
}

async function guardarHito() {
  const desc = $('hito-desc').value.trim();
  if (!desc) return;
  const f = $('hito-fecha').value || hoy;
  try {
    await sb('nova_hitos','POST', {
      fecha: f, descripcion: desc,
      fase_nueva: $('hito-fase').value || null,
      previsto: f > hoy
    });
    cerrarHito();
    await recargarHitos();
  } catch (e) { console.error(e); mostrarError('No se guardó el hito.'); }
}

async function marcarHito(id) {
  const h = hitos.find(x => x.id === id);
  if (!h) return;
  try {
    await sb('nova_hitos','PATCH', {previsto:false, fecha: h.fecha && h.fecha <= hoy ? h.fecha : hoy}, `?id=eq.${id}`);
    await recargarHitos();
  } catch (e) { console.error(e); mostrarError('No se guardó.'); }
}

async function recargarHitos() {
  hitos = await sb('nova_hitos','GET',null,'?order=fecha.asc.nullslast,created_at.asc');
  const antes = fase;
  fase = faseActual();
  if (fase !== antes) catalogo = await sb('nova_catalogo_ejercicios','GET',null,`?fase=eq.${encodeURIComponent(fase)}&order=orden.asc.nullslast`);
  pintarTodo();
}

init();
</script>
