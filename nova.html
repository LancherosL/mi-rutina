<!DOCTYPE html>
<html lang="es">
<head>
<script src="auth.js?v=1"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nova">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Nova</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500;600&display=swap');

:root {
  --bg: #F2EDE4;
  --card: #FAFAF7;
  --ink: #1A1612;
  --muted: #8C7E6E;
  --terra: #B85C35;
  --terra-soft: rgba(184,92,53,0.10);
  --sage: #5C8A65;
  --sage-soft: rgba(92,138,101,0.12);
  --lavender: #7B6FA0;
  --lavender-soft: rgba(123,111,160,0.10);
  --line: rgba(26,22,18,0.08);
  --r: 22px;
  --r-sm: 14px;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--ink); min-height:100vh; }
button { font-family:inherit; color:inherit; border:none; background:none; cursor:pointer; }
input, select { font-family:inherit; font-size:16px; }

.wrap { max-width:520px; margin:0 auto; padding:18px 16px 60px; }

.header { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px; }
.titulo { font-family:'Cormorant Garamond',serif; font-size:34px; font-weight:600; letter-spacing:.5px; }
.fecha { font-size:13px; color:var(--muted); }
.fase-chip { font-size:12px; font-weight:600; color:var(--lavender); background:var(--lavender-soft);
  padding:5px 10px; border-radius:20px; }

.card { background:var(--card); border-radius:var(--r); padding:18px; margin-bottom:12px;
  box-shadow:0 1px 0 var(--line); }
.label { font-size:11px; font-weight:600; letter-spacing:1.2px; text-transform:uppercase; color:var(--muted); margin-bottom:10px; }

/* ReX */
.rex { display:flex; gap:12px; align-items:flex-start; }
.rex-avatar { flex:0 0 38px; height:38px; border-radius:50%; background:var(--ink); color:var(--bg);
  display:flex; align-items:center; justify-content:center; font-weight:600; font-size:13px; }
.rex-texto { font-family:'Cormorant Garamond',serif; font-size:20px; line-height:1.35; }
.rex-texto p + p { margin-top:6px; }
.rex-datos { margin-top:10px; display:flex; flex-wrap:wrap; gap:6px; }
.dato { font-size:12px; color:var(--muted); background:var(--bg); padding:4px 9px; border-radius:20px; }

/* Dolor */
.escala { display:grid; grid-template-columns:repeat(11,1fr); gap:4px; }
.escala button { height:40px; border-radius:10px; background:var(--bg); font-size:14px; font-weight:500; }
.escala button.sel { background:var(--ink); color:var(--bg); }
.escala-ext { display:flex; justify-content:space-between; font-size:11px; color:var(--muted); margin-top:6px; }
.pie-resumen { display:flex; justify-content:space-between; align-items:center; font-size:15px; }
.link { font-size:13px; color:var(--muted); text-decoration:underline; text-underline-offset:3px; padding:6px 0; }

/* Sesión */
.sesion-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; }
.sesion-nombre { font-family:'Cormorant Garamond',serif; font-size:24px; font-weight:600; }
.sesion-min { font-size:13px; color:var(--muted); }
.ej-lista { list-style:none; }
.ej { display:flex; justify-content:space-between; gap:10px; padding:9px 0; border-top:1px solid var(--line); font-size:15px; }
.ej:first-child { border-top:none; }
.ej-dosis { color:var(--muted); font-size:13px; white-space:nowrap; }
.botones { display:flex; gap:8px; margin-top:14px; }
.btn { flex:1; height:52px; border-radius:var(--r-sm); font-size:16px; font-weight:600; }
.btn-1 { background:var(--ink); color:var(--bg); }
.btn-2 { background:var(--bg); color:var(--ink); }
.btn:disabled { opacity:.4; }
.aviso { font-size:12px; color:var(--muted); margin-top:10px; }
.hecho-resumen { font-size:15px; line-height:1.5; }

/* Vista sesión en curso */
.ej-run { display:flex; gap:12px; padding:14px 0; border-top:1px solid var(--line); }
.ej-run:first-child { border-top:none; }
.check { flex:0 0 34px; height:34px; border-radius:50%; border:2px solid var(--line); background:var(--bg);
  font-size:16px; display:flex; align-items:center; justify-content:center; }
.ej-run.ok .check { background:var(--sage); border-color:var(--sage); color:#fff; }
.ej-run.ok .ej-run-nombre { color:var(--muted); }
.ej-run-nombre { font-weight:600; font-size:16px; }
.ej-run-dosis { font-size:13px; color:var(--terra); font-weight:600; margin-left:6px; }
.ej-run-desc { font-size:14px; line-height:1.45; margin-top:3px; color:#3d352d; }
.ej-run-ojo { font-size:12.5px; color:var(--terra); margin-top:4px; }

.senti { display:flex; gap:8px; }
.senti button { flex:1; height:56px; border-radius:var(--r-sm); background:var(--bg); font-size:26px; }
.senti button.sel { background:var(--sage-soft); outline:2px solid var(--sage); }
.nota-input { width:100%; border:none; background:var(--bg); border-radius:var(--r-sm); padding:12px; margin-top:12px; }
.sub { font-size:13px; color:var(--muted); margin:14px 0 8px; }

/* Timeline */
.tl { list-style:none; position:relative; padding-left:18px; }
.tl::before { content:''; position:absolute; left:5px; top:6px; bottom:6px; width:2px; background:var(--line); }
.tl li { position:relative; padding:6px 0 10px; }
.tl li::before { content:''; position:absolute; left:-18px; top:10px; width:12px; height:12px; border-radius:50%; background:var(--ink); }
.tl li.previsto::before { background:var(--card); border:2px solid var(--muted); box-sizing:border-box; }
.tl li.fase::before { background:var(--lavender); }
.tl-fecha { font-size:12px; color:var(--muted); }
.tl-desc { font-size:15px; }
.tl li.previsto .tl-desc { color:var(--muted); }
.tl-accion { font-size:12px; color:var(--muted); text-decoration:underline; margin-left:6px; }
.hito-form { display:none; margin-top:10px; }
.hito-form.abierto { display:block; }
.hito-form input, .hito-form select { width:100%; border:none; background:var(--bg); border-radius:var(--r-sm); padding:11px; margin-bottom:8px; }
.fila { display:flex; gap:8px; }

.error { font-size:13px; color:var(--terra); margin-top:8px; }
.oculto { display:none !important; }
</style>

      <div id="sesion-cuerpo"></div>
    </div>

    <div class="card">
      <div class="label">Recuperación</div>
      <ul class="tl" id="timeline"></ul>
      <button class="link" id="btn-hito" onclick="abrirHito()">+ anotar un hito</button>
      <div class="hito-form" id="hito-form">
        <input id="hito-desc" placeholder="Qué pasó (ej. radiografía: consolidando bien)">
        <div class="fila">
          <input type="date" id="hito-fecha">
          <select id="hito-fase"></select>
        </div>
        <div class="botones" style="margin-top:4px">
          <button class="btn btn-2" onclick="cerrarHito()">Cancelar</button>
          <button class="btn btn-1" onclick="guardarHito()">Guardar</button>
        </div>
      </div>
    </div>

    <div class="error oculto" id="error"></div>
  </div>

  <!-- ═══ SESIÓN EN CURSO ═══ -->
  <div id="vista-sesion" class="oculto">
    <div class="card">
      <div class="sesion-head">
        <div class="sesion-nombre" id="run-titulo">Sesión</div>
        <button class="link" onclick="salirSesion()">salir</button>
      </div>
      <div class="aviso" id="run-aviso" style="margin:0 0 6px">Si algo le pide al pie, se para ahí.</div>
      <div id="run-lista"></div>
      <div class="botones">
        <button class="btn btn-1" onclick="terminarSesion()">Terminé</button>
      </div>
    </div>
  </div>

  <!-- ═══ CIERRE ═══ -->
  <div id="vista-cierre" class="oculto">
    <div class="card">
      <div class="label">¿Cómo te sentiste?</div>
      <div class="senti" id="senti">
        <button data-v="bien" onclick="setSenti(this)">👍</button>
        <button data-v="regular" onclick="setSenti(this)">😐</button>
        <button data-v="mal" onclick="setSenti(this)">👎</button>
      </div>
      <div class="sub">Fatiga ahora (0 = fresca, 10 = agotada)</div>
      <div class="escala" id="escala-fatiga"></div>
      <input class="nota-input" id="cierre-nota" placeholder="Algo que quieras anotar (opcional)">
      <div class="botones">
        <button class="btn btn-1" id="btn-guardar-cierre" onclick="guardarCierre()">Guardar</button>
      </div>
    </div>
  </div>

</div>

<script>
// ═══════════════════════════════════════════════════════════════════
// NOVA — entrenador de Laura, con ReX. Spec: claude/nova-sistema.md
// Lee de Mi Sistema (registro_diario, recuperacion). NUNCA escribe ahí.
// Escribe sólo en tablas nova_*.
// ═══════════════════════════════════════════════════════════════════

const SUPABASE_URL = 'https://snwnqjltfyqlwyeyfjba.supabase.co';
const SUPABASE_KEY = 'sb_publishable_mHkufMizNWFEi1XUAbSAYA_Xs5-I_JH';

// Día en que arranca Nova. Antes de esto todo es vista previa: no se guarda.
const INICIO = '2026-10-22';

const FASES = {
  '1A': 'Bota, sin apoyo',
  '1B': 'Transición',
  '2':  'Fisioterapia',
  '3':  'Reintroducción',
  '4':  'Fortalecimiento'
};

// Umbrales de ReX. Se ajustan aquí.
const SUENO_POCO_H = 5.5;  // < → versión suave
const SUENO_MALA = 2;      // calidad ≤ → versión suave
const ENERGIA_BAJA = 2;    // ≤ → versión suave

// El dolor del pie vive en un solo lugar: tarjeta Recuperación de Mi Sistema
// (tabla `recuperacion`, en palabras). Nova sólo lo lee. Así lo interpreto:
const DOLOR_PALABRAS = { 'nada': 'bajo', 'leve': 'bajo', 'molesta': 'medio', 'duele mucho': 'alto', 'punzante': 'alto' };
const MI_SISTEMA_URL = 'mi_sistema.html';

const VERSIONES = {
  completa: 'Sesión completa',
  suave:    'Versión suave',
  minima:   'Sólo respirar y moverte'
};

// ── utilidades ──
function fechaLocal(d) {
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
const hoy = fechaLocal(new Date());
const ayer = fechaLocal(new Date(Date.now() - 864e5));
const PREVIA = hoy < INICIO;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function sb(tabla, method='GET', body=null, params='') {
  const headers = {'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`,'Content-Type':'application/json'};
  if (method !== 'GET') headers['Prefer'] = 'return=representation'+(params.includes('on_conflict')?',resolution=merge-duplicates':'');
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${tabla}${params}`, {method, headers, body: body?JSON.stringify(body):null});
  if (!res.ok) throw new Error(tabla+' HTTP '+res.status);
  const txt = await res.text();
  return txt ? JSON.parse(txt) : null;
}

function mostrarError(msg) { const e=$('error'); e.textContent=msg; e.classList.remove('oculto'); }

function fechaBonita(f) {
  if (!f) return '';
  const [y,m,d] = f.split('-').map(Number);
  return new Date(y,m-1,d).toLocaleDateString('es', {day:'numeric', month:'short'});
}

// Minutos estimados a partir de la dosis: "2 min", "2 × 12" (≈4 s/rep + 30 s pausa), "5 × 10 s" (+10 s pausa).
function minutosDe(dosis) {
  if (!dosis) return 0;
  let m;
  if ((m = dosis.match(/^(\d+(?:\.\d+)?)\s*min/))) return +m[1];
  if ((m = dosis.match(/^(\d+)\s*×\s*(\d+)\s*s/))) return +m[1] * (+m[2] + 10) / 60;
  if ((m = dosis.match(/^(\d+)\s*×\s*(\d+)/))) return (+m[1] * (+m[2] * 4 + 30)) / 60;
  return 0;
}

// ── estado ──
let reg = null;          // registro_diario de hoy (Mi Sistema)
let recup = null;        // recuperacion de hoy (Mi Sistema)
let sesionHoy = null;    // nova_sesiones de hoy
let sesionAyer = null;
let catalogo = [];       // ejercicios de la fase actual
let hitos = [];
let fase = '1A';
let plan = [];           // ejercicios de la versión de hoy
let version = 'completa';
let hechos = new Set();  // nombres marcados en la sesión en curso
let inicioSesion = null;
let sentiSel = null, fatigaSel = null;

// ═══ CARGA ═══
async function init() {
  $('fecha').textContent = new Date().toLocaleDateString('es', {weekday:'long', day:'numeric', month:'long'});
  construirEscala('escala-fatiga', v => { fatigaSel = v; pintarEscala('escala-fatiga', v); });
  $('hito-fase').innerHTML = '<option value="">Sin cambio de fase</option>' +
    Object.entries(FASES).map(([k,v]) => `<option value="${k}">Paso a Fase ${k} · ${v}</option>`).join('');
  await cargar();
  // Al volver de Mi Sistema (donde se anota el pie), releer sin recargar la página.
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && !$('vista-inicio').classList.contains('oculto')) cargar();
  });
}

async function cargar() {
  try {
    const [r, rc, ses, hs] = await Promise.all([
      sb('registro_diario','GET',null,`?fecha=eq.${hoy}&select=fecha,energia,sueno_horas,sueno_calidad,emocion,emocion_fina,ciclo_fase`),
      sb('recuperacion','GET',null,`?fecha=eq.${hoy}&select=dolor,movilidad,animo`),
      sb('nova_sesiones','GET',null,`?fecha=in.(${ayer},${hoy})`),
      sb('nova_hitos','GET',null,'?order=fecha.asc.nullslast,created_at.asc')
    ]);
    reg = r?.[0] || null;
    recup = rc?.[0] || null;
    sesionHoy = ses.find(s => s.fecha === hoy) || null;
    sesionAyer = ses.find(s => s.fecha === ayer) || null;
    hitos = hs || [];
    fase = faseActual();
    catalogo = await sb('nova_catalogo_ejercicios','GET',null,`?fase=eq.${encodeURIComponent(fase)}&order=orden.asc.nullslast`);
  } catch (e) {
    console.error(e);
    mostrarError('No pude conectar con la base. Revisa la conexión y recarga.');
  }
  pintarTodo();
}

function faseActual() {
  const cambios = hitos.filter(h => h.fase_nueva && !h.previsto && h.fecha && h.fecha <= hoy);
  return cambios.length ? cambios[cambios.length-1].fase_nueva : '1A';
}

// ═══ ReX ═══
function dolorNivel() { return recup?.dolor ? (DOLOR_PALABRAS[recup.dolor] || null) : null; }
function suenoMalo() {
  if (!reg) return false;
  return (reg.sueno_horas != null && +reg.sueno_horas < SUENO_POCO_H) ||
         (reg.sueno_calidad != null && reg.sueno_calidad <= SUENO_MALA);
}
function energiaBaja() { return reg?.energia != null && reg.energia <= ENERGIA_BAJA; }

function elegirVersion() {
  const d = dolorNivel();
  if (d === 'alto') return 'minima';
  if (d === 'medio' || suenoMalo() || energiaBaja()) return 'suave';
  return 'completa';
}

function horasTexto(h) {
  const hh = Math.floor(h), mm = Math.round((h - hh) * 60);
  return mm ? `${hh} h ${mm} min` : `${hh} h`;
}

function textoRex() {
  const lineas = [];
  const d = dolorNivel();

  // 1. Lo que sé de hoy
  const obs = [];
  if (reg?.sueno_horas != null) {
    let s = `Dormiste ${horasTexto(+reg.sueno_horas)}`;
    if (reg.sueno_calidad != null) s += reg.sueno_calidad <= SUENO_MALA ? ' y no muy bien' : reg.sueno_calidad >= 4 ? ' y bien' : '';
    obs.push(s + '.');
  }
  if (reg?.emocion) obs.push(`Tu ánimo: ${reg.emocion.replace(/^\S+\s/, '').toLowerCase()}${reg.emocion_fina ? ', ' + reg.emocion_fina : ''}.`);
  if (obs.length) lineas.push(obs.join(' '));

  // 2. Ayer
  if (sesionAyer?.estado === 'hecha') {
    let s = 'Ayer hiciste la sesión';
    if (sesionAyer.fatiga_percibida != null) s += ` y quedaste en fatiga ${sesionAyer.fatiga_percibida}`;
    lineas.push(s + '.');
  } else if (sesionAyer?.estado === 'descanso') {
    lineas.push('Ayer descansaste.');
  }

  // 3. Lo que propongo
  if (sesionHoy?.estado === 'hecha') {
    lineas.push('La de hoy ya está. Lo que queda del día es para el cuerpo.');
  } else if (sesionHoy?.estado === 'descanso') {
    lineas.push('Hoy es descanso. Si más tarde te provoca moverte, la sesión sigue aquí.');
  } else if (PREVIA) {
    lineas.push('Mañana arrancamos. Te dejo la primera sesión lista abajo para que la mires.');
  } else if (d === 'alto') {
    lineas.push(`Con el pie ${recup.dolor === 'punzante' ? 'punzante' : 'doliendo así'}, hoy no hay nada que demostrar. Si quieres, sólo respirar y mover cuello y hombros. Descansar también está bien.`);
  } else if (d === 'medio') {
    lineas.push('El pie molesta hoy. Te propongo la versión suave.');
  } else if (suenoMalo() || energiaBaja()) {
    lineas.push('Con ese descanso, va la versión suave. Corta y sin exigirte.');
  } else if (d === null) {
    lineas.push('No sé cómo está el pie hoy. Si lo anotas en Recuperación, ajusto la sesión.');
  } else {
    lineas.push(`Si te provoca, la sesión de hoy está lista. Unos ${minutosPlan()} minutos.`);
  }
  if (reg?.ciclo_fase === 'Menstrual' && !sesionHoy?.estado && !PREVIA) {
    lineas.push('Estás en fase menstrual: si el cuerpo pide menos, se le da menos.');
  }
  return lineas;
}

function datosRex() {
  const out = [];
  if (recup?.dolor) out.push(`🦶 ${recup.dolor === 'nada' ? 'sin dolor' : recup.dolor}`);
  if (reg?.sueno_horas != null) out.push(`😴 ${horasTexto(+reg.sueno_horas)}`);
  if (reg?.energia != null) out.push(`⚡ energía ${reg.energia}/5`);
  if (reg?.ciclo_fase) out.push(`🌙 ${reg.ciclo_fase.toLowerCase()}`);
  return out;
}

// ═══ PINTAR ═══
function pintarTodo() {
  armarPlan();
  $('fase-chip').textContent = `Fase ${fase} · ${FASES[fase] || ''}`;
  $('rex-texto').innerHTML = textoRex().map(l => `<p>${esc(l)}</p>`).join('') +
    (dolorNivel() === null && !PREVIA && !sesionHoy?.estado ? `<a class="link" href="${MI_SISTEMA_URL}">anotar el pie en Mi Sistema</a>` : '');
  $('rex-datos').innerHTML = datosRex().map(d => `<span class="dato">${esc(d)}</span>`).join('');
  pintarSesion();
  pintarTimeline();
}

function construirEscala(id, fn) {
  const cont = $(id);
  cont.innerHTML = Array.from({length:11}, (_,i) => `<button data-v="${i}">${i}</button>`).join('');
  cont.querySelectorAll('button').forEach(b => b.onclick = () => fn(+b.dataset.v));
}
function pintarEscala(id, v) {
  $(id).querySelectorAll('button').forEach(b => b.classList.toggle('sel', v !== null && +b.dataset.v === v));
}

function armarPlan() {
  version = elegirVersion();
  const base = catalogo.filter(e => e.orden != null);
  plan = version === 'minima' ? base.filter(e => e.minima)
       : version === 'suave'  ? base.filter(e => e.suave)
       : base;
}

function minutosPlan() { return Math.round(plan.reduce((s,e) => s + minutosDe(e.dosis), 0)); }

function pintarSesion() {
  $('sesion-label').textContent = PREVIA ? `Sesión de mañana · ${fechaBonita(INICIO)}` : 'Sesión de hoy';
  const c = $('sesion-cuerpo');

  if (!plan.length) {
    c.innerHTML = `<div class="hecho-resumen">Todavía no hay plan para la Fase ${esc(fase)}. Lo armamos cuando llegue.</div>`;
    return;
  }

  if (sesionHoy?.estado === 'hecha') {
    const caras = {bien:'👍', regular:'😐', mal:'👎'};
    const partes = ['Hecha'];
    if (sesionHoy.duracion_min) partes.push(`${sesionHoy.duracion_min} min`);
    if (sesionHoy.como_me_senti) partes.push(caras[sesionHoy.como_me_senti]);
    if (sesionHoy.fatiga_percibida != null) partes.push(`fatiga ${sesionHoy.fatiga_percibida}`);
    c.innerHTML = `<div class="hecho-resumen">${partes.join(' · ')}</div>` +
      (sesionHoy.nota ? `<div class="aviso">${esc(sesionHoy.nota)}</div>` : '');
    return;
  }

  const min = minutosPlan();
  c.innerHTML = `
    <div class="sesion-head">
      <div class="sesion-nombre">${VERSIONES[version]}</div>
      <div class="sesion-min">≈ ${min} min</div>
    </div>
    <ul class="ej-lista">${plan.map(e => `<li class="ej"><span>${esc(e.nombre)}</span><span class="ej-dosis">${esc(e.dosis||'')}</span></li>`).join('')}</ul>
    <div class="botones">
      <button class="btn btn-2" onclick="descansar()" ${PREVIA?'disabled':''}>${sesionHoy?.estado==='descanso'?'Descansando':'Hoy descanso'}</button>
      <button class="btn btn-1" onclick="empezarSesion()">${PREVIA?'Ver cómo es':'Hacer sesión'}</button>
    </div>
    ${PREVIA ? '<div class="aviso">Vista previa: hoy nada se guarda. Mañana sí.</div>' : ''}
    ${version === 'suave' && !PREVIA ? `<button class="link" onclick="forzarVersion('completa')">prefiero la completa</button>` : ''}`;
}

function forzarVersion(v) {
  version = v;
  plan = catalogo.filter(e => e.orden != null);
  empezarSesion(true);
}

function pintarTimeline() {
  const fechados = hitos.filter(h => h.fecha);
  const sinFecha = hitos.filter(h => !h.fecha);
  $('timeline').innerHTML = [...fechados, ...sinFecha].map(h => {
    const cls = [h.previsto ? 'previsto' : '', h.fase_nueva && !h.previsto ? 'fase' : ''].join(' ');
    const fechaTxt = h.fecha ? fechaBonita(h.fecha) + (h.previsto ? ' · previsto' : '') : 'pendiente';
    const accion = h.previsto && !PREVIA ? `<button class="tl-accion" onclick="marcarHito('${h.id}')">ya pasó</button>` : '';
    const faseTxt = h.fase_nueva && !h.previsto ? ` <span class="tl-fecha">→ Fase ${esc(h.fase_nueva)}</span>` : '';
    return `<li class="${cls}"><div class="tl-fecha">${esc(fechaTxt)}${accion}</div><div class="tl-desc">${esc(h.descripcion)}${faseTxt}</div></li>`;
  }).join('');
}

// ═══ GUARDAR ═══
async function asegurarSesionHoy(campos) {
  const filas = await sb('nova_sesiones','POST', {fecha:hoy, fase, ...campos, updated_at:new Date().toISOString()}, '?on_conflict=fecha');
  sesionHoy = filas[0];
  return sesionHoy;
}

// ═══ DESCANSO ═══
async function descansar() {
  if (PREVIA) return;
  try {
    await asegurarSesionHoy({estado:'descanso'});
    pintarTodo();
  } catch (e) { console.error(e); mostrarError('No se guardó. Intenta otra vez.'); }
}

// ═══ SESIÓN EN CURSO ═══
function empezarSesion(yaArmado) {
  if (!yaArmado) armarPlan();
  hechos = new Set();
  inicioSesion = Date.now();
  $('run-titulo').textContent = VERSIONES[version];
  $('run-lista').innerHTML = plan.map((e,i) => `
    <div class="ej-run" id="ejr-${i}">
      <button class="check" onclick="toggleEj(${i})" aria-label="Hecho">✓</button>
      <div>
        <div><span class="ej-run-nombre">${esc(e.nombre)}</span><span class="ej-run-dosis">${esc(e.dosis||'')}</span></div>
        <div class="ej-run-desc">${esc(e.descripcion||'')}</div>
        ${e.contraindicaciones ? `<div class="ej-run-ojo">${esc(e.contraindicaciones)}</div>` : ''}
      </div>
    </div>`).join('');
  mostrarVista('vista-sesion');
  window.scrollTo(0,0);
}

async function toggleEj(i) {
  const e = plan[i];
  const on = !hechos.has(e.nombre);
  on ? hechos.add(e.nombre) : hechos.delete(e.nombre);
  $('ejr-'+i).classList.toggle('ok', on);
  if (PREVIA) return;
  try {
    const s = sesionHoy?.id ? sesionHoy : await asegurarSesionHoy({version});
    if (on) {
      const m = (e.dosis||'').match(/^(\d+)\s*×\s*(.+)$/);
      await sb('nova_ejercicios_sesion','POST', {
        sesion_id: s.id, catalogo_id: e.id, ejercicio: e.nombre,
        series: m ? +m[1] : null, reps: m ? m[2] : (e.dosis || null)
      }, '?on_conflict=sesion_id,ejercicio');
    } else {
      await sb('nova_ejercicios_sesion','DELETE', null, `?sesion_id=eq.${s.id}&ejercicio=eq.${encodeURIComponent(e.nombre)}`);
    }
  } catch (err) { console.error(err); }
}

function salirSesion() { mostrarVista('vista-inicio'); }

function terminarSesion() {
  sentiSel = null; fatigaSel = null;
  document.querySelectorAll('#senti button').forEach(b => b.classList.remove('sel'));
  pintarEscala('escala-fatiga', null);
  $('cierre-nota').value = '';
  $('btn-guardar-cierre').textContent = PREVIA ? 'Volver (vista previa)' : 'Guardar';
  mostrarVista('vista-cierre');
  window.scrollTo(0,0);
}

function setSenti(btn) {
  sentiSel = sentiSel === btn.dataset.v ? null : btn.dataset.v;
  document.querySelectorAll('#senti button').forEach(b => b.classList.toggle('sel', b.dataset.v === sentiSel));
}

async function guardarCierre() {
  if (PREVIA) { mostrarVista('vista-inicio'); return; }
  const btn = $('btn-guardar-cierre');
  btn.disabled = true;
  try {
    await asegurarSesionHoy({
      estado: 'hecha',
      version,
      duracion_min: Math.max(1, Math.round((Date.now() - inicioSesion) / 60000)),
      completada: hechos.size === plan.length,
      como_me_senti: sentiSel,
      fatiga_percibida: fatigaSel,
      nota: $('cierre-nota').value.trim() || null
    });
    mostrarVista('vista-inicio');
    pintarTodo();
  } catch (e) { console.error(e); mostrarError('No se guardó la sesión. Intenta otra vez.'); mostrarVista('vista-inicio'); }
  btn.disabled = false;
}

function mostrarVista(id) {
  ['vista-inicio','vista-sesion','vista-cierre'].forEach(v => $(v).classList.toggle('oculto', v !== id));
}

// ═══ HITOS ═══
function abrirHito() {
  $('hito-fecha').value = hoy;
  $('hito-desc').value = '';
  $('hito-fase').value = '';
  $('hito-form').classList.add('abierto');
  $('btn-hito').classList.add('oculto');
}
function cerrarHito() {
  $('hito-form').classList.remove('abierto');
  $('btn-hito').classList.remove('oculto');
}

async function guardarHito() {
  const desc = $('hito-desc').value.trim();
  if (!desc) return;
  const f = $('hito-fecha').value || hoy;
  try {
    await sb('nova_hitos','POST', {
      fecha: f, descripcion: desc,
      fase_nueva: $('hito-fase').value || null,
      previsto: f > hoy
    });
    cerrarHito();
    await recargarHitos();
  } catch (e) { console.error(e); mostrarError('No se guardó el hito.'); }
}

async function marcarHito(id) {
  const h = hitos.find(x => x.id === id);
  if (!h) return;
  try {
    await sb('nova_hitos','PATCH', {previsto:false, fecha: h.fecha && h.fecha <= hoy ? h.fecha : hoy}, `?id=eq.${id}`);
    await recargarHitos();
  } catch (e) { console.error(e); mostrarError('No se guardó.'); }
}

async function recargarHitos() {
  hitos = await sb('nova_hitos','GET',null,'?order=fecha.asc.nullslast,created_at.asc');
  const antes = fase;
  fase = faseActual();
  if (fase !== antes) catalogo = await sb('nova_catalogo_ejercicios','GET',null,`?fase=eq.${encodeURIComponent(fase)}&order=orden.asc.nullslast`);
  pintarTodo();
}

init();
</script>
